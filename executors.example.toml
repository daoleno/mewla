# Example executor profiles for ~/.mewla/executors.toml
#
# Copy:
#   cp executors.example.toml ~/.mewla/executors.toml
#
# Edit executor definitions/commands and restart mewla so the catalog reloads.
# Brain picks each Worker's executor, model and reasoning from its routing.md.
# If this file is absent, mewla keeps its built-in defaults from
# daemon/work/executors.go — shipping this example does NOT change those
# runtime defaults.
#
# One authenticated executor is enough. Delete [[executors]] blocks you do not use.
#
# WARNING: Mewla runs every agent with full authority: no approvals, no
# sandbox. Brain, Workers and scheduled actions add the bypass flags themselves
# (see docs/executors.md), so plain commands below are enough for Codex and
# Claude. Do not use Mewla on a machine whose secrets you cannot risk.

[[executors]]
name = "codex"
command = "codex"

[[executors]]
name = "claude"
command = "claude"

[[executors]]
name = "agent"
command = "cursor-agent --force --sandbox disabled"
kind = "cursor"

[[executors]]
name = "grok"
command = "grok --no-alt-screen --permission-mode bypassPermissions"

[[executors]]
name = "pi"
command = "pi"
kind = "pi"

[[executors]]
name = "opencode"
command = "opencode --auto"
kind = "opencode"

# Pi has no approval gate. Calendar may append --no-extensions so extension
# ui.confirm gates cannot stall unattended work. Brain/daemon inject an absolute
# --session path for Mewla-owned Pi sessions.
