# xcodegen spec for the iOS host. client/scripts/fetch-nsh.sh --ios puts the framework in Frameworks/;
# NSH_FRAMEWORK=NativeShellDev xcodegen generate makes a project that can hot reload from `nsh dev`.
name: Mewla
options:
  bundleIdPrefix: com.daoleno
  deploymentTarget: { iOS: "16.0" }
settings:
  base:
    # The terminal's libghostty-vt: scripts/build-libghostty-ios.sh builds GhosttyVt.xcframework into
    # native/terminal-vt/libs/ios (CI: .github/actions/ios-native), beside the lock the daemon's engine shares.
    # `xcodebuild MEWLA_GHOSTTY=<terminal-vt dir>` points elsewhere (Android: -Pmewla.ghostty). Declared on the
    # project so every target resolves the xcframework's source tree from it.
    MEWLA_GHOSTTY: $(SRCROOT)/../../native/terminal-vt
    # The Expo app's identity, so the App Store / TestFlight build replaces it in place: the app,
    # its Live Activity / widget extension (`.live`) and their App Group all follow from it.
    # Preview builds pass MEWLA_APP_ID=com.daoleno.mewla.preview (not PRODUCT_BUNDLE_IDENTIFIER,
    # which on the command line would give every target the app's id).
    MEWLA_APP_ID: com.daoleno.mewla
    # The version of client/ui/nsh.json without -beta.N, and its build number by the rule in
    # scripts/lib/release_identity.py (Y·10 000 + Z·100 + 99 for X.Y.Z, + N for X.Y.Z-beta.N): above the
    # Expo app's build 140. scripts/prepare-release.py writes both, verify-release-identity.sh checks them,
    # and ios-release.yml passes the same values to xcodebuild.
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "40299"
    # The App Store profiles the release signs each target with (ios-release.yml passes their names);
    # empty for local and Simulator builds.
    MEWLA_APP_PROFILE: ""
    MEWLA_LIVE_PROFILE: ""
    # Where this build goes, for the in-app update (Info.plist MewlaDistribution, `update.info`):
    # testflight (told of a newer TestFlight build, opens TestFlight), app-store or none (nothing).
    # The release passes it to xcodebuild: `xcodebuild MEWLA_IOS_DISTRIBUTION=testflight` (an
    # environment variable does not override this value). Only the Preview identity has a TestFlight feed.
    MEWLA_IOS_DISTRIBUTION: none
    SWIFT_VERSION: "5.0"
    # NativeShell.xcframework's Simulator slice is arm64 only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    DEVELOPMENT_TEAM: HD84J3DJ2B
    CODE_SIGN_STYLE: Automatic
  configs:
    # The APNs environment the signing profile grants: Xcode's development profile, the App Store one.
    Debug: { MEWLA_APS_ENVIRONMENT: development }
    Release: { MEWLA_APS_ENVIRONMENT: production }
targets:
  Mewla:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      # The terminal's C++ shared with Android (the VT packer, the drawn glyphs) and its bundled
      # font, a `fonts` folder in the bundle (TerminalFonts.swift).
      - { path: ../native/terminal, excludes: ["fonts"] }
      - { path: ../native/terminal/fonts, type: folder, buildPhase: resources }
      - { path: build/nsh, type: folder, buildPhase: resources }
      - { path: Assets.xcassets }
    dependencies:
      - { framework: "Frameworks/${NSH_FRAMEWORK}.xcframework", embed: false }
      - { target: MewlaLiveWidgets, embed: true }
      # Static, linked in; its path is relative to the MEWLA_GHOSTTY build setting (a custom source tree).
      - { sdk: libs/ios/GhosttyVt.xcframework, root: MEWLA_GHOSTTY }
    preBuildScripts:
      - name: Check libghostty-vt
        basedOnDependencyAnalysis: false
        script: |
          xcf="$MEWLA_GHOSTTY/libs/ios/GhosttyVt.xcframework"
          [ -f "$xcf/Info.plist" ] && exit 0
          echo "error: libghostty-vt for iOS is missing ($xcf). Build it: ./scripts/build-libghostty-ios.sh, or pass MEWLA_GHOSTTY=<terminal-vt dir> to xcodebuild."
          exit 1
      - name: Bundle client/ui
        basedOnDependencyAnalysis: false
        script: |
          set -e
          "${NSH:-$HOME/.nsh/bin/nsh}" build --release -o "$SRCROOT/build/nsh" "$SRCROOT/../ui"
          # The source map is for `nsh symbolicate`, not for the phone: out of the bundled folder, where
          # ios-release.yml keeps it as the build's symbols artifact.
          [ ! -f "$SRCROOT/build/nsh/bundle.js.map" ] || mv -f "$SRCROOT/build/nsh/bundle.js.map" "$SRCROOT/build/bundleUi.js.map"
    postCompileScripts:
      # The Ghostty MIT notice (the text Settings > Open-source licenses shows) also at the bundle root, where
      # the Expo app had it: scripts/verify-ios-artifact.sh checks it in the Simulator app and the IPA.
      - name: Bundle the Ghostty notice
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          cp "$SRCROOT/../ui/more/settings/licenses/texts/Ghostty-MIT.txt" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GHOSTTY-MIT.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MEWLA_APP_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(MEWLA_APP_PROFILE)
        # iPhone only, as the Expo app was. On each shipped target: XcodeGen's iOS preset sets 1,2 per
        # target, which beats a project-level value (App Store Connect then wants iPad orientations,
        # 90474). scripts/verify-ios-artifact.sh checks UIDeviceFamily in the IPA.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Mewla
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-ObjC -lc++"
        # client/native/terminal: TerminalVt.cpp over libghostty-vt and TerminalGlyphs.cpp, called from
        # Swift through their C headers.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Terminal/TerminalBridge.h
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme:
      testTargets: [MewlaTests]
    entitlements:
      path: build/Mewla.entitlements
      properties:
        aps-environment: $(MEWLA_APS_ENVIRONMENT)
        com.apple.security.application-groups: [group.$(MEWLA_APP_ID)]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Mewla
        MewlaDistribution: $(MEWLA_IOS_DISTRIBUTION)
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Allow Mewla to access your camera to scan Mewla pairing QR codes.
        NSLocalNetworkUsageDescription: Allow Mewla to connect to your self-hosted daemon on the local network.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true, NSAllowsArbitraryLoads: false }
        # A live_state push (content-available) wakes the app to update the Live Activity and widgets.
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        UILaunchScreen: { UIColorName: LaunchBackground }
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - { UISceneConfigurationName: Default, UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate }
        CFBundleURLTypes:
          - { CFBundleURLName: com.daoleno.mewla, CFBundleURLSchemes: [mewla] }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  # The Dynamic Island, Lock Screen Live Activity and home-screen widgets: the Expo app's extension
  # (mewla-live), same name, bundle id and widget kinds, so placed widgets and a running
  # activity carry over the upgrade.
  MewlaLiveWidgets:
    type: app-extension
    platform: iOS
    # Widgets and Live Activities need containerBackground and Text(timerInterval:) (iOS 17).
    deploymentTarget: "17.5"
    sources:
      - LiveExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MEWLA_APP_ID).live
        PROVISIONING_PROFILE_SPECIFIER: $(MEWLA_LIVE_PROFILE)
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: MewlaLiveWidgets
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
    entitlements:
      path: build/MewlaLiveWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(MEWLA_APP_ID)]
    info:
      path: build/LiveInfo.plist
      properties:
        CFBundleDisplayName: Mewla
        NSExtension: { NSExtensionPointIdentifier: com.apple.widgetkit-extension }
  MewlaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: Mewla }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MEWLA_APP_ID).tests
