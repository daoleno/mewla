[package]
name = "mewla-macos"
version = "0.4.17"
edition = "2024"
publish = false
description = "Mewla for Mac: the AppKit host around client/ui that carries this computer's daemon"

[[bin]]
name = "Mewla"
path = "src/main.rs"

# Its own workspace: not a member of anything above it.
[workspace]

[dependencies]
log = "0.4"
serde_json = "1"
# Mewla Relay's pinned tunnels (link.rs): TLS 1.3 to the computer's transport key; already in the lock through NSH's
# networking. Not tied to macOS, so `cargo test` runs them anywhere.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103.17", default-features = false, features = ["ring", "std", "alloc"] }
ring = "0.17"
libc = "0.2"

# Pinned to the NSH the bundle is built with (client/scripts/fetch-nsh.sh, client/README.md): the bytecode and the
# runtime must be the same version. The features are those of NSH's release runner (nsh-macos-app): the app uses
# zlib, crypto, WebSocket, the terminal, SVG and the rest.
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.6.1", features = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg"] }
nsh-platform-apple = "=0.6.1"
nsh-engine = "=0.6.1"
# The main window's launch options (MainWindowOptions: its title bar and kept placement, main.rs).
nsh-core = "=0.6.1"
nsh-base = "=0.6.1"
dispatch2 = "0.3.1"
core-foundation = "0.10.1"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError", "NSArray", "NSBundle", "NSDictionary", "NSValue", "NSURL", "NSGeometry", "NSObject", "NSEnumerator"] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService", "objc2-foundation"] }
# The permission panel beside System Settings (permissions.rs); already in the lock through NSH.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2-core-foundation", "NSFontDescriptor", "NSApplication", "NSResponder", "NSView", "NSControl", "NSImageView", "NSImage", "NSPanel", "NSWindow", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFont", "NSRunningApplication", "NSScreen", "NSText", "NSTextField", "NSWorkspace", "NSPasteboard", "NSGraphics", "NSAccessibility", "NSAccessibilityProtocols"] }
# The release's secrets in the Keychain (secure.rs); already in the lock through NSH's networking.
security-framework = "3.7.0"

# NSH 0.6.1 plus what Mewla needs before NSH ships it (branch mewla/v0.6.1-file-contents of daoleno/nsh, proposed
# upstream): a drop or a Finder paste hands the files over with their contents, so the app reads what the person gave
# it without an fs grant; an image dragged out of a browser and the screenshot thumbnail (file promises, image data)
# drop like files; a Finder copy pasted into a field that listens to pastes does not insert the files' names; each
# fetch starts in an autorelease pool, so an upload's body does not stay in memory. Every nsh crate comes from that
# commit (one nsh-core); the JS bundle is still built by the NSH 0.6.1 CLI.
# A closed sheet's late dismissal no longer reaches the page under it (#3014); Android text selection follows the
# text as drawn, survives a scroll, ends on Back, shows the magnifier, lists the app's menu items first and retints
# its handles (#3018-#3023). The same commit is the one every host embeds: client/scripts/fetch-nsh.sh installs
# the Android and iOS runtimes built from it.
# Goes once an NSH release has longbridge/nsh#2964 (merged), #3014, #3015, #3016, #3017 and #3018-#3023.
[patch.crates-io]
nsh-base = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-core = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-engine = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-i18n = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-js = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-macros = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-package = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-platform-apple = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-platform-macos = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }
nsh-updater = { git = "https://github.com/daoleno/nsh", rev = "77f4496c8d1daa38e417c9ac2cf83c1be1bdb199" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The warm Mac loop's host builds only (client/macos/scripts/loop): release code without LTO, many codegen units and
# incremental, so a change to this crate relinks without the thin-LTO pass. Never shipped: package.sh, the release
# workflows and every proof lane build with [profile.release] above, unchanged.
[profile.loop]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
