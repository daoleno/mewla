# Hosted remote access (Kamal 2), on the host shared with Onlora.
# Runbook: docs/internal/mewla-relay.md, "Hosted remote access".
#
#   connect.mewla.ai:443   relay -> SNI route (PROXY header) -> account
#                          service, which holds its own certificate
#   connect.mewla.ai:8443  relay control plane (daemons)
#   *.m.mewla.ai:443       relay -> a computer, TLS passed through untouched
#
# Nothing here uses kamal-proxy: SNI passthrough cannot go through it, and
# Onlora owns its configuration. Host :443 is free because Onlora's proxy
# publishes only :80.
minimum_version: 2.12.0

service: mewla-link
image: daoleno/mewla-link

primary_role: account

servers:
  account:
    hosts:
      - 167.114.116.27
    proxy: false
    cmd: >-
      /usr/local/bin/mewla-account
      -addr=:8080
      -db=/var/lib/mewla-account/account.db
      -friends-db=/var/lib/mewla-account/friends.db
      -usage-db=/var/lib/mewla-account/usage.db
      -grant-key-file=/var/lib/mewla-account/grant-key.pem
      -public-url=https://connect.mewla.ai
      -client-domain=m.mewla.ai
      -relay=name=main,control=connect.mewla.ai:8443,server-name=connect.mewla.ai,ca-file=/run/mewla-link/relay.crt
      -tls-addr=:8443
      -proxy-protocol
      -dns-provider=cloudflare
      -cloudflare-zone-id=338037db978d5f7b2ae75f151022ad66
      -friends-media-endpoint=https://4d91ce685354fcc9ebae23ff7fa4ac9f.r2.cloudflarestorage.com
      -friends-media-bucket=mewla-friends-media
      -friends-media-public-url=https://friends-media.mewla.ai
    options:
      # The relay's SNI route target; app container names change with
      # every version. Not published: only the relay can reach it, which is
      # what makes its PROXY header trustworthy.
      network-alias: mewla-account

env:
  clear:
    # Public OAuth client ID (release/plugin-publishers.json), Device Flow on.
    MEWLA_ACCOUNT_GITHUB_CLIENT_ID: Ov23liBbGJrVUAJyzDHg
    # Mewla's Slack app's public client ID (release/plugin-publishers.json).
    # Its secret signs every Slack token exchange and refresh for daemons.
    MEWLA_ACCOUNT_SLACK_CLIENT_ID: "12347206286420.12343331081890"
  secret:
    - MEWLA_ACCOUNT_CLOUDFLARE_TOKEN
    - MEWLA_ACCOUNT_MEDIA_ACCESS_KEY
    - MEWLA_ACCOUNT_MEDIA_SECRET_KEY
    - MEWLA_ACCOUNT_SLACK_CLIENT_SECRET

volumes:
  # SQLite databases (accounts, Friends, usage counts) and the grant signing key. Back it up
  # (see the runbook).
  - mewla-link-account:/var/lib/mewla-account
  # The relay's self-signed control certificate, uploaded with the relay.
  - /home/ubuntu/mewla-link-relay/run/mewla-link/relay.crt:/run/mewla-link/relay.crt:ro

# Same local registry pattern as Onlora: Kamal pushes to a registry on the
# deploying machine and tunnels it to the host for the pull.
registry:
  server: localhost:5555

builder:
  arch: amd64
  dockerfile: daemon/Dockerfile.link

ssh:
  user: ubuntu
  keys:
    - ~/.ssh/id_ed25519_lenscan
  keys_only: true

accessories:
  # Owns host :443 and :8443. An accessory, not a role, because a role boots
  # the new container before stopping the old one and two cannot hold the
  # same host ports. The image is a version this config built; `kamal
  # accessory reboot` cannot pull from the local registry, so upgrade with
  # the stop / remove_container / boot sequence in the runbook.
  relay:
    image: localhost:5555/daoleno/mewla-link:<%= ENV.fetch("MEWLA_LINK_VERSION", "latest") %>
    host: 167.114.116.27
    cmd: >-
      /usr/local/bin/mewla-relay
      -client-addr=:443
      -control-addr=:8443
      -operator-addr=:8080
      -tls-cert=/run/mewla-link/relay.crt
      -tls-key=/run/mewla-link/relay.key
      -grant-public-key-file=/run/mewla-link/grant.pub
      -sni-route=connect.mewla.ai=mewla-account:8443
      -sni-route-proxy-protocol
      -max-clients=4096
      -max-clients-per-route=32
      -max-client-handshakes=8192
      -max-connector-handshakes=1024
      -sni-route=turn.connect.mewla.ai=172.18.0.1:5349
      -turn-secret-file=/run/mewla-link/turn.secret
      -turn-url=turn:turn.connect.mewla.ai:3478?transport=udp
      -turn-url=turn:turn.connect.mewla.ai:3478?transport=tcp
      -turn-url=turns:turn.connect.mewla.ai:443?transport=tcp
    files:
      # Written by the runbook into .kamal/files/ (gitignored), mode 0600.
      - local: .kamal/files/relay.crt
        remote: /run/mewla-link/relay.crt
        mode: "0644"
      - local: .kamal/files/relay.key
        remote: /run/mewla-link/relay.key
        mode: "0600"
      - local: .kamal/files/grant.pub
        remote: /run/mewla-link/grant.pub
        mode: "0644"
      # TURN's shared secret: the relay signs credentials, the turn
      # accessory checks them. Written by the runbook, mode 0600.
      - local: .kamal/files/turn.secret
        remote: /run/mewla-link/turn.secret
        mode: "0600"
    options:
      # The uploaded files belong to the host's ubuntu user.
      user: "1000:1000"
      # Container ports equal host ports because the host's DOCKER-USER
      # guard (/etc/ufw/after.rules) matches ports after DNAT and allows
      # only 22, 80, 443 and 8443; Docker lets non-root bind low ports in
      # the container. IPv4 only, through Docker's DNAT, so the relay sees
      # real client addresses; IPv6 would go through docker-proxy and show
      # one gateway address (there are no AAAA records). Metrics only on
      # the host's loopback.
      publish:
        - "0.0.0.0:443:443"
        - "0.0.0.0:8443:8443"
        - "127.0.0.1:9180:8080"

  # TURN for Screen's video when a view has no direct path (runbook: "TURN
  # for Screen's video"). The same image as the relay, as its own process.
  # Host network: publishing 512 UDP ports would start a docker-proxy per
  # port, and the relayed address must equal the host port. A host-network
  # container is filtered by ufw (INPUT), not the DOCKER-USER guard.
  # UDP and TCP on 3478 face the internet; TLS listens only on the kamal
  # bridge's gateway (172.18.0.1), where the relay's SNI route for
  # turn.connect.mewla.ai on :443 sends it with a PROXY header.
  # It serves the certificate turncert keeps (read only, reloaded within a
  # minute of a change, no restart) and never holds the DNS token; the
  # uploaded turn.crt/key are served only while that directory holds no
  # valid pair. Health, days until expiry and turncert's report:
  # 127.0.0.1:9181/healthz and /metrics on the host.
  # Its own version (MEWLA_TURN_VERSION, else MEWLA_LINK_VERSION): the relay
  # and turn upgrade separately.
  turn:
    image: localhost:5555/daoleno/mewla-link:<%= ENV.fetch("MEWLA_TURN_VERSION") { ENV.fetch("MEWLA_LINK_VERSION", "latest") } %>
    host: 167.114.116.27
    network: host
    cmd: >-
      /usr/local/bin/mewla-relay -turn-only
      -turn-public-ip=167.114.116.27
      -turn-udp-addr=167.114.116.27:3478
      -turn-tcp-addr=167.114.116.27:3478
      -turn-tls-addr=172.18.0.1:5349
      -turn-tls-proxy-protocol
      -turn-tls-cert=/run/mewla-link/turn.crt
      -turn-tls-key=/run/mewla-link/turn.key
      -turn-secret-file=/run/mewla-link/turn.secret
      -turn-min-port=49160
      -turn-max-port=49671
      -turn-kbps=8000
      -turn-total-kbps=200000
      -turn-tls-cert-dir=/var/lib/mewla-turn
      -operator-addr=127.0.0.1:9181
    volumes:
      # turncert's certificate directory only (not its account key), read only.
      - /home/ubuntu/mewla-link-turncert/acme/cert:/var/lib/mewla-turn:ro
    files:
      - local: .kamal/files/turn.secret
        remote: /run/mewla-link/turn.secret
        mode: "0600"
      # The first Let's Encrypt certificate (runbook); later ones come from turncert.
      - local: .kamal/files/turn.crt
        remote: /run/mewla-link/turn.crt
        mode: "0644"
      - local: .kamal/files/turn.key
        remote: /run/mewla-link/turn.key
        mode: "0600"
    options:
      user: "1000:1000"
      # The image's healthcheck asks 127.0.0.1:8080, which on the host
      # network is the host's own loopback, not this process.
      no-healthcheck: true

  # Renews TURN's certificate (Let's Encrypt, DNS-01 through Cloudflare, 30
  # days before expiry; SIGHUP renews at once) into acme/cert, which turn
  # reads; the ACME account key stays in acme/account. It holds the DNS token
  # and listens on nothing (no port published, no listener in the process):
  # the internet-facing turn process never holds the token.
  turncert:
    image: localhost:5555/daoleno/mewla-link:<%= ENV.fetch("MEWLA_TURN_VERSION") { ENV.fetch("MEWLA_LINK_VERSION", "latest") } %>
    host: 167.114.116.27
    cmd: >-
      /usr/local/bin/mewla-relay -turn-cert-renew
      -turn-tls-acme-dir=/var/lib/mewla-turncert/cert
      -turn-tls-acme-account-key=/var/lib/mewla-turncert/account/account.pem
      -turn-tls-acme-domain=turn.connect.mewla.ai
      -turn-tls-acme-cloudflare-zone-id=338037db978d5f7b2ae75f151022ad66
    env:
      secret:
        # The account service's token (DNS edit on the mewla.ai zone).
        - MEWLA_TURN_CLOUDFLARE_TOKEN:MEWLA_ACCOUNT_CLOUDFLARE_TOKEN
    directories:
      # /home/ubuntu/mewla-link-turncert/acme: cert/ (turn reads it) and
      # account/; written by the process (uid 1000).
      - acme:/var/lib/mewla-turncert
    options:
      user: "1000:1000"
      # No listener to ask: its health is turn's /healthz (renewer_checked,
      # renewal_failures, last_error from its status.json).
      no-healthcheck: true

deploy_timeout: 60
drain_timeout: 10
retain_containers: 5

aliases:
  logs: app logs -f --timestamps
  relay-logs: accessory logs relay -f --timestamps

logging:
  options:
    max-size: 20m
    max-file: "5"
