<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen cat poses</title>
<meta name="color-scheme" content="light">
<style>
  :root {
    --bg: #f6f2ea;
    --paper: #fffdf9;
    --ink: #2a2420;
    --soft: #776a60;
    --line: rgba(50, 35, 25, .12);
    --accent: #c4713b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    overflow-x: clip;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 18px; }
  .kicker { font-size: 13px; letter-spacing: .12em; color: var(--accent); font-weight: 700; margin: 0 0 6px; }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; }
  .lede { color: var(--soft); max-width: 62ch; margin: 0; }
  .grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1120px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .card svg { display: block; width: 100%; height: auto; aspect-ratio: 10 / 7; background: #f8f1e4; }
  .meta { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px 2px; }
  .num { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); }
  .name { font-weight: 700; font-size: 17px; }
  .note { margin: 0; padding: 2px 14px 14px; color: var(--soft); font-size: 14px; line-height: 1.5; }
  footer { padding: 36px 0 48px; color: var(--soft); font-size: 13px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="kicker">Zen 吉祥物 · 睡姿选择</p>
    <h1>先定睡姿</h1>
    <p class="lede">八种不同的睡法，统一用最朴素的平涂画，只看姿势和轮廓。挑一个（或说说想要什么感觉），再配画风、做动作。</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<footer class="wrap">设计稿，仅供评审。全部手写 SVG，没有参考任何具体作品。</footer>
<script type="module" src="poses.js"></script>
</body>
</html>
