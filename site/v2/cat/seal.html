<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen seal cat</title>
<meta name="color-scheme" content="light">
<style>
  :root {
    --bg: #faf7f0;
    --paper: #fffdf9;
    --ink: #2a2420;
    --soft: #776a60;
    --line: rgba(50, 35, 25, .12);
    --red: #c8372b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); position: relative;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    overflow-x: clip;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .top { position: sticky; top: 0; z-index: 5; background: rgba(250, 247, 240, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 10px; height: 56px; }
  .top svg { width: 30px; height: 30px; display: block; }
  .top b { font-size: 19px; letter-spacing: -.01em; }
  .top span { margin-left: auto; color: var(--soft); font-size: 13px; }
  .hero { display: grid; justify-items: center; text-align: center; padding: 56px 0 40px; }
  .hero .seal { width: min(280px, 64vw); aspect-ratio: 1; display: block; }
  .hero h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.1; margin: 28px 0 8px; letter-spacing: -.02em; }
  .hero p { color: var(--soft); margin: 0; max-width: 40ch; }
  .hint { margin-top: 18px; font-size: 13px; color: var(--red); }
  section { padding: 48px 0 24px; }
  section h2 { font-size: 22px; margin: 0 0 18px; }
  .row { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 720px) { .row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .block { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; min-height: 150px; padding: 18px; color: var(--soft); font-size: 14px; }
  .block i { display: block; height: 10px; border-radius: 5px; background: #efe8dc; margin: 10px 0; }
  .block i:nth-child(2) { width: 70%; }
  .block i:nth-child(3) { width: 85%; }
  footer { padding: 80px 0 120px; color: var(--soft); font-size: 13px; text-align: center; }
  /* the cat lives in page coordinates */
  .cat { position: absolute; left: 0; top: 0; z-index: 4; overflow: visible; cursor: pointer; will-change: transform; -webkit-tap-highlight-color: transparent; }
  .cat .zz, .seal .zz { font: 700 9px ui-sans-serif, system-ui, sans-serif; fill: var(--zz); opacity: 0; animation: zz 3.6s linear infinite; }
  .seal .zz { --zz: #fbf6ec; font-size: 7px; }
  .zz:nth-of-type(2) { animation-delay: 1.2s; }
  .zz:nth-of-type(3) { animation-delay: 2.4s; }
  .seal .home > g, .seal .home { transform-box: fill-box; }
  .seal .home { transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.01, 1.025); } }
  @keyframes zz {
    0% { opacity: 0; transform: translate(0, 0) scale(.6); }
    20% { opacity: .9; }
    100% { opacity: 0; transform: translate(10px, -22px) scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { .zz { animation: none; opacity: .8; } .seal .home { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg viewBox="0 0 100 100" aria-hidden="true" data-seal="mini"></svg>
    <b>Zen</b>
    <span>动画演示 · 版式和文案待定</span>
  </div>
</header>
<main class="wrap">
  <div class="hero">
    <svg class="seal" viewBox="0 0 100 100" role="img" aria-label="Zen 朱印睡猫" data-seal="hero" data-perch="seal"></svg>
    <h1>Zen</h1>
    <p>这里以后放正式的标题和介绍。现在只看这只猫。</p>
    <p class="hint">往下滑，猫会跳出来跟着你；点它会跳一下。</p>
  </div>
  <section><h2>区块一</h2><div class="row">
    <div class="block" data-perch="0.78"><i></i><i></i><i></i></div>
    <div class="block"><i></i><i></i><i></i></div>
    <div class="block"><i></i><i></i><i></i></div>
  </div></section>
  <section><h2>区块二</h2><div class="row">
    <div class="block"><i></i><i></i><i></i></div>
    <div class="block" data-perch="0.3"><i></i><i></i><i></i></div>
    <div class="block"><i></i><i></i><i></i></div>
  </div></section>
  <section><h2>区块三</h2><div class="row">
    <div class="block"><i></i><i></i><i></i></div>
    <div class="block"><i></i><i></i><i></i></div>
    <div class="block" data-perch="0.6"><i></i><i></i><i></i></div>
  </div></section>
  <section><h2>区块四</h2><div class="row">
    <div class="block" data-perch="0.4"><i></i><i></i><i></i></div>
    <div class="block"><i></i><i></i><i></i></div>
    <div class="block"><i></i><i></i><i></i></div>
  </div></section>
</main>
<footer class="wrap">设计稿，仅供评审。猫和印章都是手写的 SVG，没有参考任何具体作品。</footer>
<script type="module" src="seal.js"></script>
</body>
</html>
