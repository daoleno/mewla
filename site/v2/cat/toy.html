<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen toy cat</title>
<meta name="color-scheme" content="light">
<style>
  :root {
    --bg: #f6f2ea;
    --paper: #fffdf9;
    --ink: #2a2420;
    --soft: #776a60;
    --line: rgba(50, 35, 25, .12);
    --accent: #c4713b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    overflow-x: clip;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0 18px; }
  .kicker { font-size: 13px; letter-spacing: .12em; color: var(--accent); font-weight: 700; margin: 0 0 6px; }
  h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; }
  .lede { color: var(--soft); max-width: 62ch; margin: 0; }
  .grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1120px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .icon .breathe, .icon .head, .icon .tail { animation: none; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .art { aspect-ratio: 10 / 7; background: radial-gradient(120% 90% at 50% 35%, #fffaf2, #f3ece1); display: grid; place-items: center; }
  .art svg { width: 72%; height: 100%; display: block; overflow: visible; }
  .icon { display: inline-block; flex: none; }
  .icon svg { width: 100%; height: 100%; display: block; }
  .icon .zz { display: none; }
  .breathe { transform-box: view-box; transform-origin: 160px 276px; animation: breathe 3.6s ease-in-out infinite; }
  .head { transform-box: view-box; transform-origin: 160px 214px; animation: tilt 7.2s ease-in-out infinite; }
  .tail { transform-box: view-box; transform-origin: 214px 258px; animation: tail 4.8s ease-in-out infinite; }
  .peek { animation: peek 6s steps(1, end) infinite; opacity: 0; }
  .shut { animation: shut 6s steps(1, end) infinite; }
  .zz text { animation: zz 3.6s ease-in-out infinite; }
  .zz text:nth-child(2) { animation-delay: .4s; }
  .zz text:nth-child(3) { animation-delay: .8s; }
  @keyframes breathe { 50% { transform: scale(1.012, 1.026); } }
  @keyframes tilt { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes tail { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-7deg); } }
  @keyframes peek { 0% { opacity: 0; } 62% { opacity: 1; } 84% { opacity: 0; } }
  @keyframes shut { 0% { opacity: 1; } 62% { opacity: 0; } 84% { opacity: 1; } }
  @keyframes zz { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: .9; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .breathe, .head, .tail, .peek, .shut, .zz text { animation: none; } }
  .meta { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px 2px; }
  .num { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); }
  .name { font-weight: 700; font-size: 17px; }
  .meta { flex-wrap: wrap; }
  .test { color: var(--soft); font-size: 13px; }
  .note { margin: 0; padding: 2px 14px 10px; color: var(--soft); font-size: 14px; line-height: 1.5; }
  .logos { display: flex; align-items: center; gap: 14px; padding: 10px 14px 14px; border-top: 1px dashed var(--line); background: #fff; }
  .logos canvas { display: block; }
  .lockup { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding: 4px 12px 4px 6px; border: 1px solid var(--line); border-radius: 999px; }
  .lockup b { font: 700 17px/1 ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: -.01em; }
  footer { padding: 36px 0 48px; color: var(--soft); font-size: 13px; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="kicker">Zen 吉祥物 · 潮玩</p>
    <h1>潮玩感的睡猫</h1>
    <p class="lede">大头小身子，坐着打盹，一只眼偷偷睁开看你。同一个造型做了三种材质：毛绒、搪胶、和朱印同色的红搪胶。下面一排是缩成图标和放进页头的样子。</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<footer class="wrap">设计稿，仅供评审。原创造型，手写 SVG；只借潮玩“大头、软、有点坏”的感觉，不照搬任何现有角色。</footer>
<script type="module" src="toy.js"></script>
</body>
</html>
