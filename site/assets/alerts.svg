<svg xmlns="http://www.w3.org/2000/svg" class="al" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="al-t al-d" fill="none"><title id="al-t">Alerts and Telegram</title><desc id="al-d">Push alerts arrive only when a Session is blocked, failed or finished. Telegram is another channel to the same Brain.</desc><style>.al text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.al .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}</style><rect class="bg" width="480" height="300" rx="18" fill="#0c0d0a"/><text x="20" y="30" font-size="9.5" fill="#77746a" class="m" letter-spacing="1.2">PUSH</text><rect x="20" y="42" width="230" height="48" rx="14" fill="#1a1b16"/><rect x="30" y="52" width="20" height="20" rx="5" fill="#151a18"/><circle cx="40" cy="62" r="3.5" fill="#f0895c"/><text x="58" y="62" font-size="11.5" fill="#f2eee5" font-weight="600">session-auth needs you</text><text x="58" y="78" font-size="10" fill="#aaa699">Approve running the migration?</text><rect x="20" y="98" width="230" height="48" rx="14" fill="#1a1b16"/><rect x="30" y="108" width="20" height="20" rx="5" fill="#151a18"/><circle cx="40" cy="118" r="3.5" fill="#ef6b5f"/><text x="58" y="118" font-size="11.5" fill="#f2eee5" font-weight="600">flaky-tests failed</text><text x="58" y="134" font-size="10" fill="#aaa699">3 of 212 tests still fail on CI</text><rect x="20" y="154" width="230" height="48" rx="14" fill="#1a1b16"/><rect x="30" y="164" width="20" height="20" rx="5" fill="#151a18"/><circle cx="40" cy="174" r="3.5" fill="#5ec4b6"/><text x="58" y="174" font-size="11.5" fill="#f2eee5" font-weight="600">ios-crash finished</text><text x="58" y="190" font-size="10" fill="#aaa699">Fixed the resume race; tests pass</text><text x="20" y="230" font-size="11" fill="#77746a">Nothing for routine progress.</text><text x="20" y="248" font-size="11" fill="#77746a">Silent while you watch that Session.</text><text x="270" y="30" font-size="9.5" fill="#77746a" class="m" letter-spacing="1.2">TELEGRAM</text><rect x="270" y="42" width="190" height="216" rx="14" fill="#1a1b16"/><rect x="340" y="58" width="106" height="28" rx="12" fill="#1f3328"/><text x="393" y="76" font-size="11" fill="#f2eee5" text-anchor="middle">where are we?</text><rect x="282" y="98" width="160" height="86" rx="12" fill="#22231d"/><text x="294" y="118" font-size="11" fill="#f2eee5">2 Workers running.</text><text x="294" y="135" font-size="11" fill="#f2eee5">session-auth waits on</text><text x="294" y="152" font-size="11" fill="#f2eee5">your approval. ios-crash</text><text x="294" y="169" font-size="11" fill="#f2eee5">is done and accepted.</text><text x="284" y="204" font-size="10" fill="#77746a" class="m">Brain · same thread</text><text x="284" y="220" font-size="10" fill="#77746a" class="m">as the app</text></svg>
