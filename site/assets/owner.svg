<svg xmlns="http://www.w3.org/2000/svg" class="ow" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="ow-t ow-d" fill="none"><title id="ow-t">One owner, one current server</title><desc id="ow-d">The phone pairs with your daemon once using a short-lived code, then signs every request with its own key. It reaches the daemon over your LAN, Tailscale, or a tunnel you run. Exactly one server is current; switching rebinds everything.</desc><style>.ow text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.ow .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.ow .st{opacity:0;transition:opacity .4s ease}.ow:not([data-state]) .s1,.ow[data-state="1"] .s1,.ow[data-state="2"] .s2{opacity:1}@media (prefers-reduced-motion:reduce){.ow .st{transition:none}}.ow .flow{stroke-dasharray:3 6;animation:ow-f 1.5s linear infinite}@keyframes ow-f{to{stroke-dashoffset:-18}}@media (prefers-reduced-motion:reduce){.ow .flow{animation:none}}</style><rect class="bg" width="480" height="300" rx="18" fill="#0c0d0a"/><rect x="24" y="60" width="92" height="180" rx="18" fill="#131410" stroke="#3b3c34" stroke-width="1.2"/><rect x="54" y="68" width="32" height="8" rx="4" fill="#050504"/><text x="70" y="160" font-size="11" fill="#aaa699" text-anchor="middle" class="m">phone</text><rect x="324" y="80" width="132" height="140" rx="14" fill="#131410" stroke="#3b3c34" stroke-width="1.2"/><text x="390" y="112" font-size="12" fill="#f2eee5" font-weight="600" text-anchor="middle">zen daemon</text><text x="390" y="130" font-size="10" fill="#77746a" text-anchor="middle" class="m">your computer</text><text x="340" y="156" font-size="10.5" fill="#aaa699" class="m">· repos</text><text x="340" y="172" font-size="10.5" fill="#aaa699" class="m">· tmux</text><text x="340" y="188" font-size="10.5" fill="#aaa699" class="m">· credentials</text><text x="340" y="204" font-size="10.5" fill="#aaa699" class="m">· agent state</text><path d="M116 150C170 150,180 100,220 100H270C300 100,300 150,324 150" fill="none" stroke="#3b3c34" stroke-width="1"/><text x="240" y="94" font-size="10.5" fill="#77746a" class="m">LAN</text><path d="M116 150C170 150,180 150,220 150H270C300 150,300 150,324 150" fill="none" stroke="#3b3c34" stroke-width="1"/><text x="240" y="144" font-size="10.5" fill="#77746a" class="m">Tailscale</text><path d="M116 150C170 150,180 200,220 200H270C300 200,300 150,324 150" fill="none" stroke="#3b3c34" stroke-width="1"/><text x="240" y="194" font-size="10.5" fill="#77746a" class="m">your tunnel</text><path d="M116 150C170 150,180 150,220 150H270C300 150,300 150,324 150" fill="none" stroke="#8fcfa6" stroke-width="1.4" class="flow"/><g class="st s1"><text x="24" y="36" font-size="13" fill="#f2eee5" font-weight="600">Pair once, sign every request</text><rect x="124" y="250" width="252" height="30" rx="8" fill="#1a1b16"/><text x="136" y="270" font-size="10.5" fill="#8fcfa6" class="m">Ed25519 · device key · one-time code</text></g><g class="st s2"><text x="24" y="36" font-size="13" fill="#f2eee5" font-weight="600">Exactly one current server</text><rect x="132" y="250" width="104" height="30" rx="8" fill="#1f3328" stroke="#5f9d78" stroke-width="1"/><text x="144" y="270" font-size="11" fill="#f2eee5" class="m">homelab</text><text x="224" y="270" font-size="9.5" fill="#8fcfa6" text-anchor="end">In use</text><rect x="244" y="250" width="104" height="30" rx="8" fill="#1a1b16"/><text x="256" y="270" font-size="11" fill="#f2eee5" class="m">studio-mac</text></g></svg>
