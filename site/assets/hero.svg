<svg xmlns="http://www.w3.org/2000/svg" class="hw" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="hw-t hw-d" fill="none"><title id="hw-t">Every Session on your computer, in one phone</title><desc id="hw-d">Ten Sessions on your own computer: agents on claude, codex, pi, grok, opencode and cursor, a plain shell and Brain. Each one runs into the phone&#x27;s Sessions list. Most are running, three are done and one needs you.</desc><style>.hw text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.hw .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.hw .lp{stroke:#34352d;transition:stroke .25s}
.hw .lane.run .lp{stroke:#3c4a40}
.hw .lane.need .lp{stroke:#5a3a2c}
.hw .pu{stroke-dasharray:46 1000;stroke-dashoffset:1046;animation:hw-run var(--d,7s) linear infinite;animation-delay:var(--o,0s)}
.hw .need .pu{stroke:#f0895c}
.hw .blink{animation:hw-blink 2.4s ease-in-out infinite}
.hw .hit{stroke:transparent;stroke-width:22;pointer-events:stroke}
.hw .rowbg{transition:fill .25s}
.hw .lane:hover .lp{stroke:#8fcfa6}
.hw .lane.need:hover .lp{stroke:#f0895c}
.hw .lane:hover .rowbg{fill:#22231d}
@keyframes hw-run{to{stroke-dashoffset:0}}
@keyframes hw-blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.hw .pu{display:none}.hw .blink{animation:none}}
