<svg xmlns="http://www.w3.org/2000/svg" class="pl" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="pl-t pl-d" fill="none"><title id="pl-t">Plugins connect outside services to Brain</title><desc id="pl-d">Linear, Notion, GitHub, Slack and Google Workspace connect to Brain through each service&#x27;s own authorization, plus custom MCP and OpenAPI services. Read and search is included; making changes is a separate switch.</desc><style>.pl text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.pl .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.pl .st{opacity:0;transition:opacity .4s ease}.pl:not([data-state]) .s1,.pl[data-state="1"] .s1,.pl[data-state="2"] .s2{opacity:1}@media (prefers-reduced-motion:reduce){.pl .st{transition:none}}.pl .flow{stroke-dasharray:3 5;animation:pl-f 1.4s linear infinite}@keyframes pl-f{to{stroke-dashoffset:-16}}@media (prefers-reduced-motion:reduce){.pl .flow{animation:none}}</style><rect class="bg" width="480" height="300" rx="18" fill="#0c0d0a"/><circle cx="70" cy="150" r="30" fill="none" stroke="#1f3328" stroke-width="1"/><circle cx="70" cy="150" r="22" fill="#10140f" stroke="#5f9d78" stroke-width="1.2"/><g transform="translate(44.7 124.7) scale(0.0494141)" fill="none" stroke="#f2eee5" stroke-linecap="round" stroke-linejoin="round"><path d="M790 372C724 252 590 209 461 244C334 279 252 393 266 524C282 675 411 778 558 760C650 749 731 697 781 620" stroke-width="64"/><path d="M334 430C470 352 622 334 665 371C694 396 671 440 601 495C486 586 401 663 437 705C472 747 606 730 722 801" stroke-width="78"/></g><text x="70" y="200" font-size="12" fill="#f2eee5" font-weight="600" text-anchor="middle">Brain</text><path d="M100 150C130 150,110 42,150 42" fill="none" stroke="#3b3c34" stroke-width="1"/><path d="M100 150C130 150,110 42,150 42" fill="none" stroke="#8fcfa6" stroke-width="1.3" class="st s2 flow"/><rect x="150" y="28" width="128" height="28" rx="8" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="164" y="46.5" font-size="10.5" fill="#8fcfa6" font-weight="500" class="m">L</text><text x="186" y="46.5" font-size="11.5" fill="#f2eee5">Linear</text><path d="M100 150C130 150,110 84,150 84" fill="none" stroke="#3b3c34" stroke-width="1"/><rect x="150" y="70" width="128" height="28" rx="8" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="164" y="88.5" font-size="10.5" fill="#8fcfa6" font-weight="500" class="m">N</text><text x="186" y="88.5" font-size="11.5" fill="#f2eee5">Notion</text><path d="M100 150C130 150,110 126,150 126" fill="none" stroke="#3b3c34" stroke-width="1"/><rect x="150" y="112" width="128" height="28" rx="8" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="164" y="130.5" font-size="10.5" fill="#8fcfa6" font-weight="500" class="m">G</text><text x="186" y="130.5" font-size="11.5" fill="#f2eee5">GitHub</text><path d="M100 150C130 150,110 168,150 168" fill="none" stroke="#3b3c34" stroke-width="1"/><rect x="150" y="154" width="128" height="28" rx="8" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="164" y="172.5" font-size="10.5" fill="#8fcfa6" font-weight="500" class="m">S</text><text x="186" y="172.5" font-size="11.5" fill="#f2eee5">Slack</text><path d="M100 150C130 150,110 210,150 210" fill="none" stroke="#3b3c34" stroke-width="1"/><rect x="150" y="196" width="128" height="28" rx="8" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="164" y="214.5" font-size="10.5" fill="#8fcfa6" font-weight="500" class="m">W</text><text x="186" y="214.5" font-size="11.5" fill="#f2eee5">Google Workspace</text><path d="M100 150C130 150,110 252,150 252" fill="none" stroke="#3b3c34" stroke-width="1"/><rect x="150" y="238" width="128" height="28" rx="8" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="164" y="256.5" font-size="10.5" fill="#8fcfa6" font-weight="500" class="m">{ }</text><text x="186" y="256.5" font-size="11.5" fill="#aaa699">MCP · OpenAPI</text><rect x="292" y="28" width="168" height="244" rx="14" fill="#1a1b16"/><text x="306" y="52" font-size="13" fill="#f2eee5" font-weight="600">Linear</text><text x="306" y="68" font-size="10.5" fill="#77746a">one connected account</text><text x="306" y="98" font-size="9" fill="#77746a" class="m" letter-spacing="1">WHAT BRAIN CAN DO</text><text x="306" y="121" font-size="11.5" fill="#f2eee5">Read and search</text><text x="306" y="135" font-size="10" fill="#77746a">included</text><rect x="416" y="111" width="30" height="18" rx="9" fill="#5f9d78"/><circle cx="437" cy="120" r="7" fill="#f2eee5"/><text x="306" y="163" font-size="11.5" fill="#f2eee5">Make changes</text><text x="306" y="177" font-size="10" fill="#77746a">when you ask</text><rect x="416" y="153" width="30" height="18" rx="9" fill="#22231d" class="st s1"/><circle cx="425" cy="162" r="7" fill="#aaa699" class="st s1"/><rect x="416" y="153" width="30" height="18" rx="9" fill="#5f9d78" class="st s2"/><circle cx="437" cy="162" r="7" fill="#f2eee5" class="st s2"/><g class="st s2"><path d="M306 198L446 198" stroke="#2a2b24" stroke-width="1"/><text x="306" y="220" font-size="10" fill="#77746a" class="m">Brain › Linear</text><text x="306" y="238" font-size="11.5" fill="#8fcfa6" class="m">create_issue</text><text x="306" y="254" font-size="10.5" fill="#aaa699">“Resume crash on Pixel 9”</text></g><g class="st s1"><path d="M306 198L446 198" stroke="#2a2b24" stroke-width="1"/><text x="306" y="222" font-size="10.5" fill="#77746a">Changes stay off until</text><text x="306" y="238" font-size="10.5" fill="#77746a">you switch them on and</text><text x="306" y="254" font-size="10.5" fill="#77746a">confirm.</text></g></svg>
