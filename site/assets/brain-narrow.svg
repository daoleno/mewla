<svg xmlns="http://www.w3.org/2000/svg" class="bn" viewBox="0 0 400 760" width="400" height="760" role="img" aria-labelledby="bn-t bn-d" fill="none"><title id="bn-t">Brain turns a goal into Work and routes each part</title><desc id="bn-d">You send Brain one goal. Brain writes three Work items, reads routing.md and gives each to a Worker: the crash to claude at high reasoning, the filters to codex at medium, the changelog to pi at low. Brain reviews the results, accepts two and sends one back for a test.</desc><style>.bn text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.bn .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.bn .st{opacity:0;transition:opacity .4s ease}.bn:not([data-state]) .s1,.bn[data-state="1"] .s1,.bn[data-state="2"] .s2,.bn[data-state="3"] .s3{opacity:1}@media (prefers-reduced-motion:reduce){.bn .st{transition:none}}
.bn .flow{stroke-dasharray:4 5;animation:bn-f 1.6s linear infinite}
@keyframes bn-f{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.bn .flow{animation:none}}
</style><rect class="bg" width="400" height="760" rx="18" fill="#0c0d0a"/><text x="16" y="20" font-size="9.5" fill="#77746a" class="m" letter-spacing="1.2">YOU, FROM THE PHONE</text><rect x="16" y="32" width="368" height="70" rx="18" fill="#22231d"/><text x="32" y="58" font-size="12.5" fill="#f2eee5">Ship the 0.2 beta: fix the resume crash,</text><text x="32" y="77" font-size="12.5" fill="#f2eee5">add session filters and write the changelog.</text><circle cx="44" cy="160" r="34" fill="none" stroke="#1f3328" stroke-width="1"/><circle cx="44" cy="160" r="26" fill="#10140f" stroke="#5f9d78" stroke-width="1.2"/><g transform="translate(14.1 130.1) scale(0.0583984)" fill="none" stroke="#f2eee5" stroke-linecap="round" stroke-linejoin="round"><path d="M790 372C724 252 590 209 461 244C334 279 252 393 266 524C282 675 411 778 558 760C650 749 731 697 781 620" stroke-width="64"/><path d="M334 430C470 352 622 334 665 371C694 396 671 440 601 495C486 586 401 663 437 705C472 747 606 730 722 801" stroke-width="78"/></g><text x="92" y="157" font-size="14" fill="#f2eee5" font-weight="600">Brain</text><text x="92" y="174" font-size="10.5" fill="#77746a" class="m">on your computer</text><rect x="16" y="218" width="368" height="204" rx="14" fill="#131410" stroke="#2a2b24" stroke-width="1"/><text x="32" y="244" font-size="12" fill="#f2eee5" font-weight="500" class="m">routing.md</text><text x="368" y="244" font-size="10" fill="#77746a" text-anchor="end" class="m">~/.zen/brain/workspace</text><path d="M16 258L384 258" stroke="#2a2b24" stroke-width="1"/><rect x="22" y="264" width="356" height="36" rx="8" fill="#1f3328" class="st s2 s3"/><text x="32" y="279" font-size="12" fill="#f2eee5">Tiny mechanical edit</text><text x="32" y="294" font-size="10.5" fill="#77746a" class="m">pi · fast model · low</text><text x="32" y="294" font-size="10.5" fill="#8fcfa6" class="m st s2 s3">pi · fast model · low</text><rect x="22" y="304" width="356" height="36" rx="8" fill="#1f3328" class="st s2 s3"/><text x="32" y="319" font-size="12" fill="#f2eee5">Routine implementation</text><text x="32" y="334" font-size="10.5" fill="#77746a" class="m">codex · default · medium</text><text x="32" y="334" font-size="10.5" fill="#8fcfa6" class="m st s2 s3">codex · default · medium</text><text x="32" y="359" font-size="12" fill="#f2eee5">Visual design, frontend, copy</text><text x="32" y="374" font-size="10.5" fill="#77746a" class="m">claude · default · high</text><rect x="22" y="384" width="356" height="36" rx="8" fill="#1f3328" class="st s2 s3"/><text x="32" y="399" font-size="12" fill="#f2eee5">Hard design or debugging</text><text x="32" y="414" font-size="10.5" fill="#77746a" class="m">claude · strongest · high</text><text x="32" y="414" font-size="10.5" fill="#8fcfa6" class="m st s2 s3">claude · strongest · high</text><rect x="16" y="452" width="368" height="86" rx="14" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="32" y="476" font-size="10.5" fill="#77746a" class="m">w_41</text><text x="74" y="476" font-size="13.5" fill="#f2eee5" font-weight="500">Android crash on resume</text><g class="st s1"><text x="32" y="502" font-size="11" fill="#aaa699">Work recorded · objective and finish line</text><rect x="32" y="512" width="59.4" height="20" rx="10" fill="#22231d"/><text x="61.7" y="525.6" font-size="10" fill="#aaa699" font-weight="500" text-anchor="middle" class="m">planned</text></g><g class="st s2"><text x="32" y="502" font-size="11" fill="#aaa699" class="m">Worker · claude · high reasoning</text><circle cx="38" cy="521" r="3.5" fill="#8fcfa6"/><text x="48" y="525" font-size="10.5" fill="#8fcfa6">running in tmux · open as Chat or Terminal</text></g><g class="st s3"><text x="32" y="502" font-size="11" fill="#aaa699">diff + repro checked</text><rect x="32" y="512" width="9" height="9" rx="2" fill="#5ec4b6"/><text x="48" y="521" font-size="11" fill="#5ec4b6" class="m">accepted</text></g><rect x="16" y="550" width="368" height="86" rx="14" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="32" y="574" font-size="10.5" fill="#77746a" class="m">w_42</text><text x="74" y="574" font-size="13.5" fill="#f2eee5" font-weight="500">Session list filters</text><g class="st s1"><text x="32" y="600" font-size="11" fill="#aaa699">Work recorded · objective and finish line</text><rect x="32" y="610" width="59.4" height="20" rx="10" fill="#22231d"/><text x="61.7" y="623.6" font-size="10" fill="#aaa699" font-weight="500" text-anchor="middle" class="m">planned</text></g><g class="st s2"><text x="32" y="600" font-size="11" fill="#aaa699" class="m">Worker · codex · medium reasoning</text><circle cx="38" cy="619" r="3.5" fill="#8fcfa6"/><text x="48" y="623" font-size="10.5" fill="#8fcfa6">running in tmux · open as Chat or Terminal</text></g><g class="st s3"><text x="32" y="600" font-size="11" fill="#aaa699">no test for the filter state</text><rect x="32" y="610" width="9" height="9" rx="2" fill="#e2b45c"/><text x="48" y="619" font-size="11" fill="#e2b45c" class="m">sent back · add a test</text></g><rect x="16" y="648" width="368" height="86" rx="14" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="32" y="672" font-size="10.5" fill="#77746a" class="m">w_43</text><text x="74" y="672" font-size="13.5" fill="#f2eee5" font-weight="500">Changelog for 0.2</text><g class="st s1"><text x="32" y="698" font-size="11" fill="#aaa699">Work recorded · objective and finish line</text><rect x="32" y="708" width="59.4" height="20" rx="10" fill="#22231d"/><text x="61.7" y="721.6" font-size="10" fill="#aaa699" font-weight="500" text-anchor="middle" class="m">planned</text></g><g class="st s2"><text x="32" y="698" font-size="11" fill="#aaa699" class="m">Worker · pi · low reasoning</text><circle cx="38" cy="717" r="3.5" fill="#8fcfa6"/><text x="48" y="721" font-size="10.5" fill="#8fcfa6">running in tmux · open as Chat or Terminal</text></g><g class="st s3"><text x="32" y="698" font-size="11" fill="#aaa699">matches the merged commits</text><rect x="32" y="708" width="9" height="9" rx="2" fill="#5ec4b6"/><text x="48" y="717" font-size="11" fill="#5ec4b6" class="m">accepted</text></g><path d="M44 196L44 212" stroke="#3b3c34" stroke-width="1"/><text x="58" y="206" font-size="10" fill="#77746a" class="m">reads before every spawn</text><text x="16" y="742" font-size="9.6" fill="#77746a" class="st s3">Only Brain or you can close Work. An exited process never counts as done.</text></svg>
