<svg xmlns="http://www.w3.org/2000/svg" class="sw" viewBox="0 0 960 520" data-n-viewbox="0 0 420 950" data-host="codex" data-exec="codex" role="img" aria-labelledby="sw-title sw-desc">
<title id="sw-title">Switch the agent behind Brain, and pick a model for each Worker</title>
<desc id="sw-desc">Left: Brain sits inside a ring of six agent clients. zen brain use moves Brain to another client while its thread and history stay. Right: each Worker gets its own executor, model and reasoning level. codex, claude and pi accept a reasoning level from their own scale; grok, Cursor agent and opencode take a model only. A running Worker keeps the executor it started with.</desc>
<style>
.sw{--ink:#171a18;--ink2:#4a504c;--mute:#7a817c;--line:#e4e0d6;--sage:#559e72;--sage7:#2a5f41}
.sw text{white-space:pre;font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
.sw .m,.sw .m text{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.sw .mute{fill:var(--mute)}.sw .ink2{fill:var(--ink2)}.sw .inv{fill:#fff}.sw .sage{fill:var(--sage7)}
.sw .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}
.sw .card{fill:#fff;stroke:var(--line)}
.sw [data-pick]{cursor:pointer}
.sw .sw-h,.sw .sw-e{opacity:0}.sw .sw-h-codex,.sw .sw-e-codex{opacity:1}
.sw.is-live .sw-h,.sw.is-live .sw-e{opacity:0;transition:opacity .3s ease}
.sw.is-live[data-host="codex"] .sw-h-codex,.sw.is-live[data-host="claude"] .sw-h-claude,.sw.is-live[data-host="pi"] .sw-h-pi,.sw.is-live[data-host="grok"] .sw-h-grok,.sw.is-live[data-host="agent"] .sw-h-agent,.sw.is-live[data-host="opencode"] .sw-h-opencode,.sw.is-live[data-exec="codex"] .sw-e-codex,.sw.is-live[data-exec="claude"] .sw-e-claude,.sw.is-live[data-exec="pi"] .sw-e-pi,.sw.is-live[data-exec="grok"] .sw-e-grok,.sw.is-live[data-exec="agent"] .sw-e-agent,.sw.is-live[data-exec="opencode"] .sw-e-opencode{opacity:1}
.sw.is-live [data-pick]:hover .seat,.sw.is-live [data-pick]:focus-visible .seat{stroke:var(--sage)}
.sw [data-pick]:focus{outline:none}
@media (prefers-reduced-motion:no-preference){
.sw:not(.is-live) .sw-h,.sw:not(.is-live) .sw-e{animation:sw-cycle 18s infinite both}
.sw:not(.is-live) .sw-h-codex{animation-delay:-0.00s}.sw:not(.is-live) .sw-h-claude{animation-delay:-15.00s}.sw:not(.is-live) .sw-h-pi{animation-delay:-12.00s}.sw:not(.is-live) .sw-h-grok{animation-delay:-9.00s}.sw:not(.is-live) .sw-h-agent{animation-delay:-6.00s}.sw:not(.is-live) .sw-h-opencode{animation-delay:-3.00s}
.sw:not(.is-live) .sw-e-codex{animation-delay:-1.50s}.sw:not(.is-live) .sw-e-claude{animation-delay:-16.50s}.sw:not(.is-live) .sw-e-pi{animation-delay:-13.50s}.sw:not(.is-live) .sw-e-grok{animation-delay:-10.50s}.sw:not(.is-live) .sw-e-agent{animation-delay:-7.50s}.sw:not(.is-live) .sw-e-opencode{animation-delay:-4.50s}
.sw .orbit{animation:sw-flow 4s linear infinite}
}
@keyframes sw-cycle{0%{opacity:0}2%,15.5%{opacity:1}16.66%,100%{opacity:0}}
@keyframes sw-flow{to{stroke-dashoffset:-90}}
</style>
