<svg xmlns="http://www.w3.org/2000/svg" class="hn" viewBox="0 0 400 540" width="400" height="540" role="img" aria-labelledby="hn-t hn-d" fill="none"><title id="hn-t">Every Session on your computer, in one phone</title><desc id="hn-d">Five Sessions on your own computer: agents on claude, codex and grok, a plain shell and Brain. Each one runs into the phone&#x27;s Sessions list. Four are running and one needs you.</desc><style>.hn text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.hn .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.hn .lp{stroke:#34352d;transition:stroke .25s}
.hn .lane.run .lp{stroke:#3c4a40}
.hn .lane.need .lp{stroke:#5a3a2c}
.hn .pu{stroke-dasharray:46 1000;stroke-dashoffset:1046;animation:hn-run var(--d,7s) linear infinite;animation-delay:var(--o,0s)}
.hn .need .pu{stroke:#f0895c}
.hn .blink{animation:hn-blink 2.4s ease-in-out infinite}
.hn .hit{stroke:transparent;stroke-width:22;pointer-events:stroke}
.hn .rowbg{transition:fill .25s}
.hn .lane:hover .lp{stroke:#8fcfa6}
.hn .lane.need:hover .lp{stroke:#f0895c}
.hn .lane:hover .rowbg{fill:#22231d}
@keyframes hn-run{to{stroke-dashoffset:0}}
@keyframes hn-blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.hn .pu{display:none}.hn .blink{animation:none}}
