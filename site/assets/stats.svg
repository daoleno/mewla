<svg xmlns="http://www.w3.org/2000/svg" class="us" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="us-t us-d" fill="none"><title id="us-t">Usage and cost per model</title><desc id="us-d">Usage per model on the current server. claude-opus-5-5 is a reported charge, gpt-5 is a reference estimate, and gpt-6-astra shows a dash because its price is not in the catalog.</desc><style>.us text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.us .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.us .st{opacity:0;transition:opacity .4s ease}.us:not([data-state]) .s1,.us[data-state="1"] .s1,.us[data-state="2"] .s2{opacity:1}@media (prefers-reduced-motion:reduce){.us .st{transition:none}}</style><rect class="bg" width="480" height="300" rx="18" fill="#0c0d0a"/><text x="20" y="34" font-size="24" fill="#f2eee5" font-weight="600" class="m">≈ $182.20</text><text x="20" y="54" font-size="11" fill="#77746a">41.2M tokens · 126 sessions · this month</text><g class="st s1"><text x="20" y="90" font-size="12.5" fill="#f2eee5" font-weight="500" class="m">claude-opus-5-5</text><text x="460" y="90" font-size="12.5" fill="#f2eee5" text-anchor="end" class="m">$96.40</text><rect x="20" y="98" width="440" height="4" rx="2" fill="#22231d"/><rect x="20" y="98" width="233.2" height="4" rx="2" fill="#8fcfa6"/><text x="20" y="118" font-size="10.5" fill="#77746a">18.3M tokens · 41 sessions</text><text x="20" y="144" font-size="12.5" fill="#f2eee5" font-weight="500" class="m">gpt-5</text><text x="460" y="144" font-size="12.5" fill="#f2eee5" text-anchor="end" class="m">≈ $61.10</text><rect x="20" y="152" width="440" height="4" rx="2" fill="#22231d"/><rect x="20" y="152" width="149.6" height="4" rx="2" fill="#5f9d78"/><text x="20" y="172" font-size="10.5" fill="#77746a">14.9M tokens · 52 sessions</text><text x="20" y="198" font-size="12.5" fill="#f2eee5" font-weight="500" class="m">claude-sonnet-5-5</text><text x="460" y="198" font-size="12.5" fill="#f2eee5" text-anchor="end" class="m">$24.70</text><rect x="20" y="206" width="440" height="4" rx="2" fill="#22231d"/><rect x="20" y="206" width="61.6" height="4" rx="2" fill="#8fcfa6"/><text x="20" y="226" font-size="10.5" fill="#77746a">6.2M tokens · 27 sessions</text><text x="20" y="252" font-size="12.5" fill="#f2eee5" font-weight="500" class="m">gpt-6-astra</text><text x="460" y="252" font-size="12.5" fill="#77746a" text-anchor="end" class="m">—</text><rect x="20" y="260" width="440" height="4" rx="2" fill="#22231d"/><text x="20" y="280" font-size="10.5" fill="#77746a">8.7M tokens · 6 sessions</text></g><g class="st s2"><rect x="20" y="72" width="440" height="210" rx="14" fill="#1a1b16"/><text x="36" y="98" font-size="14" fill="#f2eee5" font-weight="600" class="m">gpt-6-astra</text><text x="444" y="98" font-size="14" fill="#f2eee5" text-anchor="end" class="m">—</text><text x="36" y="124" font-size="11.5" fill="#77746a">Cost</text><text x="136" y="124" font-size="11.5" fill="#f2eee5">Unknown</text><text x="36" y="150" font-size="11.5" fill="#77746a">Reason</text><text x="136" y="150" font-size="11.5" fill="#e2b45c">Price not in catalog</text><text x="36" y="176" font-size="11.5" fill="#77746a">Input</text><text x="136" y="176" font-size="11.5" fill="#f2eee5" class="m">8.1M tokens</text><text x="36" y="202" font-size="11.5" fill="#77746a">Output</text><text x="136" y="202" font-size="11.5" fill="#f2eee5" class="m">0.6M tokens</text><text x="36" y="228" font-size="11.5" fill="#77746a">Source</text><text x="136" y="228" font-size="11.5" fill="#f2eee5">codex history · refreshed 4m ago</text><path d="M36 252L444 252" stroke="#2a2b24" stroke-width="1"/><text x="36" y="270" font-size="10.5" fill="#aaa699">Unknown is not zero. Zen never borrows another model&#x27;s price.</text></g></svg>
