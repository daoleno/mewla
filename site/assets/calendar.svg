<svg xmlns="http://www.w3.org/2000/svg" class="ca" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="ca-t ca-d" fill="none"><title id="ca-t">Calendar and scheduled actions</title><desc id="ca-d">A day in Calendar with an event, a reminder, a deadline and a daily scheduled action. When the scheduled action is due it becomes visible Work, runs in its own Session and posts the result to the Brain thread it came from.</desc><style>.ca text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.ca .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.ca .st{opacity:0;transition:opacity .4s ease}.ca:not([data-state]) .s1,.ca[data-state="1"] .s1,.ca[data-state="2"] .s2{opacity:1}@media (prefers-reduced-motion:reduce){.ca .st{transition:none}}</style><rect class="bg" width="480" height="300" rx="18" fill="#0c0d0a"/><text x="20" y="32" font-size="14" fill="#f2eee5" font-weight="600">Today</text><text x="460" y="32" font-size="10.5" fill="#77746a" text-anchor="end" class="m">Europe/Berlin</text><path d="M30 64L30 222" stroke="#1c1d18" stroke-width="1"/><text x="30" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">08</text><path d="M101.667 64L101.667 222" stroke="#1c1d18" stroke-width="1"/><text x="101.667" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">10</text><path d="M173.333 64L173.333 222" stroke="#1c1d18" stroke-width="1"/><text x="173.333" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">12</text><path d="M245 64L245 222" stroke="#1c1d18" stroke-width="1"/><text x="245" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">14</text><path d="M316.667 64L316.667 222" stroke="#1c1d18" stroke-width="1"/><text x="316.667" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">16</text><path d="M388.333 64L388.333 222" stroke="#1c1d18" stroke-width="1"/><text x="388.333" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">18</text><path d="M460 64L460 222" stroke="#1c1d18" stroke-width="1"/><text x="460" y="56" font-size="10" fill="#77746a" text-anchor="middle" class="m">20</text><path d="M223.5 64L223.5 222" stroke="#f0895c" stroke-width="1.2"/><circle cx="223.5" cy="64" r="3" fill="#f0895c"/><rect x="65.8333" y="80" width="21.5" height="26" rx="6" fill="#1f3328" stroke="#8fcfa6" stroke-width="1"/><text x="97.3333" y="92" font-size="11.5" fill="#f2eee5" font-weight="500">Triage GitHub issues</text><text x="97.3333" y="104" font-size="10" fill="#77746a" class="m">scheduled action · weekdays</text><rect x="101.667" y="120" width="35.8333" height="26" rx="6" fill="#22231d" stroke="#3b3c34" stroke-width="1"/><text x="147.5" y="132" font-size="11.5" fill="#f2eee5" font-weight="500">Design review</text><text x="147.5" y="144" font-size="10" fill="#77746a" class="m">event</text><path d="M191.25 164l6 9-6 9-6-9Z" fill="#e2b45c" stroke="#2a2b24" stroke-width="1"/><text x="203.25" y="172" font-size="11.5" fill="#f2eee5" font-weight="500">Renew the cert</text><text x="203.25" y="184" font-size="10" fill="#77746a" class="m">reminder</text><path d="M352.5 200l6 9-6 9-6-9Z" fill="#f0895c" stroke="#2a2b24" stroke-width="1"/><text x="364.5" y="208" font-size="11.5" fill="#f2eee5" font-weight="500">Beta cut</text><text x="364.5" y="220" font-size="10" fill="#77746a" class="m">deadline</text><g class="st s2"><rect x="20" y="236" width="440" height="50" rx="12" fill="#1a1b16" stroke="#5f9d78" stroke-width="1"/><text x="34" y="266" font-size="11" fill="#77746a" class="m">09:00 due</text><text x="104.1" y="266" font-size="12" fill="#77746a">›</text><text x="118.1" y="266" font-size="11" fill="#8fcfa6" class="m">Work w_57</text><text x="188.2" y="266" font-size="12" fill="#77746a">›</text><text x="202.2" y="266" font-size="11" fill="#8fcfa6" class="m">own Session</text><text x="286.1" y="266" font-size="12" fill="#77746a">›</text><text x="300.1" y="266" font-size="11" fill="#5ec4b6" class="m">result → Brain thread</text></g><g class="st s1"><text x="20" y="262" font-size="11" fill="#77746a">Add items in the app, or ask Brain in chat.</text><text x="20" y="280" font-size="11" fill="#77746a">A scheduled action runs as visible Work, never silently.</text></g></svg>
