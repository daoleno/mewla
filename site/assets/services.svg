<svg xmlns="http://www.w3.org/2000/svg" class="sv" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="sv-t sv-d" fill="none"><title id="sv-t">Services your agents started</title><desc id="sv-d">The Services sheet lists listening ports owned by Sessions or persistent units, grouped by project. Port 5173 can be made public with a temporary Quick Tunnel.</desc><style>.sv text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.sv .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.sv .st{opacity:0;transition:opacity .4s ease}.sv:not([data-state]) .s1,.sv[data-state="1"] .s1,.sv[data-state="2"] .s2{opacity:1}@media (prefers-reduced-motion:reduce){.sv .st{transition:none}}</style><rect class="bg" width="480" height="300" rx="18" fill="#0c0d0a"/><text x="20" y="32" font-size="14" fill="#f2eee5" font-weight="600">Services</text><text x="460" y="32" font-size="10.5" fill="#77746a" text-anchor="end" class="m">3 ports</text><text x="20" y="62" font-size="10.5" fill="#77746a" class="m">~/mewla</text><rect x="20" y="70" width="440" height="40" rx="10" fill="#1a1b16"/><text x="34" y="95" font-size="14" fill="#f2eee5" font-weight="600" class="m">8081</text><text x="84" y="88" font-size="12" fill="#f2eee5" font-weight="500">metro</text><text x="84" y="102" font-size="10" fill="#77746a" class="m">Session · onboarding</text><text x="20" y="132" font-size="10.5" fill="#77746a" class="m">~/site</text><rect x="20" y="140" width="440" height="40" rx="10" fill="#1a1b16"/><text x="34" y="165" font-size="14" fill="#f2eee5" font-weight="600" class="m">5173</text><text x="84" y="158" font-size="12" fill="#f2eee5" font-weight="500">vite</text><text x="84" y="172" font-size="10" fill="#77746a" class="m">Session · docs-sync</text><rect class="st s2" x="396.4" y="150" width="49.6" height="20" rx="10" fill="#1f3328"/><text class="st s2" x="421.2" y="163.6" font-size="10" fill="#8fcfa6" font-weight="500" text-anchor="middle">Public</text><rect x="20" y="186" width="440" height="40" rx="10" fill="#1a1b16"/><text x="34" y="211" font-size="14" fill="#f2eee5" font-weight="600" class="m">5432</text><text x="84" y="204" font-size="12" fill="#f2eee5" font-weight="500">postgres</text><text x="84" y="218" font-size="10" fill="#77746a" class="m">Persistent · pg.service</text><rect x="374.2" y="196" width="71.8" height="20" rx="10" fill="#22231d"/><text x="410.1" y="209.6" font-size="10" fill="#aaa699" font-weight="500" text-anchor="middle" class="m">127.0.0.1</text><g class="st s2"><rect x="20" y="238" width="440" height="44" rx="10" fill="#131410" stroke="#5f9d78" stroke-width="1"/><text x="34" y="256" font-size="10.5" fill="#77746a" class="m">Quick Tunnel · 5173</text><text x="34" y="272" font-size="11.5" fill="#8fcfa6" class="m">https://&lt;random&gt;.trycloudflare.com</text></g><g class="st s1"><text x="20" y="260" font-size="11" fill="#77746a">Loopback stays local. Mewla never invents a LAN URL.</text></g></svg>
