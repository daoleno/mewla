<svg xmlns="http://www.w3.org/2000/svg" class="rt" viewBox="0 0 960 560" data-n-viewbox="0 0 420 1162" data-state="1" role="img" aria-labelledby="rt-title rt-desc">
<title id="rt-title">Brain routes each task with routing.md</title>
<desc id="rt-desc">A task arrives. Brain reads routing.md, a short Markdown guide in its workspace, judges which agent, model and reasoning effort fit, and spawns a Worker. Examples: an onboarding redesign goes to claude with claude-opus-5-5 at high effort; a changelog typo to pi at low; a daemon reconnect race to codex with gpt-6-astra at xhigh; a request that names grok goes to grok with no effort level.</desc>
<style>
.rt{--paper:#fbfaf7;--card:#fff;--ink:#171a18;--ink2:#4a504c;--mute:#7a817c;--line:#e4e0d6;--sage:#559e72;--sage7:#2a5f41;--sage1:#dcf2e3;--sage0:#f1f9f3;--term:#1c211e;--term-t:#e9efe9;--term-m:#8fa597}
.rt text{white-space:pre;font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
.rt .m,.rt .m text{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.rt .mute{fill:var(--mute)}.rt .ink2{fill:var(--ink2)}
.rt .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:var(--mute)}
.rt .card{fill:var(--card);stroke:var(--line)}
.rt .wire{fill:none;stroke:var(--sage);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 6}
.rt .hl{fill:var(--sage0);stroke:var(--sage);stroke-width:1.5}
.rt .pick{fill:var(--sage0);stroke:var(--sage7);stroke-width:2}
.rt .tt{fill:var(--term-t)}.rt .tm{fill:var(--term-m)}.rt .tv{fill:#a8e3bd}
.rt-s{opacity:0}.rt-s1{opacity:1}
.rt.is-live .rt-s{opacity:0;transition:opacity .35s ease}
.rt.is-live[data-state="1"] .rt-s1,.rt.is-live[data-state="2"] .rt-s2,.rt.is-live[data-state="3"] .rt-s3,.rt.is-live[data-state="4"] .rt-s4{opacity:1}
@media (prefers-reduced-motion:no-preference){
.rt:not(.is-live) .rt-s{animation:rt-cycle 16s infinite both}
.rt:not(.is-live) .rt-s2{animation-delay:-12s}.rt:not(.is-live) .rt-s3{animation-delay:-8s}.rt:not(.is-live) .rt-s4{animation-delay:-4s}
.rt .wire{animation:rt-flow 1.2s linear infinite}
.rt .pulse{animation:rt-pulse 3.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
}
@keyframes rt-cycle{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes rt-flow{to{stroke-dashoffset:-18}}
@keyframes rt-pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
</style>
<rect class="rt-bg" width="100%" height="100%" rx="22" fill="#fbfaf7"/>

<!-- routing.md -->
<g class="rt-doc" data-n-transform="translate(-18 86)">
  <rect class="card" x="28.5" y="28.5" width="400" height="504" rx="16"/>
  <path d="M28.5 72.5h400" stroke="#e4e0d6"/>
  <path d="M48 41h12l5 5v14H48z" fill="none" stroke="#7a817c" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="74" y="57" class="m" font-size="13" font-weight="600">routing.md</text>
  <text x="410" y="57" class="m mute" font-size="11" text-anchor="end">~/.zen/brain/workspace</text>

  <rect class="hl rt-s rt-s4" x="40" y="99" width="376" height="26" rx="7"/>
  <rect class="hl rt-s rt-s1" x="40" y="374" width="376" height="50" rx="10"/>
  <rect class="hl rt-s rt-s2" x="40" y="262" width="376" height="50" rx="10"/>
  <rect class="hl rt-s rt-s3" x="40" y="318" width="376" height="50" rx="10"/>

  <g class="m" font-size="12.5">
    <text x="50" y="94" font-weight="700" font-size="13.5"># Worker Routing</text>
    <text x="50" y="117" class="ink2">- Pick by the task and your preferences.</text>
    <text x="50" y="145" class="ink2">- Effort by difficulty: low for mechanical</text>
    <text x="50" y="164" class="ink2">  edits, high for design and debugging,</text>
    <text x="50" y="183" class="ink2">  the top levels for the hardest problems.</text>
    <text x="50" y="211" class="ink2">- Prefer the cheapest route that will</text>
    <text x="50" y="230" class="ink2">  succeed.</text>
  </g>
  <g>
    <text x="54" y="284" font-size="13.5" font-weight="600">Small, low-risk edits</text>
    <text x="54" y="302" class="m mute" font-size="11.5">pi · opencode-go/deepseek-v4.1-flash · low</text>
    <text x="54" y="340" font-size="13.5" font-weight="600">Backend, daemon, infra</text>
    <text x="54" y="358" class="m mute" font-size="11.5">codex · gpt-6-astra · high</text>
    <text x="54" y="396" font-size="13.5" font-weight="600">Frontend, visual design, copy</text>
    <text x="54" y="414" class="m mute" font-size="11.5">claude · claude-opus-5-5 · high</text>
  </g>
  <path d="M48 450.5h360" stroke="#e4e0d6" stroke-dasharray="2 4"/>
  <text x="50" y="478" font-size="12.5" class="ink2">Plain Markdown. Zen never parses it.</text>
  <text x="50" y="498" font-size="12.5" class="ink2">Brain reads it before every spawn, then</text>
  <text x="50" y="518" font-size="12.5" class="ink2">rewrites a line when you state a preference.</text>
</g>

<!-- wires (wide layout only) -->
<g class="rt-wires" data-n-visibility="hidden">
  <path class="wire rt-s rt-s1" d="M428 399C442 399 440 360 440 320C440 262 486 236 532 236M628 236C690 236 698 110 758 110"/>
  <path class="wire rt-s rt-s2" d="M428 287C486 287 494 236 532 236M628 236C690 236 698 160 758 160"/>
  <path class="wire rt-s rt-s3" d="M428 343C486 343 494 236 532 236M628 236C690 236 698 60 758 60"/>
  <path class="wire rt-s rt-s4" d="M428 112C486 112 494 236 532 236M628 236C690 236 698 210 758 210"/>
  <path d="M580 120v58" stroke="#e4e0d6" stroke-width="2"/>
  <path d="M574 172l6 8 6-8" fill="none" stroke="#7a817c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- incoming task -->
<g class="rt-task" data-n-transform="translate(-370 -24)">
  <rect class="card" x="452.5" y="40.5" width="256" height="78" rx="14"/>
  <text x="472" y="66" class="cap">New task</text>
  <g font-size="14.5" font-weight="600">
    <text x="472" y="94" class="rt-s rt-s1">Redesign the onboarding screen</text>
    <text x="472" y="94" class="rt-s rt-s2">Fix a typo in the changelog</text>
    <text x="472" y="94" class="rt-s rt-s3">Daemon reconnect race</text>
    <text x="472" y="94" class="rt-s rt-s4">Port the parser to Go, use grok</text>
  </g>
</g>

<!-- Brain -->
<g class="rt-brain" data-n-transform="translate(-370 444)">
  <circle class="pulse" cx="580" cy="236" r="46" fill="none" stroke="#559e72" stroke-width="1.5"/>
  <circle cx="580" cy="236" r="46" fill="#f1f9f3" stroke="#559e72" stroke-width="1.5"/>
  <g transform="translate(549 205) scale(.06)" fill="none" stroke="#2a5f41" stroke-linecap="round" stroke-linejoin="round">
    <path d="M790 372C724 252 590 209 461 244C334 279 252 393 266 524C282 675 411 778 558 760C650 749 731 697 781 620" stroke-width="64"/>
    <path d="M334 430C470 352 622 334 665 371C694 396 671 440 601 495C486 586 401 663 437 705C472 747 606 730 722 801" stroke-width="78"/>
  </g>
  <text x="580" y="304" text-anchor="middle" font-size="14" font-weight="600">Brain</text>
</g>

<!-- Brain's judgment -->
<g class="rt-reason" data-n-transform="translate(-370 452)">
  <rect class="card" x="452.5" y="318.5" width="256" height="96" rx="14"/>
  <text x="472" y="344" class="cap">Brain's call</text>
  <g font-size="13.5" class="ink2">
    <g class="rt-s rt-s1"><text x="472" y="370">Screen design with product copy.</text><text x="472" y="391">Frontend line fits: claude, high.</text></g>
    <g class="rt-s rt-s2"><text x="472" y="370">One file, mechanical. The cheap</text><text x="472" y="391">route will succeed: pi, low.</text></g>
    <g class="rt-s rt-s3"><text x="472" y="370">Daemon code, so codex. A race is</text><text x="472" y="391">hard: effort above the guide.</text></g>
    <g class="rt-s rt-s4"><text x="472" y="370">You asked for grok. It takes a</text><text x="472" y="391">model only, so no effort level.</text></g>
  </g>
</g>

<!-- agent clients -->
<g class="rt-execs" font-size="12">
  <g data-n-transform="translate(-730 850)">
    <rect class="card" x="760.5" y="40.5" width="172" height="40" rx="11"/>
    <rect class="pick rt-s rt-s3" x="760.5" y="40.5" width="172" height="40" rx="11"/>
    <circle cx="779" cy="60.5" r="5" fill="#4e6ba2"/><text x="792" y="65" class="m" font-size="13">codex</text><text x="918" y="65" text-anchor="end" class="mute">Codex</text>
  </g>
  <g data-n-transform="translate(-542 800)">
    <rect class="card" x="760.5" y="90.5" width="172" height="40" rx="11"/>
    <rect class="pick rt-s rt-s1" x="760.5" y="90.5" width="172" height="40" rx="11"/>
    <circle cx="779" cy="110.5" r="5" fill="#b47c6c"/><text x="792" y="115" class="m" font-size="13">claude</text><text x="918" y="115" text-anchor="end" class="mute">Claude Code</text>
  </g>
  <g data-n-transform="translate(-730 800)">
    <rect class="card" x="760.5" y="140.5" width="172" height="40" rx="11"/>
    <rect class="pick rt-s rt-s2" x="760.5" y="140.5" width="172" height="40" rx="11"/>
    <circle cx="779" cy="160.5" r="5" fill="#559e72"/><text x="792" y="165" class="m" font-size="13">pi</text><text x="918" y="165" text-anchor="end" class="mute">Pi</text>
  </g>
  <g data-n-transform="translate(-542 750)">
    <rect class="card" x="760.5" y="190.5" width="172" height="40" rx="11"/>
    <rect class="pick rt-s rt-s4" x="760.5" y="190.5" width="172" height="40" rx="11"/>
    <circle cx="779" cy="210.5" r="5" fill="#3f4441"/><text x="792" y="215" class="m" font-size="13">grok</text><text x="918" y="215" text-anchor="end" class="mute">Grok</text>
  </g>
  <g data-n-transform="translate(-730 750)">
    <rect class="card" x="760.5" y="240.5" width="172" height="40" rx="11"/>
    <circle cx="779" cy="260.5" r="5" fill="#8a7c66"/><text x="792" y="265" class="m" font-size="13">agent</text><text x="918" y="265" text-anchor="end" class="mute">Cursor</text>
  </g>
  <g data-n-transform="translate(-542 700)">
    <rect class="card" x="760.5" y="290.5" width="172" height="40" rx="11"/>
    <circle cx="779" cy="310.5" r="5" fill="#c08a3e"/><text x="792" y="315" class="m" font-size="13">opencode</text><text x="918" y="315" text-anchor="end" class="mute">OpenCode</text>
  </g>
</g>

<!-- resulting spawn -->
<g class="rt-spawn m" font-size="12.5" data-n-transform="translate(-442 614)">
  <rect x="452" y="436" width="480" height="96" rx="14" fill="#1c211e" data-n-width="400"/>
  <text x="472" y="462" class="tt"><tspan class="tm">$</tspan> zen worker spawn \</text>
  <g class="rt-s rt-s1"><text x="472" y="482" class="tt">  -executor <tspan class="tv">claude</tspan> \</text><text x="472" y="500" class="tt">  -model <tspan class="tv">claude-opus-5-5</tspan> \</text><text x="472" y="518" class="tt">  -reasoning <tspan class="tv">high</tspan></text></g>
  <g class="rt-s rt-s2"><text x="472" y="482" class="tt">  -executor <tspan class="tv">pi</tspan> \</text><text x="472" y="500" class="tt">  -model <tspan class="tv">opencode-go/deepseek-v4.1-flash</tspan> \</text><text x="472" y="518" class="tt">  -reasoning <tspan class="tv">low</tspan></text></g>
  <g class="rt-s rt-s3"><text x="472" y="482" class="tt">  -executor <tspan class="tv">codex</tspan> \</text><text x="472" y="500" class="tt">  -model <tspan class="tv">gpt-6-astra</tspan> \</text><text x="472" y="518" class="tt">  -reasoning <tspan class="tv">xhigh</tspan></text></g>
  <g class="rt-s rt-s4"><text x="472" y="482" class="tt">  -executor <tspan class="tv">grok</tspan></text><text x="472" y="500" class="tm">  # model: the client's default</text><text x="472" y="518" class="tm">  # grok takes no -reasoning</text></g>
</g>
</svg>
