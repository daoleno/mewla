>Work recorded · objective and finish line</text><rect x="746" y="300" width="59.4" height="20" rx="10" fill="#22231d"/><text x="775.7" y="313.6" font-size="10" fill="#aaa699" font-weight="500" text-anchor="middle" class="m">planned</text></g><g class="st s2"><text x="746" y="290" font-size="11" fill="#aaa699" class="m">Worker · pi · low reasoning</text><circle cx="752" cy="309" r="3.5" fill="#8fcfa6"/><text x="762" y="313" font-size="10.5" fill="#8fcfa6">running in tmux · open as Chat or Terminal</text></g><g class="st s3"><text x="746" y="290" font-size="11" fill="#aaa699">matches the merged commits</text><rect x="746" y="300" width="9" height="9" rx="2" fill="#5ec4b6"/><text x="762" y="309" font-size="11" fill="#5ec4b6" class="m">accepted</text></g><path d="M680 104C710 104,700 283,730 283" fill="none" stroke="#5f9d78" stroke-width="1.2" class="st s2 flow"/><path d="M680 104C710 104,700 283,730 283" fill="none" stroke="#3b3c34" stroke-width="1" class="st s3"/><path d="M195 240C249 240,290 142.0,340 142.0" fill="none" stroke="#3b3c34" stroke-width="1"/><text x="263" y="316" font-size="10.5" fill="#77746a" class="m">reads before every spawn</text><text x="24" y="358" font-size="11" fill="#77746a" class="st s3">Only Brain or you can close Work. An exited process never counts as done.</text></svg>
