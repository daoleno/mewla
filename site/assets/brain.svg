<svg data-state="2" xmlns="http://www.w3.org/2000/svg" class="bw" viewBox="0 0 1100 376" width="1100" height="376" role="img" aria-labelledby="bw-t bw-d" fill="none"><title id="bw-t">Brain turns a goal into Work and routes each part</title><desc id="bw-d">You send Brain one goal. Brain writes three Work items, reads routing.md and gives each to a Worker: the crash to claude at high reasoning, the filters to codex at medium, the changelog to pi at low. Brain reviews the results, accepts two and sends one back for a test.</desc><style>.bw text{font-family:Archivo,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.bw .m{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.bw .st{opacity:0;transition:opacity .4s ease}.bw:not([data-state]) .s1,.bw[data-state="1"] .s1,.bw[data-state="2"] .s2,.bw[data-state="3"] .s3{opacity:1}@media (prefers-reduced-motion:reduce){.bw .st{transition:none}}
.bw .flow{stroke-dasharray:4 5;animation:bw-f 1.6s linear infinite}
@keyframes bw-f{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.bw .flow{animation:none}}
</style><rect class="bg" width="1100" height="376" rx="18" fill="#0c0d0a"/><text x="24" y="44" font-size="9.5" fill="#77746a" class="m" letter-spacing="1.2">YOU, FROM THE PHONE</text><rect x="24" y="56" width="270" height="86" rx="18" fill="#22231d"/><text x="40" y="82" font-size="13.5" fill="#f2eee5">Ship the 0.2 beta: fix the resume</text><text x="40" y="101" font-size="13.5" fill="#f2eee5">crash, add session filters and</text><text x="40" y="120" font-size="13.5" fill="#f2eee5">write the changelog.</text><circle cx="159" cy="240" r="34" fill="none" stroke="#1f3328" stroke-width="1"/><circle cx="159" cy="240" r="26" fill="#10140f" stroke="#5f9d78" stroke-width="1.2"/><g transform="translate(129.1 210.1) scale(0.0583984)" fill="none" stroke="#f2eee5" stroke-linecap="round" stroke-linejoin="round"><path d="M790 372C724 252 590 209 461 244C334 279 252 393 266 524C282 675 411 778 558 760C650 749 731 697 781 620" stroke-width="64"/><path d="M334 430C470 352 622 334 665 371C694 396 671 440 601 495C486 586 401 663 437 705C472 747 606 730 722 801" stroke-width="78"/></g><text x="159" y="298" font-size="14" fill="#f2eee5" font-weight="600" text-anchor="middle">Brain</text><text x="159" y="316" font-size="10.5" fill="#77746a" text-anchor="middle" class="m">on your computer</text><path d="M159 148L159 202" stroke="#3b3c34" stroke-width="1"/><rect x="340" y="40" width="340" height="204" rx="14" fill="#131410" stroke="#2a2b24" stroke-width="1"/><text x="356" y="66" font-size="12" fill="#f2eee5" font-weight="500" class="m">routing.md</text><text x="664" y="66" font-size="10" fill="#77746a" text-anchor="end" class="m">~/.zen/brain/workspace</text><path d="M340 80L680 80" stroke="#2a2b24" stroke-width="1"/><rect x="346" y="86" width="328" height="36" rx="8" fill="#1f3328" class="st s2 s3"/><text x="356" y="101" font-size="12" fill="#f2eee5">Tiny mechanical edit</text><text x="356" y="116" font-size="10.5" fill="#77746a" class="m">pi · fast model · low</text><text x="356" y="116" font-size="10.5" fill="#8fcfa6" class="m st s2 s3">pi · fast model · low</text><rect x="346" y="126" width="328" height="36" rx="8" fill="#1f3328" class="st s2 s3"/><text x="356" y="141" font-size="12" fill="#f2eee5">Routine implementation</text><text x="356" y="156" font-size="10.5" fill="#77746a" class="m">codex · default · medium</text><text x="356" y="156" font-size="10.5" fill="#8fcfa6" class="m st s2 s3">codex · default · medium</text><text x="356" y="181" font-size="12" fill="#f2eee5">Visual design, frontend, copy</text><text x="356" y="196" font-size="10.5" fill="#77746a" class="m">claude · default · high</text><rect x="346" y="206" width="328" height="36" rx="8" fill="#1f3328" class="st s2 s3"/><text x="356" y="221" font-size="12" fill="#f2eee5">Hard design or debugging</text><text x="356" y="236" font-size="10.5" fill="#77746a" class="m">claude · strongest · high</text><text x="356" y="236" font-size="10.5" fill="#8fcfa6" class="m st s2 s3">claude · strongest · high</text><rect x="730" y="40" width="346" height="86" rx="14" fill="#1a1b16" stroke="#2a2b24" stroke-width="1"/><text x="746" y="64" font-size="10.5" fill="#77746a" class="m">w_41</text><text x="788" y="64" font-size="13.5" fill="#f2eee5" font-weight="500">Android crash on resume</text><g class="st s1"><text x="746" y="90" font-size="11" fill="#aaa699">Work recorded · objective and finish line</text><rect x="746" y="100" width="59.4" height="20" rx="10" fill="#22231d"/><text x="775.7" y="113.6" font-size="10" fill="#aaa699" font-weight="500" text-anchor="middle" class="m">planned</text></g><g class="st s2"><text x="746" y="90" font-size="11" fill="#aaa699" class="m">Worker · claude · high reasoning</text><circle cx="752" cy="109" r="3.5" fill="#8fcfa6"/><text x="762" y="113" font-size="10.5" fill="#8fcfa6">running in tmux · open as Chat or Terminal</text></g><g class="st s3"><text x="746" y="90" font-size="11" fill="#aaa699">diff + repro checked</text><rect x="746" y="100" width="9" height="9" rx=