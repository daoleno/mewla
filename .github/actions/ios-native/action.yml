name: iOS native toolchain
description: >
  The verified iOS Ghostty XCFramework the NSH client links. Shared by the
  signed release, the client's Simulator build and the cache warmer so their
  cache keys cannot drift. Only native-cache.yml on main saves caches: GitHub
  scopes a cache to the ref that saved it, so a tag run can read main's caches
  but nothing can read a tag's. Never caches signing material or signed output.

inputs:
  save-caches:
    description: "'true' only in native-cache.yml on main"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Key caches on the Apple toolchain
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail
        TOOLCHAIN_KEY="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; } | shasum -a 256 | cut -c1-20)"
        echo "cache_key=$TOOLCHAIN_KEY" >> "$GITHUB_OUTPUT"

    - name: Verify shared native contract
      shell: bash
      run: ./scripts/verify-libghostty.sh --contract

    # Ghostty output: the verified XCFramework.
    - name: Restore verified iOS Ghostty output
      id: ghostty-output-cache
      if: ${{ inputs.save-caches != 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: native/terminal-vt/libs/ios
        key: ios-ghostty-output-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('native/terminal-vt/native.lock.json', 'scripts/build-libghostty-ios.sh', 'scripts/lib/zig.sh', 'scripts/lib/ghostty_release.py', 'scripts/lib/minisign_verify.py', 'scripts/lib/zig-xcode-compat.sh', 'scripts/zig-xcode-compat/**', 'scripts/verify-libghostty-ios.sh', 'client/ui/more/settings/licenses/texts/Ghostty-MIT.txt') }}
    - name: Restore or save verified iOS Ghostty output
      id: ghostty-output-cache-rw
      if: ${{ inputs.save-caches == 'true' }}
      uses: actions/cache@v4
      with:
        path: native/terminal-vt/libs/ios
        key: ios-ghostty-output-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('native/terminal-vt/native.lock.json', 'scripts/build-libghostty-ios.sh', 'scripts/lib/zig.sh', 'scripts/lib/ghostty_release.py', 'scripts/lib/minisign_verify.py', 'scripts/lib/zig-xcode-compat.sh', 'scripts/zig-xcode-compat/**', 'scripts/verify-libghostty-ios.sh', 'client/ui/more/settings/licenses/texts/Ghostty-MIT.txt') }}

    # Ghostty build inputs: the pinned Zig and the signed release tarballs.
    - name: Restore pinned Zig and Ghostty source
      if: ${{ steps.ghostty-output-cache.outputs.cache-hit != 'true' && inputs.save-caches != 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/tools
          ${{ runner.temp }}/ghostty
        key: ios-native-inputs-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('native/terminal-vt/native.lock.json', 'scripts/build-libghostty-ios.sh', 'scripts/lib/zig.sh', 'scripts/lib/ghostty_release.py', 'scripts/lib/minisign_verify.py', 'scripts/lib/zig-xcode-compat.sh', 'scripts/zig-xcode-compat/**') }}
    - name: Restore or save pinned Zig and Ghostty source
      if: ${{ steps.ghostty-output-cache-rw.outputs.cache-hit != 'true' && inputs.save-caches == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/tools
          ${{ runner.temp }}/ghostty
        key: ios-native-inputs-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache_key }}-${{ hashFiles('native/terminal-vt/native.lock.json', 'scripts/build-libghostty-ios.sh', 'scripts/lib/zig.sh', 'scripts/lib/ghostty_release.py', 'scripts/lib/minisign_verify.py', 'scripts/lib/zig-xcode-compat.sh', 'scripts/zig-xcode-compat/**') }}

    - name: Build iOS Ghostty XCFramework when the cache misses
      if: ${{ steps.ghostty-output-cache.outputs.cache-hit != 'true' && steps.ghostty-output-cache-rw.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        MEWLA_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
        MEWLA_TOOL_CACHE: ${{ runner.temp }}/tools
      run: ./scripts/build-libghostty-ios.sh

    - name: Verify iOS Ghostty XCFramework
      shell: bash
      run: ./scripts/verify-libghostty-ios.sh
