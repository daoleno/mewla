name: Upgrade from the latest release

# What a person on the latest release gets when they install main over it, tested on main's
# schedule. It used to gate every release (android-upgrade in release-artifacts.yml); now a failure
# here is a bug to fix now, filed as an issue, and does not hold an unrelated release
# (docs/ci-release.md).
#
# Android: the starting release's APK pairs with its daemon and keeps a draft; the target's APK, signed
# with the release key, installs over it, opens paired and Connected with the same device key and the
# draft, and its scanner runs (client/scripts/release-upgrade.sh).
#
# The target is main (built here, the schedule's use) or a release tag (its published APK). The start is
# the release before the target: for main the latest stable release, for a tag the stable release before
# it. So the daily run proves latest -> main, and a run right after a release proves previous -> new
# instead of the release against itself: dispatch with `to` = the new tag. `from` pins another start.
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Release tag to start from (empty: the stable release before the target)"
        required: false
        default: ""
        type: string
      to:
        description: "Target: main (built here) or a release tag such as v0.4.17 (its published APK)"
        required: false
        default: "main"
        type: string

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-public:
    name: Public Windows daemon 0.4.22 to 0.4.23
    if: github.event_name == 'workflow_dispatch' && inputs.to == 'v0.4.23'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.4.23
          fetch-depth: 0
      - name: Install the previous public archive and update the running daemon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor fdd499a459ab9d5845eb09d10520d8fdc17c1802 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'The release does not contain the approved fix' }
          $env:MEWLA_VERSION = 'v0.4.22'
          $env:MEWLA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Mewla-public'
          $env:MEWLA_STATE_ROOT = Join-Path $env:RUNNER_TEMP 'Mewla-public-state'
          $env:MEWLA_NO_PATH_UPDATE = '1'
          $env:MEWLA_NO_START = '1'
          $env:MEWLA_NO_AUTOUPDATE = '1'
          ./install.ps1
          Remove-Item Env:MEWLA_VERSION
          $exe = Join-Path $env:MEWLA_INSTALL_DIR 'mewla.exe'
          $process = Start-Process $exe -ArgumentList 'serve','-addr','127.0.0.1:19876','-loopback-only' -PassThru -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'mewla.err') -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'mewla.out')
          function Wait-Version([string]$version) {
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:19876/health' -TimeoutSec 2
                if ($health.version -eq $version -and $health.daemon_id) { return $health }
              } catch {}
              Start-Sleep -Seconds 1
            }
            throw "Running daemon did not answer with $version"
          }
          $before = Wait-Version '0.4.22'
          & $exe update
          if ($LASTEXITCODE -ne 0) { throw 'Public update failed' }
          $after = Wait-Version '0.4.23'
          if ($before.daemon_id -ne $after.daemon_id) { throw 'Daemon identity changed' }
          Write-Host "Public Windows upgrade passed: $($before.version) to $($after.version), same daemon identity."
  android:
    name: Android (${{ inputs.from || 'previous release' }} → ${{ inputs.to || 'main' }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
      - name: Install NSH
        timeout-minutes: 10
        run: client/scripts/fetch-nsh.sh
      - name: Which releases
        env:
          GH_TOKEN: ${{ github.token }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          TO="${IN_TO:-main}"
          [[ "$TO" == main || "$TO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "to must be main or a vX.Y.Z tag, got '$TO'"; exit 1; }
          # Stable releases, newest first.
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts --limit 30 \
            --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/stable.txt"
          if [[ -n "$IN_FROM" ]]; then
            [[ "$IN_FROM" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "from must be a vX.Y.Z tag, got '$IN_FROM'"; exit 1; }
            FROM="$IN_FROM"
          elif [[ "$TO" == main ]]; then
            FROM="$(head -1 "$RUNNER_TEMP/stable.txt")"
          else
            # The stable release right after $TO in the newest-first list; none when $TO is not listed or is the oldest.
            FROM="$(awk -v t="$TO" 'f { print; exit } $0 == t { f = 1 }' "$RUNNER_TEMP/stable.txt")"
          fi
          [[ -n "$FROM" ]] || { echo "no stable release before $TO to start from"; exit 1; }
          [[ "$FROM" != "$TO" ]] || { echo "from and to are both $FROM: that tests a release against itself"; exit 1; }
          echo "upgrading from $FROM to $TO"
          echo "OLD=$FROM" >> "$GITHUB_ENV"
          echo "TARGET=$TO" >> "$GITHUB_ENV"
      - name: The starting release's APK and daemon
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old"
          gh release download "$OLD" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/old" \
            --pattern "mewla-android-arm64-$OLD.apk" --pattern mewla-linux-amd64.tar.gz --pattern SHA256SUMS
          cd "$RUNNER_TEMP/old"
          grep -E " (mewla-android-arm64-$OLD.apk|mewla-linux-amd64.tar.gz)$" SHA256SUMS | sha256sum -c -
          tar -xzf mewla-linux-amd64.tar.gz
          {
            echo "OLD_APK=$RUNNER_TEMP/old/mewla-android-arm64-$OLD.apk"
            echo "MEWLA=$(find "$RUNNER_TEMP/old" -name mewla -type f -perm -u+x | head -1)"
          } >> "$GITHUB_ENV"
      # A release tag as the target needs no build: its published APK, checked against the release's SHA256SUMS.
      - name: The target release's APK
        if: env.TARGET != 'main'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new"
          gh release download "$TARGET" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/new" \
            --pattern "mewla-android-arm64-$TARGET.apk" --pattern SHA256SUMS
          cd "$RUNNER_TEMP/new"
          grep -E " mewla-android-arm64-$TARGET.apk$" SHA256SUMS | sha256sum -c -
          echo "NEW_APK=$RUNNER_TEMP/new/mewla-android-arm64-$TARGET.apk" >> "$GITHUB_ENV"
      - name: Materialize the release keystore (temp, mode 0600)
        if: env.TARGET == 'main'
        env:
          MEWLA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
          MEWLA_ANDROID_KEYSTORE: ${{ runner.temp }}/mewla-release.p12
        run: ./scripts/materialize-android-keystore.sh > /dev/null
      # The same build as a release's APK (scripts/android-release-apk.sh), from main.
      - name: Build main's signed APK
        if: env.TARGET == 'main'
        timeout-minutes: 40
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          MEWLA_ANDROID_KEYSTORE: ${{ runner.temp }}/mewla-release.p12
          MEWLA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZEN_ANDROID_KEYSTORE_PASSWORD }}
          MEWLA_ANDROID_KEY_ALIAS: ${{ secrets.ZEN_ANDROID_KEY_ALIAS }}
          MEWLA_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          ./scripts/android-release-apk.sh
          echo "NEW_APK=$(ls -t dist-download/android-native/mewla-android-arm64-*.apk | head -1)" >> "$GITHUB_ENV"
      - name: Shred the keystore
        if: always()
        run: |
          KS="${{ runner.temp }}/mewla-release.p12"
          [[ -f "$KS" ]] && { shred -u "$KS" 2>/dev/null || rm -f "$KS"; } || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        env:
          OUT: ${{ runner.temp }}/upgrade
          # main's tracked version is the latest release's until the next release moves it; a release
          # tag as the target must be a real upgrade.
          MEWLA_UPGRADE_SAME_VERSION_OK: ${{ (inputs.to || 'main') == 'main' && '1' || '' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: client/scripts/release-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-android-upgrade-${{ github.run_id }}
          path: ${{ runner.temp }}/upgrade
          retention-days: 30

  # A red upgrade test is a bug to fix now: say so on one open issue rather than in a run nobody reads.
  report:
    name: File the failure
    needs: android
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upgrade from the latest release fails"
          msg="Main ($GITHUB_SHA) does not upgrade cleanly from the latest release: $RUN"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1) || n=""
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"; else gh issue create --title "$title" --body "$msg"; fi
