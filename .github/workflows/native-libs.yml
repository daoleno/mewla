name: Native libs (libghostty-vt)

# Optional / release path: builds pinned Ghostty VT Android libraries.
# Not part of default PR CI (Zig + Ghostty compile is heavy).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-libs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libghostty:
    name: Build Android libghostty-vt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Contract check
        run: ./scripts/verify-libghostty.sh --contract

      - name: Build libraries
        env:
          MEWLA_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          MEWLA_TOOL_CACHE: ${{ runner.temp }}/tools
        run: ./scripts/build-libghostty.sh

      - name: Verify libraries (release grade)
        run: ./scripts/verify-libghostty.sh --release && ./scripts/verify-libghostty.sh

      - name: Upload libghostty artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-android
          path: |
            app/modules/terminal-vt/libs/android/**/libghostty_vt.so
            app/modules/terminal-vt/libs/android/SHA256SUMS
            app/modules/terminal-vt/libs/android/build-manifest.json
            app/modules/terminal-vt/libs/android/GHOSTTY-MIT.txt
            app/assets/notices/GHOSTTY-MIT.txt
          if-no-files-found: error

  build-libghostty-ios:
    name: Build iOS libghostty-vt XCFramework
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Contract check
        run: ./scripts/verify-libghostty.sh --contract

      - name: Build and verify XCFramework
        env:
          MEWLA_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          MEWLA_TOOL_CACHE: ${{ runner.temp }}/tools
        run: ./scripts/build-libghostty-ios.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Generate iOS project and install pods
        run: |
          cd app
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          ../../scripts/assert-ios-camera-barcode-pod.sh Podfile.lock

      - name: Compile and link iOS bridge for Apple Silicon simulator
        run: |
          cd app/ios
          set -o pipefail
          xcodebuild \
            -workspace Mewla.xcworkspace \
            -scheme Mewla \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Compile and link iOS bridge for arm64 device SDK
        run: |
          cd app/ios
          set -o pipefail
          xcodebuild \
            -workspace Mewla.xcworkspace \
            -scheme Mewla \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Upload iOS libghostty artifact
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-ios
          path: |
            app/modules/terminal-vt/libs/ios/GhosttyVt.xcframework/**
            app/modules/terminal-vt/libs/ios/GHOSTTY-MIT.txt
            app/modules/terminal-vt/libs/ios/SHA256SUMS
            app/modules/terminal-vt/libs/ios/build-manifest.json
          if-no-files-found: error
