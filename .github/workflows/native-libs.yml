name: Native libs (libghostty-vt)

# Optional / release path: builds pinned Ghostty VT Android libraries and the
# iOS XCFramework into native/terminal-vt/libs (where client/android and
# client/ios link them from, -Pmewla.ghostty / MEWLA_GHOSTTY), and links the
# NSH client's iOS host against the XCFramework.
# Not part of default PR CI (Zig + Ghostty compile is heavy).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-libs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libghostty:
    name: Build Android libghostty-vt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Contract check
        run: ./scripts/verify-libghostty.sh --contract

      - name: Build libraries
        env:
          MEWLA_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          MEWLA_TOOL_CACHE: ${{ runner.temp }}/tools
        run: ./scripts/build-libghostty.sh

      - name: Verify libraries (release grade)
        run: ./scripts/verify-libghostty.sh --release && ./scripts/verify-libghostty.sh

      - name: Upload libghostty artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-android
          path: |
            native/terminal-vt/libs/android/**/libghostty_vt.so
            native/terminal-vt/libs/android/SHA256SUMS
            native/terminal-vt/libs/android/build-manifest.json
            native/terminal-vt/libs/android/GHOSTTY-MIT.txt
            native/terminal-vt/include/ghostty/**
          if-no-files-found: error

  build-libghostty-ios:
    name: Build iOS libghostty-vt XCFramework
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Contract check
        run: ./scripts/verify-libghostty.sh --contract

      - name: Build and verify XCFramework
        env:
          MEWLA_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          MEWLA_TOOL_CACHE: ${{ runner.temp }}/tools
        run: ./scripts/build-libghostty-ios.sh

      # The NSH client's iOS host links the XCFramework (client/ios/project.yml MEWLA_GHOSTTY).
      - name: Install NSH and the iOS framework
        run: client/scripts/fetch-nsh.sh --ios

      - name: Generate the client's Xcode project
        run: |
          brew install xcodegen > /dev/null
          client/scripts/ios-project.sh

      - name: Compile and link the client's terminal for Apple Silicon simulator
        run: |
          cd client/ios
          set -o pipefail
          xcodebuild \
            -project Mewla.xcodeproj \
            -scheme Mewla \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Compile and link the client's terminal for arm64 device SDK
        run: |
          cd client/ios
          set -o pipefail
          xcodebuild \
            -project Mewla.xcodeproj \
            -scheme Mewla \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Upload iOS libghostty artifact
        uses: actions/upload-artifact@v4
        with:
          name: libghostty-vt-ios
          path: |
            native/terminal-vt/libs/ios/GhosttyVt.xcframework/**
            native/terminal-vt/libs/ios/GHOSTTY-MIT.txt
            native/terminal-vt/libs/ios/SHA256SUMS
            native/terminal-vt/libs/ios/build-manifest.json
          if-no-files-found: error
