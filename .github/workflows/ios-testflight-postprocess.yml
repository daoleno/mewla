name: iOS TestFlight post-process

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric iOS marketing version"
        required: true
        type: string
      build_number:
        description: "Existing Preview CFBundleVersion"
        required: true
        type: string

permissions:
  contents: read

jobs:
  postprocess:
    name: Process and distribute existing Preview build
    runs-on: macos-26
    environment: app-store-connect-preview
    env:
      MEWLA_ASC_APP_ID: ${{ vars.MEWLA_ASC_PREVIEW_APP_ID }}
      MEWLA_IOS_VERSION: ${{ inputs.version }}
      MEWLA_IOS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate input and Individual API key secrets
        env:
          MEWLA_ASC_KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          MEWLA_ASC_API_KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$MEWLA_IOS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$MEWLA_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          if [[ ! "$MEWLA_ASC_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "error: configure the numeric MEWLA_ASC_PREVIEW_APP_ID variable for Mewla Preview" >&2
            exit 1
          fi
          test -n "$MEWLA_ASC_KEY_ID"
          test -n "$MEWLA_ASC_API_KEY_BASE64"

      - name: Process, attach public group, and submit Beta App Review
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/mewla-asc-individual-key.p8
          MEWLA_ASC_KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          MEWLA_ASC_API_KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 - "$ASC_KEY_PATH" <<'PY'
          import base64, os, pathlib, sys
          data = base64.b64decode(os.environ["MEWLA_ASC_API_KEY_BASE64"], validate=True)
          if not data:
              raise SystemExit("error: Individual API key decoded to an empty file")
          path = pathlib.Path(sys.argv[1])
          path.write_bytes(data)
          path.chmod(0o600)
          PY
          ./scripts/app-store-connect-upload.py \
            --postprocess-only \
            --app-id "$MEWLA_ASC_APP_ID" \
            --version "$MEWLA_IOS_VERSION" \
            --build-number "$MEWLA_IOS_BUILD_NUMBER" \
            --key-id "$MEWLA_ASC_KEY_ID" \
            --key-path "$ASC_KEY_PATH" \
            --beta-group-name "Mewla Preview" \
            --submit-beta-review

      - name: Remove temporary Individual API key
        if: always()
        run: rm -f "${{ runner.temp }}/mewla-asc-individual-key.p8"
