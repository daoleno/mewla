name: Mewla for Mac

# Builds Mewla for Mac (client/macos/package.sh): the AppKit host, client/ui and the darwin daemon in one bundle,
# signed ad hoc. Mewla Dev (--dev) for a dispatch that asks for it or a push to a mac-app/ branch, which the
# skeleton's proof on a Mac installs beside Mewla. Developer ID signing, notarization and the .dmg come with the
# release job.

on:
  workflow_dispatch:
    inputs:
      dev:
        description: "Mewla Dev (com.daoleno.mewla.dev), which installs beside Mewla"
        type: boolean
        default: true
      takeover_run:
        description: "Verify takeover from proof run ID, or tag:vX.Y.Z for the public DMG over the previous stable CLI"
        type: string
  push:
    branches: ["mac-app/**"]

permissions:
  contents: read

jobs:
  app:
    name: Build Mewla for Mac
    if: ${{ !inputs.takeover_run }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The pinned Zig, the darwin terminal engine and the browser terminal's VT, from main's caches.
      - name: Zig, the terminal engine and the web VT from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: darwin_arm64
          web: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      # NSH 0.6 needs Rust 1.97 or later.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/macos/target
          key: macos-app-v1-${{ hashFiles('client/macos/Cargo.toml', 'client/macos/Cargo.lock') }}
          restore-keys: macos-app-v1-
      - name: Build the daemon
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/darwin_arm64"
          ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/daemon" --targets darwin-arm64 --web-ui build
          "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --version
      # Mewla (com.daoleno.mewla, its daemon a LaunchAgent) and Mewla Dev (beside it, its daemon its child).
      - name: Package the app
        run: |
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --out "$RUNNER_TEMP/app"
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --out "$RUNNER_TEMP/app" --dev
      # The release's secrets once it is Developer ID signed (secure.rs): this runner's login Keychain sets, reads,
      # takes a secret over from an older build's secure.json, and removes, under a test service of its own.
      - name: The Keychain keeps the release's secrets
        run: MEWLA_KEYCHAIN_TEST=1 cargo test --release --manifest-path client/macos/Cargo.toml keychain -- --nocapture
      # What a relay → LAN proof can use on this runner: its private addresses, and whether pf can cut an established
      # connection to the runner's own address (traffic to it rides lo0).
      - name: The runner's network, for the Mewla Relay LAN proof
        continue-on-error: true
        run: |
          ifconfig | grep -E "^[a-z]|inet " || true
          ip=$(ipconfig getifaddr en0 || ifconfig | awk '/inet (10|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\./ {print $2; exit}')
          echo "private address: ${ip:-none}"
          grep -v '^#' /etc/pf.conf || true
          test -n "$ip" || exit 0
          python3 - "$ip" <<'PY'
          import socket, subprocess, sys, threading, time
          ip = sys.argv[1]
          srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); srv.bind((ip, 18999)); srv.listen()
          def serve():
              c, _ = srv.accept()
              while (d := c.recv(64)): c.sendall(d)
          threading.Thread(target=serve, daemon=True).start()
          cl = socket.create_connection((ip, 18999)); cl.settimeout(3)
          cl.sendall(b"a"); print("before the cut:", cl.recv(8))
          rules = f"block return quick proto tcp from any to {ip} port 18999\nblock return quick proto tcp from {ip} port 18999 to any\n"
          subprocess.run(["sudo", "pfctl", "-a", "com.apple/250.MewlaProof", "-f", "-"], input=rules.encode())
          subprocess.run(["sudo", "pfctl", "-E"]); subprocess.run(["sudo", "pfctl", "-k", ip])
          t = time.time()
          try:
              cl.sendall(b"b"); print("after the cut:", cl.recv(8), f"{time.time()-t:.1f}s")
          except Exception as e:
              print("after the cut: error", type(e).__name__, e, f"{time.time()-t:.1f}s")
          subprocess.run(["sudo", "pfctl", "-a", "com.apple/250.MewlaProof", "-F", "all"])
          PY
      - name: Mewla Relay's pinned tunnels carry bytes only to the pinned key
        run: "cargo test --release --manifest-path client/macos/Cargo.toml link:: -- --nocapture"
      - name: The bundles carry their daemon and CLI
        run: |
          set -euo pipefail
          plutil -lint "$RUNNER_TEMP/app/Mewla.app/Contents/Library/LaunchAgents/com.daoleno.mewla.daemon.plist"
          test ! -e "$RUNNER_TEMP/app/Mewla Dev.app/Contents/Library"
          for app in "$RUNNER_TEMP/app/Mewla.app" "$RUNNER_TEMP/app/Mewla Dev.app"; do
          "$app/Contents/Helpers/mewla" --version
          help=$("$app/Contents/Helpers/mewla" pair --help 2>&1 || true)
          grep -q -- '-json' <<<"$help"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"
          test -f "$app/Contents/Resources/nsh/bundle.nshc"
          done
      # Mewla Dev runs here (its own state and port; in the foreground, so it has its menu bar item): its bundle loads,
      # it joins its daemon, opens the perch and Pair a phone, then Settings and the shortcut offer; the windows are
      # captured (no agent here, so Brain does not start). A JS error in the app's log fails the step.
      # A stand-in claude (no agent on a runner): Brain's host starts, so Ready, the thread and its terminal show.
      - name: A stub agent for the smoke run
        run: |
          sudo clang -Wall -Werror client/macos/scripts/stub-claude.c -o /usr/local/bin/claude
          claude --version
      - name: Mewla Dev runs and shows its windows
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dev-run"; mkdir -p "$D/data"
          chrome_hosts="$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.mewla.browser.json"
          manifest_before=$(shasum -a 256 "$chrome_hosts" 2>/dev/null || echo none)
          printf '%s' '{"mewla:theme_preference":"classic-light"}' > "$D/data/storage.json"
          ditto -x -k "$RUNNER_TEMP/app/Mewla-Dev-"*-macos-aarch64.zip "$D"
          start() {
            env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/bash LANG=en_US.UTF-8 TMPDIR="$TMPDIR" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              MEWLA_APP_STATE_ROOT="$D/state" MEWLA_APP_DATA_DIR="$D/data" MEWLA_APP_ADDR=127.0.0.1:19877 \
              MEWLA_APP_PHONE_ADDRESS=http://127.0.0.1:19877 \
              MEWLA_APP_DEV_SCRIPT="$2" \
              "$D/Mewla Dev.app/Contents/MacOS/Mewla Dev" > "$D/app-$1.out" 2>&1 &
            echo $! > "$D/app.pid"
          }
          # A SIGTERM skips the app's own stop of its daemon: the daemon sees its parent gone (MEWLA_EXIT_WITH_PARENT)
          # and stops by itself, its session host and Sessions with it; anything still running after 120 s fails the step.
          stop() {
            kill -TERM "$(cat "$D/app.pid")"
            for i in $(seq 1 120); do pgrep -f "$D" >/dev/null || { echo "everything stopped $i s after the app"; return 0; }; sleep 1; done
            echo "the daemon outlived the app:"; pgrep -fl "$D" || true
            tail -40 "$D/state/logs/app-daemon.log" || true
            pkill -TERM -f "$D" || true
            return 1
          }
          # Three runs per appearance, one surface group each (a window that takes the focus closes the perch):
          # the perch and Pair a phone; Settings › General and the shortcut offer; Settings › Privacy & access; Brain's
          # host's terminal (the web terminal in a web view, its page from the app's own daemon).
          # No agent on this Mac (m-noagent): the stub claude moved aside for that run, so Brain has no agent.
          # Terminal attach (w-attach): on Brain's terminal the header's Attach path with three files: one that goes up
          # (its path typed at the prompt), one whose name is too long to upload (a failed chip), one still uploading at the capture.
          # Then the pages and sizes the designer had no capture of: home, Calendar, Screen, This Mac, the window at
          # 760 and in full screen. Last, the window minimized: the Dock keeps the app's icon (Regular, not Accessory).
          scripts=('main={"perch":true,"pairPhone":true}' 'general={"settings":"general","shortcutOffer":true}' 'access={"settings":"access"}' 'terminal={"terminal":true}' 'attach={"terminal":true,"attach":true}' 'noagent={}' \
            'home={}' 'calendar={"open":"calendar"}' 'screen={"open":"screen"}' 'mac={"open":"computer"}' 'small={"size":[760,720]}' 'full={"fullScreen":true}' 'minimize={"minimize":6}' 'grant={"grant":"asked"}' 'grantno={"grant":"not_now"}')
          for theme in light dark; do for entry in "${scripts[@]}"; do
            name="${entry%%=*}"; script="${entry#*=}"
            python3 -I -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["mewla:theme_preference"]="classic-"+sys.argv[2]; json.dump(d,open(p,"w"))' "$D/data/storage.json" "$theme"
            seen=$(cat "$D"/data/logs/* 2>/dev/null | grep -c "dev script: connected" || true)
            gseen=$(cat "$D"/data/logs/* 2>/dev/null | grep -cE 'dev script: grant (card|stopped)' || true)
            gpressed=$(cat "$D"/data/logs/* 2>/dev/null | grep -cE 'dev script: grant (pressed|press failed)' || true)
            if [ "$name" = noagent ]; then sudo mv /usr/local/bin/claude /usr/local/bin/claude.aside; fi
            start "$theme-$name" "$script"
            ok=""
            for i in $(seq 1 120); do
              now=$(cat "$D"/data/logs/* 2>/dev/null | grep -c "dev script: connected" || true)
              [ "${now:-0}" -gt "${seen:-0}" ] && { ok=1; break; }
              sleep 1
            done
            if [ "$name" = terminal ]; then
              for i in $(seq 1 90); do cat "$D"/data/logs/* 2>/dev/null | grep -q "dev script: terminal" && break; sleep 1; done
              # Opened, or failed (the open's own bound is 15 s).
              for i in $(seq 1 40); do cat "$D"/data/logs/* 2>/dev/null | grep -qE "terminal: (opened|error)" && break; sleep 1; done
            fi
            if [ "$name" = attach ]; then
              # Captured while the large one uploads: the failed chip and the uploading one over the grid.
              for i in $(seq 1 60); do cat "$D"/data/logs/* 2>/dev/null | grep -q "dev script: attach uploading" && break; sleep 1; done
              client/macos/scripts/capture-windows.sh "Mewla Dev" "$D/captures/$theme-attach-uploading" "$theme-attach-uploading-" || true
              for i in $(seq 1 120); do cat "$D"/data/logs/* 2>/dev/null | grep -q "dev script: attach done" && break; sleep 1; done
            fi
            if [[ "$name" == grant* ]]; then
              # A Worker needs Chrome (the runner has Screen recording and Accessibility granted, and no Chrome extension): the card in Brain's thread, asked until pressed.
              # Not now seals it; Open System Settings is not pressed here (for Chrome it would set up Chrome's native host on the runner).
              "$D/Mewla Dev.app/Contents/Helpers/mewla" agent-use need chrome --reason "A Worker needs your Chrome to check the release." --state-dir "$D/state" --json || true
              for i in $(seq 1 60); do [ "$(cat "$D"/data/logs/* 2>/dev/null | grep -cE 'dev script: grant (card|stopped)')" -gt "$gseen" ] && break; sleep 1; done
              [ "$name" = grant ] || for i in $(seq 1 40); do [ "$(cat "$D"/data/logs/* 2>/dev/null | grep -cE 'dev script: grant (pressed|press failed)')" -gt "$gpressed" ] && break; sleep 1; done
            fi
            if [ "$name" = minimize ]; then
              for i in $(seq 1 30); do cat "$D"/data/logs/* 2>/dev/null | grep -q "dev script: minimized" && break; sleep 1; done
              sleep 4
              osascript -e 'tell application "System Events" to get name of every UI element of list 1 of process "Dock"' || true
            fi
            sleep 8
            client/macos/scripts/capture-windows.sh "Mewla Dev" "$D/captures/$theme-$name" "$theme-$name-" || true
            # The menu bar here (a runner's, nobody's screen): who owns the status item windows, and the strip itself.
            swift -e 'import CoreGraphics; let l = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]; for w in l where (w[kCGWindowLayer as String] as? Int) == 25 { print("layer25", w[kCGWindowOwnerName as String] ?? "", "|", w[kCGWindowName as String] ?? "", "|", w[kCGWindowBounds as String] ?? "") }' || true
            screencapture -x -R 0,0,1024,32 "$D/captures/$theme-$name-menubar.png" || true
            # Back before stop, which fails the step when anything outlives the app.
            if [ "$name" = noagent ]; then sudo mv /usr/local/bin/claude.aside /usr/local/bin/claude; fi
            stop
            test -n "$ok" || { echo "Mewla Dev did not join its daemon ($theme $name)"; cat "$D"/data/logs/* || true; exit 1; }
          done; done
          # Mewla Dev leaves the computer-wide setup to the installed Mewla: no Chrome native host, no cloud CLIs.
          grep -q "beside the installed Mewla" "$D/state/logs/app-daemon.log"
          grep -q "agent use: your Chrome: off" "$D/state/logs/app-daemon.log"
          if grep -E "agent use: your Chrome: (preparing|ready)" "$D/state/logs/app-daemon.log"; then exit 1; fi
          test ! -e "$D/state/cli" || { echo "Mewla Dev's daemon set up cloud CLIs:"; ls -la "$D/state/cli"; exit 1; }
          [ "$(shasum -a 256 "$chrome_hosts" 2>/dev/null || echo none)" = "$manifest_before" ] || { echo "Mewla Dev wrote Chrome's native host manifest"; exit 1; }
          echo "Mewla Dev left Chrome's native host and the cloud CLIs alone"
          # The permission card: asked in Brain's thread, Not now sealed it.
          cat "$D"/data/logs/* | grep "dev script: grant" || true
          grep -q 'dev script: grant card asked chrome' "$D"/data/logs/*
          grep -q 'dev script: grant pressed not_now: card declined' "$D"/data/logs/*
          # Minimized, the window kept the app in the Dock: after each "minimized" no "dock: shown false" until the next launch.
          cat "$D"/data/logs/* | awk '/dev script: minimized/ { on = 1; seen++ } /secrets:/ { on = 0 } on && /dock: shown false/ { print "the Dock icon went with the minimized window: " $0; bad = 1 } END { exit (bad || seen < 2) }'
          # Mewla Dev keeps its secrets in its scratch file, never the Keychain.
          grep -h "secrets:" "$D"/data/logs/* | sort -u
          grep -q "secrets: secure.json" "$D"/data/logs/*
          # Terminal attach: the small file reached this Mac's daemon (kept under a uuid name: found by its text).
          cat "$D"/data/logs/* | grep "dev script: attach" || true
          up=$(grep -rl "Mewla Dev's attach proof" "$D/state" 2>/dev/null | grep -c uploads || true)
          echo "attach: ${up:-0} proof files on the daemon"; test "${up:-0}" -ge 1
          # Its path went to the attached terminal (TerminalPane logs each path it types at the prompt).
          test "$(cat "$D"/data/logs/* | grep -c "terminal: typed an attachment's path")" -ge 1
          # Cancel took the large one off while it uploaded, in each appearance when the upload was still going. On a fast or a
          # busy runner the 1 GB one is up before the hold ends or the app is busy with it ("cancel missed", runs 44902429699 and
          # 44905216175): at least one pass cancelled it, and Retry is reported (it is proven by call, and by the headless test).
          test "$(cat "$D"/data/logs/* | grep -c "dev script: attach cancelled (gone)")" -ge 1
          echo "attach: $(cat "$D"/data/logs/* | grep -c "dev script: attach retried") retries, $(cat "$D"/data/logs/* | grep -c "dev script: attach cancel missed") cancels missed"
          cat "$D"/data/logs/*
          # What the daemon said about the terminals the app opened.
          grep -iE "terminal|attach" "$D/state/logs/app-daemon.log" | tail -40 || true
          echo "--- the daemon's log, last 120 lines"; tail -120 "$D/state/logs/app-daemon.log" || true
          if grep -E "ERROR (js|nsh)" "$D"/data/logs/*; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-macos-captures-${{ github.sha }}
          path: ${{ runner.temp }}/dev-run/captures
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mewla-macos-${{ github.sha }}
          path: ${{ runner.temp }}/app/*.zip
          if-no-files-found: error
          retention-days: 7
      # The release's disk image (client/macos/release.sh), signed ad hoc until the Developer ID certificate exists:
      # it opens, holds the app and /Applications, and the app in it verifies (hardened runtime).
      - name: The .dmg the release makes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/release"
          ditto "$RUNNER_TEMP/app/Mewla.app" "$RUNNER_TEMP/release/Mewla.app"
          client/macos/release.sh --app "$RUNNER_TEMP/release/Mewla.app" --identity - --out "$RUNNER_TEMP/dmg"
          dmg=$(ls "$RUNNER_TEMP"/dmg/Mewla-*-macos-arm64.dmg)
          hdiutil verify "$dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')
          ls -la "$mount"
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$mount/Mewla.app"
          codesign -dv "$mount/Mewla.app" 2>&1 | grep -E "flags=.*runtime"
          hdiutil detach "$mount"
      # `mewla://` links reach the release (owner issue 11-23: it claimed no scheme, and the app heard only the phone
      # hosts' links): LaunchServices names the bundle for the scheme, and a pairing link asks to pair, opened while the
      # app runs and as the link that launches it. Last in the job: the release registers its own daemon and login item.
      - name: Mewla opens mewla:// links, while it runs and from a cold start
        run: |
          set -uo pipefail
          L="$RUNNER_TEMP/links"; mkdir -p "$L"
          ditto -x -k "$RUNNER_TEMP/app/Mewla-"[0-9]*-macos-aarch64.zip "$L"
          swiftc -O -o "$L/check" client/macos/scripts/check-pair-window.swift
          failed=0
          echo "claims: $(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$L/Mewla.app/Contents/Info.plist" 2>&1)"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$L/Mewla.app"
          handler=$(swift -e 'import AppKit; print(NSWorkspace.shared.urlForApplication(toOpen: URL(string: "mewla://settings")!)?.path ?? "none")')
          echo "mewla:// opens with: $handler"
          # The job unpacked the same app before ($RUNNER_TEMP/app): either copy is Mewla, by its bundle id.
          [ "$handler" != none ] && [ "$(plutil -extract CFBundleIdentifier raw "$handler/Contents/Info.plist")" = "$(plutil -extract CFBundleIdentifier raw "$L/Mewla.app/Contents/Info.plist")" ] || failed=1
          # A pairing link to an address nothing answers at: the confirmation comes before anything is sent.
          link="mewla://settings?u=http%3A%2F%2F127.0.0.1%3A9&k=$(printf 'b%.0s' $(seq 64))&t=$(printf 'c%.0s' $(seq 64))&n=Lab"
          asked() {
            for i in $(seq 1 30); do
              rm -rf "$L/captures/$1"; client/macos/scripts/capture-windows.sh Mewla "$L/captures/$1" "$1-" >/dev/null 2>&1 || true
              for png in "$L/captures/$1"/*.png; do
                [ -f "$png" ] && "$L/check" "$png" confirm && { echo "$1: the link asked to pair (try $i)"; return 0; }
              done
              sleep 2
            done
            echo "$1: the link never reached the app"; return 1
          }
          open "$L/Mewla.app"; sleep 20
          open "$link" || echo "open: no app for mewla://"
          asked running || failed=1
          pkill -x Mewla || true
          for i in $(seq 1 20); do pgrep -x Mewla >/dev/null || break; sleep 1; done
          open "$link" || echo "open: no app for mewla://"
          asked cold || failed=1
          pkill -x Mewla || true
          if [ "$failed" != 0 ]; then
            cat "$L"/captures/*/windows.txt 2>/dev/null || true
            find "$HOME/Library/Logs" "$HOME/Library/Application Support/com.daoleno.mewla" -name '*.log' 2>/dev/null | while read -r f; do echo "--- $f"; tail -40 "$f"; done
          fi
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-macos-link-captures-${{ github.sha }}
          path: ${{ runner.temp }}/links/captures
          if-no-files-found: ignore
          retention-days: 7
      # Mewla Dev alone, for a proof on a Mac beside an installed Mewla.
      - uses: actions/upload-artifact@v4
        with:
          name: mewla-dev-macos-${{ github.sha }}
          path: ${{ runner.temp }}/app/Mewla-Dev-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Taking over today's install on a clean Mac (FACTS.md §3): the released daemon with install.sh and
  # mewla boot install, a paired device, then Mewla installed and opened. One daemon, the app's LaunchAgent, with
  # the same identity and the same device; the old job, plist and bundle gone; mewla on PATH is the app's; the
  # daemon keeps running when the app quits.
  takeover:
    name: Mewla takes over a boot-installed daemon
    needs: app
    if: ${{ !cancelled() && (needs.app.result == 'success' || inputs.takeover_run != '') }}
    permissions:
      contents: read
      actions: read
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { old: v0.4.21, mode: --across-takeover }
          - { old: v0.4.22, mode: --across-takeover }
          - { old: v0.4.22, mode: --rollback }
          - { old: v0.4.22, mode: --reopen }
          - { old: v0.4.22, mode: --external }
    env:
      MEWLA_VERSION: ${{ matrix.old }}
      TAKEOVER_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        if: ${{ !startsWith(inputs.takeover_run, 'tag:') }}
        with:
          name: ${{ inputs.takeover_run && format('mewla-macos-proof-a-{0}', inputs.takeover_run) || format('mewla-macos-{0}', github.sha) }}
          path: ${{ runner.temp }}/zips
          github-token: ${{ github.token }}
          run-id: ${{ inputs.takeover_run || github.run_id }}
      - name: Public disk image and previous stable CLI version
        if: startsWith(inputs.takeover_run, 'tag:')
        env:
          SOURCE: ${{ inputs.takeover_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${SOURCE#tag:}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$tag" --pattern Mewla-macos-arm64.dmg --dir "$RUNNER_TEMP"
      - name: Today's install (install.sh, mewla boot install) with a paired device
        run: |
          set -euo pipefail
          MEWLA_INSTALL_DIR="$HOME/.local/bin" MEWLA_NO_PATH_UPDATE=1 sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          mewla --version
          if [[ "$TAKEOVER_MODE" == --external ]]; then
          python3 - <<'PYPLIST'
          import os, plistlib
          root = os.environ['RUNNER_TEMP']
          with open(root + '/external.plist', 'wb') as f:
              plistlib.dump(dict(Label='org.example.mewla', RunAtLoad=True, ProgramArguments=[os.path.expanduser('~/.local/bin/mewla'),'serve'], EnvironmentVariables={'MEWLA_NO_AUTOUPDATE':'1'}), f)
          PYPLIST
          launchctl bootstrap "gui/$(id -u)" "$RUNNER_TEMP/external.plist"
          else
            mewla boot install
          fi
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9876/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:9876/health > "$RUNNER_TEMP/health-before.json"
          jq -r '"Installed CLI daemon: " + .version' "$RUNNER_TEMP/health-before.json"
          label=com.daoleno.mewla.daemon
          if [[ "$TAKEOVER_MODE" == --external ]]; then label=org.example.mewla; fi
          launchctl print "gui/$(id -u)/$label" | grep -E "program|state"
      - name: Install and open Mewla
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/zips/Mewla-macos-arm64.dmg" ]]; then
            cp "$RUNNER_TEMP/zips/Mewla-macos-arm64.dmg" "$RUNNER_TEMP/"
          fi
          if [[ -f "$RUNNER_TEMP/Mewla-macos-arm64.dmg" ]]; then
            hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/image" "$RUNNER_TEMP/Mewla-macos-arm64.dmg"
            ditto "$RUNNER_TEMP/image/Mewla.app" /Applications/Mewla.app
            hdiutil detach "$RUNNER_TEMP/image"
          else
            ditto -x -k "$RUNNER_TEMP/zips/Mewla-"[0-9]*-macos-aarch64.zip /Applications
          fi
          link=$("$HOME/.local/bin/mewla" pair -details http://127.0.0.1:9876 2>&1 | grep -o 'mewla://settings?p=[A-Za-z0-9_-]*' | head -1)
          if ! (cd client && bun macos/scripts/pair-proof.ts "$link" "$TAKEOVER_MODE"); then
            launchctl print "gui/$(id -u)/com.daoleno.mewla.installed-daemon" 2>/dev/null | grep -E 'program (identifier|=)|path =|state =|last exit code|pid =' || true
            curl -fsS --max-time 2 http://127.0.0.1:9876/health | jq '{status,version}' || true
            /usr/bin/log show --last 5m --style compact --predicate 'process == "launchd" AND eventMessage CONTAINS "com.daoleno.mewla.daemon" AND (eventMessage CONTAINS "resolve" OR eventMessage CONTAINS "spawn" OR eventMessage CONTAINS "exited")' | tail -25 || true
            exit 1
          fi
          if [[ "$TAKEOVER_MODE" != --across-takeover ]]; then exit 0; fi
          launchctl print "gui/$(id -u)/com.daoleno.mewla.installed-daemon" | grep -E "program|state|pid"
          # A daemon that did not come up: why launchd could not spawn it (the job, launchd's own log, its BTM entry).
          if ! curl -fsS http://127.0.0.1:9876/health >/dev/null 2>&1; then
            launchctl print "gui/$(id -u)/com.daoleno.mewla.installed-daemon" || true
            log show --last 5m --style compact --predicate 'process == "launchd" AND eventMessage CONTAINS "com.daoleno.mewla"' | tail -60 || true
            log show --last 5m --style compact --predicate 'eventMessage CONTAINS "Contents/Helpers/mewla" OR eventMessage CONTAINS "com.daoleno.mewla.daemon"' | grep -iv "launchd" | tail -40 || true
            sudo sfltool dumpbtm 2>/dev/null | grep -B4 -A12 "com.daoleno.mewla" | head -60 || true
            codesign -dv --verbose=2 /Applications/Mewla.app/Contents/Helpers/mewla 2>&1 | head -12 || true
            tail -30 "$HOME/.mewla/logs/launchd.log" 2>/dev/null || true
          fi
      - name: One daemon, the app's, with the same identity and device
        if: matrix.mode == '--across-takeover'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          curl -fsS http://127.0.0.1:9876/health > "$RUNNER_TEMP/health-after.json"
          python3 -I -c 'import json,sys; a,b=(json.load(open(p)) for p in sys.argv[1:3]); assert a["daemon_id"]==b["daemon_id"], (a,b); print("same daemon_id", a["daemon_id"])' "$RUNNER_TEMP/health-before.json" "$RUNNER_TEMP/health-after.json"
          test ! -e "$HOME/Library/LaunchAgents/com.daoleno.mewla.daemon.plist"
          test ! -e "$HOME/Applications/Mewla.app"
          ls -l "$HOME/.local/bin/mewla"
          [[ "$(readlink "$HOME/.local/bin/mewla")" == "/Applications/Mewla.app/Contents/Helpers/mewla" ]]
          mewla devices list | tee "$RUNNER_TEMP/devices-after.txt"
          pgrep -fl "mewla.*serve|Helpers/mewla" || true
          [[ $(pgrep -f "/Applications/Mewla.app/Contents/Helpers/mewla serve" | wc -l) -eq 1 ]]
          if pgrep -f "$HOME/Applications/Mewla.app" >/dev/null; then echo "the old daemon still runs"; exit 1; fi
          out=$(mewla update 2>&1 || true); echo "$out"; grep -q "Mewla for Mac" <<<"$out"
      - name: The daemon keeps running when the app quits
        if: matrix.mode == '--across-takeover'
        run: |
          set -euo pipefail
          before=$(launchctl print "gui/$(id -u)/com.daoleno.mewla.installed-daemon" | awk '/^\tpid = / {print $3}')
          # Quit as the menu does; AppKit may answer the Apple event before the app has finished quitting.
          osascript -e 'quit app "Mewla"' || true
          for i in $(seq 1 30); do pgrep -f "/Applications/Mewla.app/Contents/MacOS/Mewla" >/dev/null || break; sleep 1; done
          if pgrep -f "/Applications/Mewla.app/Contents/MacOS/Mewla" >/dev/null; then echo "the app did not quit"; exit 1; fi
          after=$(launchctl print "gui/$(id -u)/com.daoleno.mewla.installed-daemon" | awk '/^\tpid = / {print $3}')
          echo "daemon pid before $before, after $after"
          test -n "$before" && test "$before" = "$after"
          curl -fsS http://127.0.0.1:9876/health
      - name: What the app, launchd and Background Task Management said
        if: always()
        run: |
          find "$HOME/Library" -path '*com.daoleno.mewla*' -name '*.log*' 2>/dev/null | while read -r f; do echo "== $f"; tail -60 "$f"; done
          log show --last 15m --style compact --predicate 'process == "Mewla" OR process == "smd" OR subsystem == "com.apple.backgroundtaskmanagement" OR (process == "launchd" AND eventMessage CONTAINS "mewla")' 2>/dev/null | tail -120
          sudo sfltool dumpbtm 2>/dev/null | grep -i -B2 -A14 mewla | head -80
          launchctl print "gui/$(id -u)" 2>/dev/null | grep -i mewla || true


  # The app's own update on a clean Mac (client/macos/package.sh, NSH's updater): Mewla at one version is installed and
  # paired, its daemon a LaunchAgent; a signed latest.json served on loopback offers the next version; the running app
  # finds it, shows its row in Settings, takes it, and restarts as the new app; its daemon, older than the app now, is
  # restarted onto it (`mewla restart -if-older`). The identity, the paired device and Sessions' daemon stay one.
  # The release's key and source are the real ones; here a throwaway key and a loopback URL stand in for them.
  update:
    name: Mewla updates itself, and its daemon with it
    if: ${{ !inputs.takeover_run }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: oven-sh/setup-bun@v2
      - name: Zig, the terminal engine and the web VT from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: darwin_arm64
          web: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/macos/target
          key: macos-app-v1-${{ hashFiles('client/macos/Cargo.toml', 'client/macos/Cargo.lock') }}
          restore-keys: macos-app-v1-
      - name: Two versions of the app, a signed manifest for the newer
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          set -euo pipefail
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/darwin_arm64"
          old=$(python3 scripts/lib/release_identity.py version)
          new=$(python3 -I -c 'import sys; a,b,c=sys.argv[1].split("."); print(f"{a}.{b}.{int(c)+1}")' "$old")
          echo "old=$old" >> "$GITHUB_ENV"; echo "new=$new" >> "$GITHUB_ENV"
          # The daemon is built at each version: the older app's daemon is the one the update leaves running.
          MEWLA_VERSION=$old ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/daemon-old" --targets darwin-arm64 --web-ui build
          MEWLA_VERSION=$new ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/daemon-new" --targets darwin-arm64 --web-ui build
          "$RUNNER_TEMP/daemon-old/mewla-darwin-arm64" --version; "$RUNNER_TEMP/daemon-new/mewla-darwin-arm64" --version
          # A throwaway key; the manifest is signed with it, and the app that checks trusts only its public half.
          mkdir -p "$RUNNER_TEMP/proof-key"; chmod 700 "$RUNNER_TEMP/proof-key"
          "$HOME/.nsh/bin/nsh" keygen "$RUNNER_TEMP/proof-key/update" >/dev/null
          pub=$(cat "$RUNNER_TEMP/proof-key/update.pub")
          url=http://127.0.0.1:8765/latest.json
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon-old/mewla-darwin-arm64" --out "$RUNNER_TEMP/old" --updater-url "$url" --updater-key "$pub"
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon-new/mewla-darwin-arm64" --out "$RUNNER_TEMP/new" --version "$new" --updater-url "$url" --updater-key "$pub"
          # What `nsh update-manifest` reads the id and version from; the archive is the new app's zip.
          mkdir -p "$RUNNER_TEMP/entry" "$RUNNER_TEMP/serve"
          python3 -I -c 'import json,sys; json.dump({"id":"com.daoleno.mewla","version":sys.argv[1],"updater":{"url":sys.argv[2],"publicKey":sys.argv[3]}}, open(sys.argv[4],"w"))' "$new" "$url" "$pub" "$RUNNER_TEMP/entry/nsh.json"
          cp "$RUNNER_TEMP/new/Mewla-$new-macos-aarch64.zip" "$RUNNER_TEMP/serve/"
          "$HOME/.nsh/bin/nsh" update-manifest --entry "$RUNNER_TEMP/entry" --key "$RUNNER_TEMP/proof-key/update.secret" --out "$RUNNER_TEMP/serve" "$RUNNER_TEMP/serve/Mewla-$new-macos-aarch64.zip"
          cat "$RUNNER_TEMP/serve/latest.json"
          rm -f "$RUNNER_TEMP/proof-key/update.secret"
      - name: The old Mewla, installed and paired
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/old/Mewla-$old-macos-aarch64.zip" /Applications
          mkdir -p "$RUNNER_TEMP/data"
          # The manifest the app checks is served on loopback for the whole run.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" > "$RUNNER_TEMP/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          # The app as a program of its own, so its environment (the log directory) is its own; it registers the daemon.
          MEWLA_APP_DATA_DIR="$RUNNER_TEMP/data" /Applications/Mewla.app/Contents/MacOS/Mewla > "$RUNNER_TEMP/app-old.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          for i in $(seq 1 200); do
            launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" 2>/dev/null | grep -q "program identifier = Contents/Helpers/mewla" \
              && curl -fsS http://127.0.0.1:9876/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9876/health > "$RUNNER_TEMP/health-before.json"
          jq -r '"Installed CLI daemon: " + .version' "$RUNNER_TEMP/health-before.json"
          python3 -I -c 'import json,sys; v=json.load(open(sys.argv[1]))["version"]; assert v==sys.argv[2], (v, sys.argv[2])' "$RUNNER_TEMP/health-before.json" "$old"
          cli=/Applications/Mewla.app/Contents/Helpers/mewla
          link=$("$cli" pair -details http://127.0.0.1:9876 2>&1 | grep -o 'mewla://settings?p=[A-Za-z0-9_-]*' | head -1)
          (cd client && bun macos/scripts/pair-proof.ts "$link")
          "$cli" devices list | tee "$RUNNER_TEMP/devices-before.txt"
          launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | awk '/^\tpid = / {print $3}' | tee "$RUNNER_TEMP/daemon-pid-before.txt"
          test -s "$RUNNER_TEMP/daemon-pid-before.txt"
          # The release's first run starts at login by default (the app's log says what the system answered).
          for i in $(seq 1 30); do grep -q "start at login" "$RUNNER_TEMP"/data/logs/* 2>/dev/null && break; sleep 1; done
          grep -h "start at login" "$RUNNER_TEMP"/data/logs/* || echo "start at login: no line in the app's log"
          # The app quits; its daemon, the LaunchAgent's, goes on.
          kill -TERM "$(cat "$RUNNER_TEMP/app.pid")"
          for i in $(seq 1 30); do kill -0 "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || break; sleep 1; done
      - name: The app finds the newer one, shows its row, takes it, and restarts
        run: |
          set -euo pipefail
          script='{"settings":"general","update":true}'
          MEWLA_APP_DATA_DIR="$RUNNER_TEMP/data" MEWLA_APP_DEV_SCRIPT="$script" /Applications/Mewla.app/Contents/MacOS/Mewla > "$RUNNER_TEMP/app-update.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          for i in $(seq 1 120); do cat "$RUNNER_TEMP"/data/logs/* 2>/dev/null | grep -q "dev script: update found" && break; sleep 1; done
          cat "$RUNNER_TEMP"/data/logs/* | grep "dev script: update" || true
          grep -q "dev script: update found $new" "$RUNNER_TEMP"/data/logs/*
          sleep 4
          client/macos/scripts/capture-windows.sh "Mewla" "$RUNNER_TEMP/captures/update-found" "update-found-" || true
          # The app quits, the new one starts: its bundle says the new version, and it is a process of its own.
          for i in $(seq 1 180); do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Mewla.app/Contents/Info.plist 2>/dev/null || true)
            # The bundle is swapped as the old app exits: the new app is a process that is not the old one.
            others=$(pgrep -f "/Applications/Mewla.app/Contents/MacOS/Mewla" | grep -v -x "$(cat "$RUNNER_TEMP/app.pid")" || true)
            if [ "$v" = "$new" ] && [ -n "$others" ]; then break; fi
            sleep 1
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Mewla.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Mewla.app/Contents/Info.plist)" = "$new"
          pgrep -fl "/Applications/Mewla.app/Contents/MacOS/Mewla"
          codesign --verify --deep --strict /Applications/Mewla.app
          "/Applications/Mewla.app/Contents/Helpers/mewla" --version
          sleep 12
          client/macos/scripts/capture-windows.sh "Mewla" "$RUNNER_TEMP/captures/update-done" "update-done-" || true
      - name: Its daemon is the new one, with the same identity, device and nothing left over
        run: |
          set -euo pipefail
          cli=/Applications/Mewla.app/Contents/Helpers/mewla
          # The new app restarts the daemon the update left running (the old version) onto its own.
          for i in $(seq 1 240); do
            v=$(curl -fsS http://127.0.0.1:9876/health 2>/dev/null | python3 -I -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)
            [ "$v" = "$new" ] && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9876/health > "$RUNNER_TEMP/health-after.json"
          python3 -I -c 'import json,sys; a,b=(json.load(open(p)) for p in sys.argv[1:3]); assert a["daemon_id"]==b["daemon_id"], (a,b); assert b["version"]==sys.argv[3], b; print("same daemon_id", a["daemon_id"], "now", b["version"])' "$RUNNER_TEMP/health-before.json" "$RUNNER_TEMP/health-after.json" "$new"
          "$cli" devices list | tee "$RUNNER_TEMP/devices-after.txt"
          # The paired device is still there (the app that ran since has paired itself too, so after has more).
          while read -r id _; do grep -q "^$id" "$RUNNER_TEMP/devices-after.txt" || { echo "device $id is gone"; exit 1; }; done < "$RUNNER_TEMP/devices-before.txt"
          # One daemon, the LaunchAgent's (the old one restarted in place keeps its pid; a new one has a new pid).
          [[ $(pgrep -f "mewla serve" | wc -l) -eq 1 ]] || { pgrep -fl "mewla serve"; exit 1; }
          echo "daemon pid before: $(cat "$RUNNER_TEMP/daemon-pid-before.txt"), after: $(launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | awk '/^\tpid = / {print $3}')"
          launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | grep -E "program|state|pid"
          # What the updater leaves beside the app while it works is gone.
          ls -la /Applications | grep -i -E "mewla|nsh" || true
          test "$(ls -A /Applications | grep -c -i 'nsh-updater')" -eq 0
          # The updated app claims mewla:// links (the whole bundle came with the update, its Info.plist too).
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw /Applications/Mewla.app/Contents/Info.plist)" = mewla
          echo "the updated Mewla claims mewla://"
      - name: What the app and its daemon said
        if: always()
        run: |
          cat "$RUNNER_TEMP"/data/logs/* 2>/dev/null | tail -80 || true
          tail -60 "$RUNNER_TEMP/app-update.out" || true
          grep -h "restart" "$HOME"/.mewla/logs/*.log 2>/dev/null | tail -20 || true
          if [ -f "$RUNNER_TEMP/serve.pid" ]; then kill "$(cat "$RUNNER_TEMP/serve.pid")" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-macos-update-captures-${{ github.sha }}
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
          retention-days: 7

  # Whether the release's App Store Connect key (the Individual key the iOS release uses) can notarize: a read-only
  # `notarytool history`. Nothing is submitted or created. The Developer ID certificate is the owner's to add.
  notary:
    name: The release's Apple key reaches the notary service
    if: ${{ !inputs.takeover_run }}
    runs-on: macos-26
    # Where the iOS release's App Store Connect key lives.
    environment: app-store-connect-preview
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: notarytool history (read only)
        env:
          KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_BASE64" | base64 -d > "$key"
          chmod 600 "$key"
          xcrun notarytool --version
          if xcrun notarytool history --key "$key" --key-id "$KEY_ID" --output-format json > "$RUNNER_TEMP/history.json" 2> "$RUNNER_TEMP/history.err"; then
            echo "notary access: yes, $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("history", [])))' "$RUNNER_TEMP/history.json") past submissions"
            status=0
          else
            echo "notary access: no"
            head -c 600 "$RUNNER_TEMP/history.err"
            status=1
          fi
          rm -f "$key"
          security find-identity -v -p codesigning | tail -1
          exit $status
