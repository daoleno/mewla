name: Mewla for Mac

# Builds Mewla for Mac (client/macos/package.sh): the AppKit host, client/ui and the darwin daemon in one bundle,
# signed ad hoc. Mewla Dev (--dev) for a dispatch that asks for it or a push to a mac-app/ branch, which the
# skeleton's proof on a Mac installs beside Mewla. Developer ID signing, notarization and the .dmg come with the
# release job.

on:
  workflow_dispatch:
    inputs:
      dev:
        description: "Mewla Dev (com.daoleno.mewla.dev), which installs beside Mewla"
        type: boolean
        default: true
  push:
    branches: ["mac-app/**"]

permissions:
  contents: read

jobs:
  app:
    name: Build Mewla for Mac
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The pinned Zig, the darwin terminal engine and the browser terminal's VT, from main's caches.
      - name: Zig, the terminal engine and the web VT from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: darwin_arm64
          web: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      # NSH 0.6 needs Rust 1.97 or later.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/macos/target
          key: macos-app-v1-${{ hashFiles('client/macos/Cargo.toml', 'client/macos/Cargo.lock') }}
          restore-keys: macos-app-v1-
      - name: Build the daemon
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/darwin_arm64"
          ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/daemon" --targets darwin-arm64 --web-ui build
          "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --version
      # Mewla (com.daoleno.mewla, its daemon a LaunchAgent) and Mewla Dev (beside it, its daemon its child).
      - name: Package the app
        run: |
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --out "$RUNNER_TEMP/app"
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --out "$RUNNER_TEMP/app" --dev
      - name: The bundles carry their daemon and CLI
        run: |
          set -euo pipefail
          plutil -lint "$RUNNER_TEMP/app/Mewla.app/Contents/Library/LaunchAgents/com.daoleno.mewla.daemon.plist"
          test ! -e "$RUNNER_TEMP/app/Mewla Dev.app/Contents/Library"
          for app in "$RUNNER_TEMP/app/Mewla.app" "$RUNNER_TEMP/app/Mewla Dev.app"; do
          "$app/Contents/Helpers/mewla" --version
          help=$("$app/Contents/Helpers/mewla" pair --help 2>&1 || true)
          grep -q -- '-json' <<<"$help"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature"
          test -f "$app/Contents/Resources/nsh/bundle.nshc"
          done
      # Mewla Dev runs here (its own state and port; in the foreground, so it has its menu bar item): its bundle loads,
      # it joins its daemon, opens the perch and Pair a phone, then Settings and the shortcut offer; the windows are
      # captured (no agent here, so Brain does not start). A JS error in the app's log fails the step.
      # A stand-in claude (no agent on a runner): Brain's host starts, so Ready, the thread and its terminal show.
      - name: A stub agent for the smoke run
        run: |
          sudo install -m 755 client/macos/scripts/stub-claude.sh /usr/local/bin/claude
          claude --version
      - name: Mewla Dev runs and shows its windows
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/dev-run"; mkdir -p "$D/data"
          chrome_hosts="$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.mewla.browser.json"
          manifest_before=$(shasum -a 256 "$chrome_hosts" 2>/dev/null || echo none)
          printf '%s' '{"mewla:theme_preference":"classic-light"}' > "$D/data/storage.json"
          ditto -x -k "$RUNNER_TEMP/app/Mewla-Dev-"*-macos-arm64.zip "$D"
          start() {
            env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL=/bin/bash LANG=en_US.UTF-8 TMPDIR="$TMPDIR" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              MEWLA_APP_STATE_ROOT="$D/state" MEWLA_APP_DATA_DIR="$D/data" MEWLA_APP_ADDR=127.0.0.1:19877 \
              MEWLA_APP_PHONE_ADDRESS=http://127.0.0.1:19877 \
              MEWLA_APP_DEV_SCRIPT="$2" \
              "$D/Mewla Dev.app/Contents/MacOS/Mewla Dev" > "$D/app-$1.out" 2>&1 &
            echo $! > "$D/app.pid"
          }
          # A SIGTERM skips the app's own stop of its daemon: the daemon sees its parent gone (MEWLA_EXIT_WITH_PARENT)
          # and stops by itself, its session host and Sessions with it; anything still running after 120 s fails the step.
          stop() {
            kill -TERM "$(cat "$D/app.pid")"
            for i in $(seq 1 120); do pgrep -f "$D" >/dev/null || { echo "everything stopped $i s after the app"; return 0; }; sleep 1; done
            echo "the daemon outlived the app:"; pgrep -fl "$D" || true
            tail -40 "$D/state/logs/app-daemon.log" || true
            pkill -TERM -f "$D" || true
            return 1
          }
          # Three runs per appearance, one surface group each (a window that takes the focus closes the perch):
          # the perch and Pair a phone; Settings › General and the shortcut offer; Settings › Privacy & access; Brain's
          # host's terminal (the web terminal in a web view, its page from the app's own daemon).
          # No agent on this Mac (m-noagent): the stub claude moved aside for that run, so Brain has no agent.
          scripts=('main={"perch":true,"pairPhone":true}' 'general={"settings":"general","shortcutOffer":true}' 'access={"settings":"access"}' 'terminal={"terminal":true}' 'noagent={}')
          for theme in light dark; do for entry in "${scripts[@]}"; do
            name="${entry%%=*}"; script="${entry#*=}"
            python3 -I -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["mewla:theme_preference"]="classic-"+sys.argv[2]; json.dump(d,open(p,"w"))' "$D/data/storage.json" "$theme"
            seen=$(cat "$D"/data/logs/* 2>/dev/null | grep -c "dev script: connected" || true)
            if [ "$name" = noagent ]; then sudo mv /usr/local/bin/claude /usr/local/bin/claude.aside; fi
            start "$theme-$name" "$script"
            ok=""
            for i in $(seq 1 120); do
              now=$(cat "$D"/data/logs/* 2>/dev/null | grep -c "dev script: connected" || true)
              [ "${now:-0}" -gt "${seen:-0}" ] && { ok=1; break; }
              sleep 1
            done
            if [ "$name" = terminal ]; then
              for i in $(seq 1 90); do cat "$D"/data/logs/* 2>/dev/null | grep -q "dev script: terminal" && break; sleep 1; done
              # Opened, or failed (the open's own bound is 15 s).
              for i in $(seq 1 40); do cat "$D"/data/logs/* 2>/dev/null | grep -qE "terminal: (opened|error)" && break; sleep 1; done
            fi
            sleep 8
            client/macos/scripts/capture-windows.sh "Mewla Dev" "$D/captures/$theme-$name" "$theme-$name-" || true
            # The menu bar here (a runner's, nobody's screen): who owns the status item windows, and the strip itself.
            swift -e 'import CoreGraphics; let l = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]; for w in l where (w[kCGWindowLayer as String] as? Int) == 25 { print("layer25", w[kCGWindowOwnerName as String] ?? "", "|", w[kCGWindowName as String] ?? "", "|", w[kCGWindowBounds as String] ?? "") }' || true
            screencapture -x -R 0,0,1024,32 "$D/captures/$theme-$name-menubar.png" || true
            # Back before stop, which fails the step when anything outlives the app.
            if [ "$name" = noagent ]; then sudo mv /usr/local/bin/claude.aside /usr/local/bin/claude; fi
            stop
            test -n "$ok" || { echo "Mewla Dev did not join its daemon ($theme $name)"; cat "$D"/data/logs/* || true; exit 1; }
          done; done
          # Mewla Dev leaves the computer-wide setup to the installed Mewla: no Chrome native host, no cloud CLIs.
          grep -q "beside the installed Mewla" "$D/state/logs/app-daemon.log"
          grep -q "agent use: your Chrome: off" "$D/state/logs/app-daemon.log"
          if grep -E "agent use: your Chrome: (preparing|ready)" "$D/state/logs/app-daemon.log"; then exit 1; fi
          test ! -e "$D/state/cli" || { echo "Mewla Dev's daemon set up cloud CLIs:"; ls -la "$D/state/cli"; exit 1; }
          [ "$(shasum -a 256 "$chrome_hosts" 2>/dev/null || echo none)" = "$manifest_before" ] || { echo "Mewla Dev wrote Chrome's native host manifest"; exit 1; }
          echo "Mewla Dev left Chrome's native host and the cloud CLIs alone"
          cat "$D"/data/logs/*
          # What the daemon said about the terminals the app opened.
          grep -iE "terminal|attach" "$D/state/logs/app-daemon.log" | tail -40 || true
          echo "--- the daemon's log, last 120 lines"; tail -120 "$D/state/logs/app-daemon.log" || true
          if grep -E "ERROR (js|nsh)" "$D"/data/logs/*; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-macos-captures-${{ github.sha }}
          path: ${{ runner.temp }}/dev-run/captures
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mewla-macos-${{ github.sha }}
          path: ${{ runner.temp }}/app/*.zip
          if-no-files-found: error
          retention-days: 7
      # The release's disk image (client/macos/release.sh), signed ad hoc until the Developer ID certificate exists:
      # it opens, holds the app and /Applications, and the app in it verifies (hardened runtime).
      - name: The .dmg the release makes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dmg" "$RUNNER_TEMP/release"
          ditto "$RUNNER_TEMP/app/Mewla.app" "$RUNNER_TEMP/release/Mewla.app"
          client/macos/release.sh --app "$RUNNER_TEMP/release/Mewla.app" --identity - --out "$RUNNER_TEMP/dmg"
          dmg=$(ls "$RUNNER_TEMP"/dmg/Mewla-*-macos-arm64.dmg)
          hdiutil verify "$dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')
          ls -la "$mount"
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$mount/Mewla.app"
          codesign -dv "$mount/Mewla.app" 2>&1 | grep -E "flags=.*runtime"
          hdiutil detach "$mount"
      # Mewla Dev alone, for a proof on a Mac beside an installed Mewla.
      - uses: actions/upload-artifact@v4
        with:
          name: mewla-dev-macos-${{ github.sha }}
          path: ${{ runner.temp }}/app/Mewla-Dev-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Taking over today's install on a clean Mac (FACTS.md §3): the released daemon with install.sh and
  # mewla boot install, a paired device, then Mewla installed and opened. One daemon, the app's LaunchAgent, with
  # the same identity and the same device; the old job, plist and bundle gone; mewla on PATH is the app's; the
  # daemon keeps running when the app quits.
  takeover:
    name: Mewla takes over a boot-installed daemon
    needs: app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: mewla-macos-${{ github.sha }}
          path: ${{ runner.temp }}/zips
      - name: Today's install (install.sh, mewla boot install) with a paired device
        run: |
          set -euo pipefail
          MEWLA_INSTALL_DIR="$HOME/.local/bin" MEWLA_NO_PATH_UPDATE=1 sh install.sh
          export PATH="$HOME/.local/bin:$PATH"
          mewla --version
          mewla boot install
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9876/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:9876/health | tee "$RUNNER_TEMP/health-before.json"
          link=$(mewla pair -details http://127.0.0.1:9876 2>&1 | grep -o 'mewla://settings?p=[A-Za-z0-9_-]*' | head -1)
          (cd client && bun macos/scripts/pair-proof.ts "$link")
          mewla devices list | tee "$RUNNER_TEMP/devices-before.txt"
          launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | grep -E "program|state"
      - name: Install and open Mewla
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/zips/Mewla-"[0-9]*-macos-arm64.zip /Applications
          open -g /Applications/Mewla.app
          for i in $(seq 1 200); do
            launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" 2>/dev/null | grep -q "program identifier = Contents/Helpers/mewla" \
              && curl -fsS http://127.0.0.1:9876/health >/dev/null 2>&1 && break
            sleep 1
          done
          launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | grep -E "program|state|pid"
          # A daemon that did not come up: why launchd could not spawn it (the job, launchd's own log, its BTM entry).
          if ! curl -fsS http://127.0.0.1:9876/health >/dev/null 2>&1; then
            launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" || true
            log show --last 5m --style compact --predicate 'process == "launchd" AND eventMessage CONTAINS "com.daoleno.mewla"' | tail -60 || true
            log show --last 5m --style compact --predicate 'eventMessage CONTAINS "Contents/Helpers/mewla" OR eventMessage CONTAINS "com.daoleno.mewla.daemon"' | grep -iv "launchd" | tail -40 || true
            sudo sfltool dumpbtm 2>/dev/null | grep -B4 -A12 "com.daoleno.mewla" | head -60 || true
            codesign -dv --verbose=2 /Applications/Mewla.app/Contents/Helpers/mewla 2>&1 | head -12 || true
            tail -30 "$HOME/.mewla/logs/launchd.log" 2>/dev/null || true
          fi
      - name: One daemon, the app's, with the same identity and device
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          curl -fsS http://127.0.0.1:9876/health | tee "$RUNNER_TEMP/health-after.json"
          python3 -I -c 'import json,sys; a,b=(json.load(open(p)) for p in sys.argv[1:3]); assert a["daemon_id"]==b["daemon_id"], (a,b); print("same daemon_id", a["daemon_id"])' "$RUNNER_TEMP/health-before.json" "$RUNNER_TEMP/health-after.json"
          test ! -e "$HOME/Library/LaunchAgents/com.daoleno.mewla.daemon.plist"
          test ! -e "$HOME/Applications/Mewla.app"
          ls -l "$HOME/.local/bin/mewla"
          [[ "$(readlink "$HOME/.local/bin/mewla")" == "/Applications/Mewla.app/Contents/Helpers/mewla" ]]
          mewla devices list | tee "$RUNNER_TEMP/devices-after.txt"
          diff <(cut -f1 "$RUNNER_TEMP/devices-before.txt") <(cut -f1 "$RUNNER_TEMP/devices-after.txt")
          pgrep -fl "mewla.*serve|Helpers/mewla" || true
          [[ $(pgrep -f "/Applications/Mewla.app/Contents/Helpers/mewla serve" | wc -l) -eq 1 ]]
          if pgrep -f "$HOME/Applications/Mewla.app" >/dev/null; then echo "the old daemon still runs"; exit 1; fi
          out=$(mewla update 2>&1 || true); echo "$out"; grep -q "Mewla for Mac" <<<"$out"
      - name: The daemon keeps running when the app quits
        run: |
          set -euo pipefail
          before=$(launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | awk '/^\tpid = / {print $3}')
          # Quit as the menu does; AppKit may answer the Apple event before the app has finished quitting.
          osascript -e 'quit app "Mewla"' || true
          for i in $(seq 1 30); do pgrep -f "/Applications/Mewla.app/Contents/MacOS/Mewla" >/dev/null || break; sleep 1; done
          if pgrep -f "/Applications/Mewla.app/Contents/MacOS/Mewla" >/dev/null; then echo "the app did not quit"; exit 1; fi
          after=$(launchctl print "gui/$(id -u)/com.daoleno.mewla.daemon" | awk '/^\tpid = / {print $3}')
          echo "daemon pid before $before, after $after"
          test -n "$before" && test "$before" = "$after"
          curl -fsS http://127.0.0.1:9876/health
      - name: What the app, launchd and Background Task Management said
        if: always()
        run: |
          find "$HOME/Library" -path '*com.daoleno.mewla*' -name '*.log*' 2>/dev/null | while read -r f; do echo "== $f"; tail -60 "$f"; done
          log show --last 15m --style compact --predicate 'process == "Mewla" OR process == "smd" OR subsystem == "com.apple.backgroundtaskmanagement" OR (process == "launchd" AND eventMessage CONTAINS "mewla")' 2>/dev/null | tail -120
          sudo sfltool dumpbtm 2>/dev/null | grep -i -B2 -A14 mewla | head -80
          launchctl print "gui/$(id -u)" 2>/dev/null | grep -i mewla


  # Whether the release's App Store Connect key (the Individual key the iOS release uses) can notarize: a read-only
  # `notarytool history`. Nothing is submitted or created. The Developer ID certificate is the owner's to add.
  notary:
    name: The release's Apple key reaches the notary service
    runs-on: macos-26
    # Where the iOS release's App Store Connect key lives.
    environment: app-store-connect-preview
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: notarytool history (read only)
        env:
          KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_BASE64" | base64 -d > "$key"
          chmod 600 "$key"
          xcrun notarytool --version
          if xcrun notarytool history --key "$key" --key-id "$KEY_ID" --output-format json > "$RUNNER_TEMP/history.json" 2> "$RUNNER_TEMP/history.err"; then
            echo "notary access: yes, $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("history", [])))' "$RUNNER_TEMP/history.json") past submissions"
            status=0
          else
            echo "notary access: no"
            head -c 600 "$RUNNER_TEMP/history.err"
            status=1
          fi
          rm -f "$key"
          security find-identity -v -p codesigning | tail -1
          exit $status
