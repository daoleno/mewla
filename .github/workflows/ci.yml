name: CI

# The test track. Every push to main and every PR runs the checks: the daemon (Linux, macOS,
# Windows), the session host's terminal engine, the NSH client's core and UI, the web UI the
# daemons embed, the native terminal contract and the release scripts. A release never runs them
# again: it ships a main commit this workflow passed (scripts/release-green.py,
# docs/ci-release.md). The client's native hosts are built by client.yml, and signed by
# release-artifacts.yml and ios-release.yml.
on:
  push:
    branches: [main]
    # A change to these alone runs no checks; a release treats such commits as covered by the
    # last green run before them (scripts/release-green.py reads this list).
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

# A run on main always finishes: a release needs a green run on its commit, and one cancelled by
# the next push left none. A PR's run is cancelled by its next push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  installer:
    name: Installer (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Test secure bootstrap installer
        run: bun run installer:test

  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # Screen's pushed video encodes with the computer's ffmpeg on Linux; without it its tests skip.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify public publisher build configuration
        working-directory: .
        run: python3 scripts/test-plugin-publisher-flags.py

  # The session host's terminal engine (build tag ghosttyvt, libghostty-vt linked) under -race, beside
  # the daemon job rather than after it: it took 1.5 of that job's 5 min (11-16).
  daemon-engine:
    name: Daemon (session host terminal engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # A Session's plain `tmux` must reach the daemon's private server, never the person's own.
      - name: Install tmux
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Session host terminal engine libraries
        uses: ./.github/actions/ghostty-desktop
      - name: Session host terminal engine (libghostty-vt linked)
        run: ./scripts/test-ghosttyvt.sh -race

  # The daemon as it runs on a Mac: every package built for darwin and its tests, which include the
  # Mac's own code (screen, agent display, keychain, Live Activity). Tests that need a person's
  # screen, permissions or apps skip themselves unless asked for (MEWLA_ACCEPT and the like).
  daemon-macos:
    name: Daemon (Go, macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # A short temporary directory on its real path: tests put Unix sockets in t.TempDir(), whose
      # paths under the Mac's /var/folders TMPDIR pass its 104-byte socket limit, and /tmp is a
      # symlink that tests comparing resolved paths see through. Linux runners have /tmp.
      - name: Test
        run: |
          dir="$(mktemp -d /private/tmp/mg.XXXXXX)"
          trap 'rm -rf "$dir"' EXIT
          TMPDIR="$dir" go test ./...
      - name: Vet
        run: go vet ./...

  client:
    name: Client (NSH core and typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # Restore only: client.yml's runs on main save it.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: Core tests
        run: bun test core
        working-directory: client
      - name: Typecheck
        run: ${NSH_HOME:-$HOME/.nsh}/bin/nsh check
        working-directory: client/ui
      - name: Open-source licenses are current
        run: python3 client/ui/more/settings/licenses/generate.py --check
      # noVNC and Pele (root package.json), which the Screen viewer and the diagrams bundle.
      - name: Install the Screen viewer's noVNC and Pele
        run: bun install --frozen-lockfile
      - name: Screen viewer bundle is current
        run: bun client/ui/more/screen/runtime/generate.mjs --check
      - name: Pele (diagrams) is current
        run: bun client/core/mermaid/vendor-pele.mjs --check

  # The UI suite (`nsh test` in client/ui) on four runners: in one process it took 14 min on 11-14,
  # mostly tests waiting on the clock. Each shard runs its files with `nsh test <file>`; together
  # they run every test file once (client/scripts/ui-test-shard.py, scripts/tests/test_ui_test_shard.py).
  client-ui:
    name: Client UI tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # Restore only: client.yml's runs on main save it.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: UI tests
        run: python3 client/scripts/ui-test-shard.py --shard ${{ matrix.shard }}/4

  # The web UI the daemons embed, built as a release builds it (release-artifacts.yml's web-ui
  # job): NSH's web package, the splash, the browser terminal and the check that the page loads
  # every file from the site's root. bf8e1fd4d moved NSH to 0.6.0, whose page has no <base> and
  # no inline styles; build-web-ui.sh then failed on every dev daemon while this workflow was green.
  web-ui:
    name: Web UI build (the daemons' embedded client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The pinned Zig and the WebAssembly VT main's native-cache.yml built; build-web-ui.sh uses the
      # VT only if its manifest matches the lock and the packer sources, and builds it otherwise.
      - uses: ./.github/actions/desktop-release-cache
        with:
          web: "true"
      # Restore only: client.yml's runs on main save it.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Build the web UI
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: ./scripts/build-web-ui.sh

  windows:
    name: Windows (daemon build, platform tests, install.ps1)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build every package
        run: go build ./...
      - name: Vet the Windows platform layer
        run: go vet ./platform ./control ./sqlitedb ./selfupdate ./launchsh ./sessionhost ./hostdeps
      - name: Test the Windows platform layer
        run: go test -count=1 ./platform ./control ./sqlitedb ./selfupdate ./launchsh ./hostdeps
      - name: Test finding Codex conversations on Windows
        run: go test -count=1 -run 'TestCodexWorkspace|TestCodexRecordedCWDs|TestQueryCodexThreadsUsesMinimalSourceSchema|TestIdleCodexPolls|TestCodexSelectionIsRevisited|TestCodexResumedInAnotherFolder' ./work
      - name: Test a Codex Brain's chat binding on Windows
        run: go test -count=1 -run '^TestCodexBrainBindsItsConversationFromCodexsRecords$' ./brain
      - name: Test a Codex launch waiting for its app-server on Windows
        run: go test -count=1 -run 'TestAWrappedCodexLaunch|TestPrepareLaunchWaitsForTheAppServer|TestWaitMain' ./agentevents/codex
      - name: Build mewla.exe
        run: go build -o "$env:RUNNER_TEMP\mewla.exe" ./cmd/mewla
      - name: Test install.ps1 offline (Windows PowerShell 5.1)
        working-directory: .
        shell: powershell
        run: .\scripts\tests\install_ps1_test.ps1 -Binary "$env:RUNNER_TEMP\mewla.exe"

  native-contract:
    name: Native terminal contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify lock/notice/scripts (no .so required)
        run: ./scripts/verify-libghostty.sh --contract

  release-identity:
    name: Release identity and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify package / version / versionCode sources
        run: ./scripts/verify-release-identity.sh
      - name: What's New notes are current
        run: python3 scripts/release-notes.py --check
      - name: Test release and verification scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          set -euo pipefail
          mkdir -p "$MEWLA_BUILD_TMPDIR"
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
