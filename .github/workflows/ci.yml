name: CI

# Every push and PR runs the fast checks: the daemon, the NSH client's core and
# UI, the native terminal contract and the release scripts. The daemon release
# build, which also builds the web UI the daemon embeds, runs on release tag
# pushes and manual dispatch. The client's native hosts are built by client.yml
# (pull requests), native-cache.yml (main) and, signed, by release-artifacts.yml
# and ios-release.yml (tags).
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  pull_request:
  workflow_dispatch:

# A push cancels the previous push's run, but not a manual dispatch: the
# native jobs of a dispatch take far longer than the gap between pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Test secure bootstrap installer
        run: bun run installer:test

  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Install runtime test prerequisites
        run: sudo apt-get update && sudo apt-get install -y tmux rsync
      - name: Test
        run: go test ./...
      - name: Session host terminal engine libraries
        uses: ./.github/actions/ghostty-desktop
      - name: Session host terminal engine (libghostty-vt linked)
        working-directory: .
        run: ./scripts/test-ghosttyvt.sh -race
      - name: Executable behavior contracts (scripted, not real AI)
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout 120s ./brain ./cmd/mewla ./watcher -run '^TestBDD_' | tee "$RUNNER_TEMP/mewla-bdd.jsonl"
      - name: Preserve behavior results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mewla-bdd-${{ github.sha }}
          path: ${{ runner.temp }}/mewla-bdd.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Vet
        run: go vet ./...
      - name: Verify public publisher build configuration
        working-directory: .
        run: python3 scripts/test-plugin-publisher-flags.py
      - name: Install NSH for the web UI
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        working-directory: .
        run: client/scripts/fetch-nsh.sh
      - name: Build release targets
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        working-directory: .
        run: ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/release-bin"

  client:
    name: Client (NSH core and UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      # Restore only: client.yml's runs on main save it.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: Core tests
        run: bun test core
        working-directory: client
      - name: Typecheck
        run: ~/.nsh/bin/nsh check
        working-directory: client/ui
      - name: UI tests
        run: ~/.nsh/bin/nsh test
        working-directory: client/ui
      - name: Open-source licenses are current
        run: python3 client/ui/more/settings/licenses/generate.py --check
      # noVNC (root package.json), which the Screen viewer bundles.
      - name: Install the Screen viewer's noVNC
        run: bun install --frozen-lockfile
      - name: Screen viewer bundle is current
        run: bun client/ui/more/screen/runtime/generate.mjs --check

  windows:
    name: Windows (daemon build, platform tests, install.ps1)
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build every package
        run: go build ./...
      - name: Vet the Windows platform layer
        run: go vet ./platform ./control ./sqlitedb ./selfupdate ./launchsh ./sessionhost
      - name: Test the Windows platform layer
        run: go test -count=1 ./platform ./control ./sqlitedb ./selfupdate ./launchsh
      - name: Build mewla.exe
        run: go build -o "$env:RUNNER_TEMP\mewla.exe" ./cmd/mewla
      - name: Test install.ps1 offline (Windows PowerShell 5.1)
        working-directory: .
        shell: powershell
        run: .\scripts\tests\install_ps1_test.ps1 -Binary "$env:RUNNER_TEMP\mewla.exe"

  native-contract:
    name: Native terminal contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lock/notice/scripts (no .so required)
        run: ./scripts/verify-libghostty.sh --contract

  release-identity:
    name: Release identity and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify package / version / versionCode sources
        run: ./scripts/verify-release-identity.sh
      - name: Test release and verification scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          set -euo pipefail
          mkdir -p "$MEWLA_BUILD_TMPDIR"
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
