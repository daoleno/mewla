name: CI

# Ordinary push/PR runs only fast checks. Native work (unsigned iOS Simulator
# build, Android native link, Android/iOS JS exports) runs on release tag pushes
# and manual dispatch; the release flow builds the signed artifacts in
# release-artifacts.yml and ios-release.yml.
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Test secure bootstrap installer
        run: bun run installer:test

  daemon:
    name: Daemon (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Install runtime test prerequisites
        run: sudo apt-get update && sudo apt-get install -y tmux rsync
      - name: Test
        run: go test ./...
      - name: Executable behavior contracts (scripted, not real AI)
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=1 -timeout 120s ./brain ./cmd/mewla ./watcher -run '^TestBDD_' | tee "$RUNNER_TEMP/mewla-bdd.jsonl"
      - name: Preserve behavior results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mewla-bdd-${{ github.sha }}
          path: ${{ runner.temp }}/mewla-bdd.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Vet
        run: go vet ./...
      - name: Verify public publisher build configuration
        working-directory: .
        run: python3 scripts/test-plugin-publisher-flags.py
      - uses: oven-sh/setup-bun@v2
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        with:
          bun-version: "1.3.5"
      - name: Install web UI build dependencies
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Build release targets
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        working-directory: .
        run: ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/release-bin"

  app:
    name: App (Bun / Expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
        working-directory: app
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: app
      - name: Android export
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: bunx expo export --platform android
        working-directory: app
      - name: iOS export
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: bunx expo export --platform ios
        working-directory: app
      - name: Web export
        run: bunx expo export --platform web
        working-directory: app

  ios-native:
    name: iOS native (unsigned Simulator)
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Require Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          command -v pod >/dev/null || {
            echo "error: CocoaPods is required on the macOS runner" >&2
            exit 1
          }
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify shared native contract
        run: ./scripts/verify-libghostty.sh --contract
      - name: Build and verify iOS Ghostty XCFramework
        env:
          MEWLA_GHOSTTY_CACHE: ${{ runner.temp }}/ghostty
          MEWLA_TOOL_CACHE: ${{ runner.temp }}/tools
        run: ./scripts/build-libghostty-ios.sh
      - name: Generate iOS project and install pods
        run: |
          set -euo pipefail
          cd app
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          ../../scripts/assert-ios-camera-barcode-pod.sh Podfile.lock
      - name: Build unsigned Simulator app
        env:
          DERIVED_DATA: ${{ runner.temp }}/ios-derived
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -workspace app/ios/Mewla.xcworkspace \
            -scheme Mewla \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          APP="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Mewla.app"
          ./scripts/verify-ios-artifact.sh simulator "$APP"
          echo "IOS_SIMULATOR_APP=$APP" >> "$GITHUB_ENV"
      - name: Upload unsigned Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: mewla-ios-simulator-${{ github.sha }}
          path: ${{ env.IOS_SIMULATOR_APP }}
          if-no-files-found: error
          retention-days: 7

  android-native:
    name: Android native (bounded link)
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify shared native contract
        run: ./scripts/verify-libghostty.sh --contract
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
      - name: Generate Android project
        run: |
          set -euo pipefail
          cd app
          bunx expo prebuild --platform android --clean --no-install
      - name: Compile Android native terminal module and app debug link
        env:
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          ./scripts/verify-terminal-abi-gradle.sh
          cd app/android
          ./gradlew \
            :terminal-vt:assembleDebug \
            :app:assembleDebug \
            :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pexpo.useLegacyPackaging=true \
            --build-cache \
            --console=plain
          NOTICE="app/src/main/assets/notices/GHOSTTY-MIT.txt"
          [[ -f "$NOTICE" ]] || {
            echo "error: prebuild did not package Ghostty MIT notice at $NOTICE" >&2
            exit 1
          }
          cd ../..
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          ./scripts/verify-apk-notice.sh "$APK"
          ./scripts/verify-android-native-symbols.py \
            --lock app/modules/terminal-vt/native.lock.json --apk "$APK"

  native-contract:
    name: Native terminal contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lock/notice/scripts (no .so required)
        run: ./scripts/verify-libghostty.sh --contract

  release-identity:
    name: Release identity and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify package / version / versionCode sources
        run: ./scripts/verify-release-identity.sh
      - name: Test release and verification scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          set -euo pipefail
          mkdir -p "$MEWLA_BUILD_TMPDIR"
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash scripts/tests/test_verify_mewla_orchestration.sh
