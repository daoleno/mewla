name: Client (NSH)

# The NSH client, which replaced the Expo app in one cutover release (client/README.md).
# A release gate, not a development step (user, 2026-11-12): it runs on a push to main that
# touches the client (the merge, which also saves the native caches ci.yml restores) and by
# hand, never on each push to a branch or PR. Before the cutover merge, run it once by hand on
# the final commit with the upgrade gate: `gh workflow run client.yml --ref <branch>`. Device
# rounds during development build locally. A run builds both hosts: the Android preview APK
# (com.daoleno.mewla.preview, an artifact to sideload; on dispatch signed with the release key so
# every Preview installs over the last one, client/scripts/preview-signer.sh) and the iOS
# Simulator app with its upgrade tests. The fast checks (core tests, nsh check,
# nsh test) run in ci.yml's client job. The upgrade gate runs on manual dispatch:
# the released Expo APK, then the release-signed NSH app installed over it.
on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
  workflow_dispatch:
    inputs:
      gate:
        description: "Run the Android upgrade gate (released Expo APK → release-signed NSH app)"
        type: boolean
        default: true
      old_version:
        description: "Expo release the gate upgrades from (a tag; v0.3.1 is the last Expo release, Latest is the NSH app since v0.4.0)"
        default: "v0.3.1"
      android_only:
        description: "Only the Android host: a Preview-signed APK to hand over (no iOS job)"
        type: boolean
        default: false

concurrency:
  group: client-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # The upgrade gate installs this Preview over the last dispatched run's (its artifact).
  actions: read

jobs:
  android:
    name: Android host (preview APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Java 17, the SDK and NDK, and the verified arm64 libghostty-vt the terminal links (cached on main).
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
      - uses: actions/cache@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      # A Preview is signed with the release key (another package id, the same key), so one Preview
      # upgrades the last in place and keeps its pairing; a runner's debug key changes every run.
      # Pull requests build it debug-signed and keep no APK.
      - name: Materialize the release keystore (temp, mode 0600)
        if: github.event_name == 'workflow_dispatch'
        env:
          MEWLA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
          MEWLA_ANDROID_KEYSTORE: ${{ runner.temp }}/mewla-release.p12
        run: ./scripts/materialize-android-keystore.sh > /dev/null
      - name: Build the preview APK (arm64; release key on dispatch)
        working-directory: client/android
        env:
          MEWLA_ANDROID_KEYSTORE: ${{ github.event_name == 'workflow_dispatch' && format('{0}/mewla-release.p12', runner.temp) || '' }}
          MEWLA_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ZEN_ANDROID_KEYSTORE_PASSWORD || '' }}
          MEWLA_ANDROID_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.ZEN_ANDROID_KEY_ALIAS || '' }}
          MEWLA_ANDROID_KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.ZEN_ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon --console=plain assemblePreviewRelease -Pmewla.abis=arm64-v8a
      - name: Every pet image the app names is in the APK
        run: python3 client/scripts/check-pet-assets.py android "$(ls client/android/app/build/outputs/apk/preview/release/*.apk | head -1)"
      - name: Shred the keystore
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          KS="${{ runner.temp }}/mewla-release.p12"
          [[ -f "$KS" ]] && { shred -u "$KS" 2>/dev/null || rm -f "$KS"; } || true
      - name: The Preview carries the release key
        if: github.event_name == 'workflow_dispatch'
        run: client/scripts/preview-signer.sh client/android/app/build/outputs/apk/preview/release/app-preview-release.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: mewla-preview-android
          path: client/android/app/build/outputs/apk/preview/release/*.apk
          retention-days: 14
      # What turns a captured trace back into names: R8's mapping (`retrace`) and the JS source map
      # (`nsh symbolicate`), kept beside the APK they belong to.
      - uses: actions/upload-artifact@v4
        with:
          name: mewla-preview-android-symbols
          path: |
            client/android/app/build/outputs/mapping/previewRelease/mapping.txt
            client/android/app/build/generated/assets/bundleUi.js.map
          retention-days: 90

  # One Simulator, booted while the job sets up and compiles: Xcode keeps a device it found booted
  # running after the tests, so the Release app opens on it without a second boot. Booting it twice
  # took about 6 of the job's 16 min (11-14). On two Macs side by side each paid for a cold build and
  # a boot on three cores, and the slower took 11 min.
  ios:
    name: iOS host (Simulator, upgrade tests)
    if: github.event_name != 'workflow_dispatch' || !inputs.android_only
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The verified libghostty-vt XCFramework the terminal links (native/terminal-vt/libs/ios, cached on main).
      - name: iOS Ghostty XCFramework
        uses: ./.github/actions/ios-native
      - uses: actions/cache@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Install NSH and the iOS framework
        run: client/scripts/fetch-nsh.sh --ios
      - name: Generate the Xcode project
        run: |
          brew install xcodegen > /dev/null
          client/scripts/ios-project.sh
      # A single-display iPhone: `simctl io screenshot` refuses a two-display one (iPhone Duo) without --display.
      # Booted now, so the minutes a Simulator takes to boot on the runner pass while Xcode compiles.
      - name: Pick a simulator and start booting it
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Duo' not in x['name']))")
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
      # Signed to run locally: the Keychain refuses an unsigned app.
      # TerminalTests saves the terminal it drew as out/terminal.png.
      - name: Unit tests (the Expo app's Keychain and AsyncStorage, the terminal)
        working-directory: client/ios
        env:
          TEST_RUNNER_MEWLA_TEST_OUT: ${{ github.workspace }}/client/ios/out
          # The render corpus TerminalTests draws into out/corpus (the Simulator reads the checkout).
          TEST_RUNNER_MEWLA_CORPUS: ${{ github.workspace }}/scripts/terminal-corpus
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild test -project Mewla.xcodeproj -scheme Mewla -destination "id=$SIM" -derivedDataPath build/dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tail -40
      - name: Open it on the Simulator
        working-directory: client/ios
        run: |
          set -x
          xcodebuild build -project Mewla.xcodeproj -scheme Mewla -configuration Release -destination "id=$SIM" -derivedDataPath build/dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tail -5
          APP=build/dd/Build/Products/Release-iphonesimulator/Mewla.app
          du -sh "$APP"
          python3 ../scripts/check-pet-assets.py ios "$APP"
          mkdir -p out
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$APP"
          xcrun simctl launch "$SIM" com.daoleno.mewla
          sleep 6
          xcrun simctl io "$SIM" screenshot out/first-run.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-ios-simulator
          path: client/ios/out
          retention-days: 14

  upgrade-gate:
    name: Android upgrade gate (Expo ${{ inputs.old_version || 'v0.3.1' }} → NSH; Preview → Preview)
    if: github.event_name == 'workflow_dispatch' && inputs.gate
    # Not `needs: android`: the gate sets up and builds its own app while that job builds the
    # Preview, and waits for the Preview just before it needs it (one after the other: 12 min, 11-14).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Java 17, the SDK and NDK, and the verified arm64 libghostty-vt the terminal links (cached on main).
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
      - uses: actions/cache@v4
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ hashFiles('client/scripts/fetch-nsh.sh') }}
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: The released Expo APK and daemon
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ inputs.old_version || 'v0.3.1' }}
        run: |
          set -euo pipefail
          # The gate upgrades from what users run: the latest release unless a tag is named.
          [[ "$OLD" == latest ]] && OLD=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "upgrading from $OLD"
          mkdir -p "$RUNNER_TEMP/old"
          gh release download "$OLD" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/old" \
            --pattern "mewla-android-arm64-$OLD.apk" --pattern mewla-linux-amd64.tar.gz --pattern SHA256SUMS
          cd "$RUNNER_TEMP/old"
          grep -E " (mewla-android-arm64-$OLD.apk|mewla-linux-amd64.tar.gz)$" SHA256SUMS | sha256sum -c -
          tar -xzf mewla-linux-amd64.tar.gz
          command -v tmux > /dev/null || sudo apt-get install -y -qq tmux
          echo "OLD_APK=$RUNNER_TEMP/old/mewla-android-arm64-$OLD.apk" >> "$GITHUB_ENV"
          echo "MEWLA=$(find "$RUNNER_TEMP/old" -name mewla -type f -perm -u+x | head -1)" >> "$GITHUB_ENV"
      - name: Materialize the release keystore (temp, mode 0600)
        env:
          MEWLA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
          MEWLA_ANDROID_KEYSTORE: ${{ runner.temp }}/mewla-release.p12
        run: ./scripts/materialize-android-keystore.sh > /dev/null
      - name: Build the release-signed NSH app
        working-directory: client/android
        env:
          MEWLA_ANDROID_KEYSTORE: ${{ runner.temp }}/mewla-release.p12
          MEWLA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZEN_ANDROID_KEYSTORE_PASSWORD }}
          MEWLA_ANDROID_KEY_ALIAS: ${{ secrets.ZEN_ANDROID_KEY_ALIAS }}
          MEWLA_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --console=plain assembleProductionRelease -Pmewla.abis=arm64-v8a
          echo "NEW_APK=$PWD/app/build/outputs/apk/production/release/app-production-release.apk" >> "$GITHUB_ENV"
      - name: Shred the keystore
        if: always()
        run: |
          KS="${{ runner.temp }}/mewla-release.p12"
          [[ -f "$KS" ]] && { shred -u "$KS" 2>/dev/null || rm -f "$KS"; } || true
      - name: Wait for this run's Preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          after_success=0
          for _ in $(seq 1 180); do
            if [[ -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=mewla-preview-android" --jq '.artifacts[0].id // empty')" ]]; then
              echo "this run's Preview is ready"
              exit 0
            fi
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "Android host (preview APK)") | "\(.status) \(.conclusion)"')"
            case "$state" in
              "completed success") after_success=$((after_success + 1)); [[ $after_success -lt 6 ]] || { echo "error: the Android host job succeeded but kept no Preview" >&2; exit 1; } ;;
              completed*) echo "error: the Android host job ended without a Preview ($state)" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "error: no Preview after 30 min" >&2
          exit 1
      - name: This Preview and the last dispatched one on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview/new" "$RUNNER_TEMP/preview/prev"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n mewla-preview-android -D "$RUNNER_TEMP/preview/new"
          echo "PREVIEW_APK=$(find "$RUNNER_TEMP/preview/new" -name '*.apk' | head -1)" >> "$GITHUB_ENV"
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow client.yml --branch "$BRANCH" --event workflow_dispatch \
            --status success --limit 20 --json databaseId --jq "[.[].databaseId | select(. != $GITHUB_RUN_ID)][0] // empty")
          if [[ -n "$prev" ]] && gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n mewla-preview-android -D "$RUNNER_TEMP/preview/prev"; then
            echo "previous Preview: run $prev"
            echo "PREV_APK=$(find "$RUNNER_TEMP/preview/prev" -name '*.apk' | head -1)" >> "$GITHUB_ENV"
          else
            echo "no previous Preview kept for $BRANCH"
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ runner.temp }}/gate
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            client/scripts/upgrade-gate.sh
            client/scripts/preview-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-gate-evidence
          path: ${{ runner.temp }}/gate
          retention-days: 30
