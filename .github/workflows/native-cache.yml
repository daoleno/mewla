name: Warm native build caches

# GitHub scopes a cache to the ref that saved it. A release tag can read main's
# caches, but nothing can read a tag's. This workflow is the only writer of the
# caches in .github/actions/android-native, .github/actions/ios-native and
# .github/actions/desktop-release-cache: it runs the same native builds
# (debug-signed or unsigned, no secrets) on main so the next tag starts warm.
on:
  push:
    branches: [main]
    paths:
      - native/terminal-vt/**
      - client/ui/more/settings/licenses/texts/Ghostty-MIT.txt
      - client/android/**/*.gradle.kts
      - client/android/gradle.properties
      - client/android/gradle/wrapper/gradle-wrapper.properties
      - client/android/app/CMakeLists.txt
      - client/android/app/src/main/cpp/**
      - scripts/android-release-apk.sh
      - scripts/build-libghostty.sh
      - scripts/lib/zig.sh
      - scripts/lib/ghostty_release.py
      - scripts/lib/minisign_verify.py
      - scripts/verify-libghostty.sh
      - scripts/verify-android-native-symbols.py
      - .github/actions/android-native/**
      - scripts/build-libghostty-ios.sh
      - scripts/verify-libghostty-ios.sh
      - scripts/zig-xcode-compat/**
      - scripts/lib/zig-xcode-compat.sh
      - scripts/check-zig-xcode-compat.sh
      - .github/actions/ios-native/**
      - scripts/build-libghostty-desktop.sh
      - scripts/build-libghostty-web.sh
      - scripts/build-daemon-linux.sh
      - client/native/terminal/TerminalVt.*
      - client/native/terminal/TerminalGlyphs.*
      - daemon/go.sum
      - .github/actions/desktop-release-cache/**
      - .github/workflows/native-cache.yml
  # Unused caches are evicted after 7 days.
  schedule:
    - cron: "17 4 */5 * *"
  workflow_dispatch:

concurrency:
  group: native-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android release build (debug-signed)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
        with:
          save-caches: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      # The NSH client's GitHub APK, as release-artifacts.yml builds it (no keystore).
      - name: Build the release APK with the release task graph
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: ./scripts/android-release-apk.sh
      - name: ccache statistics
        if: always()
        run: ccache --show-stats
      # Saved after this step: dependencies, the build cache and this Gradle's own jars only.
      - name: Prune the Gradle home before it is saved
        run: |
          set -euo pipefail
          current="$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' client/android/gradle/wrapper/gradle-wrapper.properties)"
          [[ -n "$current" ]]
          rm -rf ~/.gradle/caches/*/transforms
          for d in ~/.gradle/caches/[0-9]*; do [[ "$(basename "$d")" == "$current" ]] || rm -rf "$d"; done
          for d in ~/.gradle/wrapper/dists/gradle-*-bin; do [[ "$(basename "$d")" == "gradle-$current-bin" ]] || rm -rf "$d"; done
          du -sh ~/.gradle/caches ~/.gradle/wrapper

  zig-xcode-workaround:
    name: Zig/Xcode workaround is still needed
    if: github.ref == 'refs/heads/main'
    # Its own job on the iOS image, so a retired workaround turns this red
    # without stopping the iOS caches from being refreshed.
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the SDK
        # Fails, naming what to delete, once the Xcode on this runner no
        # longer needs the libSystem SDK clone (see the script).
        run: ./scripts/check-zig-xcode-compat.sh

  ios:
    name: iOS Ghostty XCFramework (unsigned)
    if: github.ref == 'refs/heads/main'
    # Same image as ios-release.yml and client.yml: the cache keys hash the
    # Xcode and SDK versions.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: iOS Ghostty cache
        uses: ./.github/actions/ios-native
        with:
          save-caches: "true"

  # What release-artifacts.yml's daemon builds restore: the pinned Zig, each target's libghostty-vt
  # and Go build cache. The daemon is built as a release builds it, against a stand-in web UI (the
  # Go packages compile the same; only the embedded files differ).
  desktop:
    name: Release daemon inputs (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, lib: linux_amd64_musl }
          - { target: linux-arm64, lib: linux_arm64_musl }
          - { target: windows-amd64, lib: windows_amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          # Its own Go cache only (below): CI's entry is CI's.
          cache: false
      - name: Zig, the terminal engine and the Go cache
        uses: ./.github/actions/desktop-release-cache
        with:
          save-caches: "true"
          lib: ${{ matrix.lib }}
          go-target: ${{ matrix.target }}
      - name: A stand-in web UI
        run: |
          set -euo pipefail
          mkdir -p daemon/webui/dist/terminal
          printf '%s\n' '<link rel="stylesheet" href="/stand-in.css">' '<script type="application/json" id="nsh-app">{"base":"/"}</script>' | gzip -9 -n > daemon/webui/dist/index.html.gz
          printf 'stand-in' | gzip -9 -n > daemon/webui/dist/terminal/mewla-vt.wasm.gz
      - name: Build the daemon as a release does
        env:
          MEWLA_VERSION: 0.0.0-cache
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/${{ matrix.lib }}"
          ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/bin" --targets "${{ matrix.target }}" --web-ui prebuilt

  web:
    name: Browser terminal VT (WebAssembly)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Zig and the browser terminal's VT
        uses: ./.github/actions/desktop-release-cache
        with:
          save-caches: "true"
          web: "true"
      - name: Build the WebAssembly VT as build-web-ui.sh does
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: ./scripts/build-libghostty-web.sh

  darwin:
    name: Release macOS terminal engine
    if: github.ref == 'refs/heads/main'
    # The image release-artifacts.yml's daemon-darwin job builds on.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Zig and the terminal engine
        uses: ./.github/actions/desktop-release-cache
        with:
          save-caches: "true"
          lib: darwin_arm64
      - name: Build libghostty-vt for darwin_arm64 as a release does
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: ./scripts/build-libghostty-desktop.sh --out "$HOME/.cache/mewla/ghostty-release/darwin_arm64" --targets darwin_arm64
