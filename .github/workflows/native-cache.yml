name: Warm native build caches

# GitHub scopes a cache to the ref that saved it. A release tag can read main's
# caches, but nothing can read a tag's. This workflow is the only writer of the
# caches in .github/actions/android-native and .github/actions/ios-native: it
# runs the same native builds (debug-signed or unsigned, no secrets) on main so
# the next tag starts warm.
on:
  push:
    branches: [main]
    paths:
      - native/terminal-vt/**
      - client/ui/more/settings/licenses/texts/Ghostty-MIT.txt
      - client/android/**/*.gradle.kts
      - client/android/gradle.properties
      - client/android/gradle/wrapper/gradle-wrapper.properties
      - client/android/app/CMakeLists.txt
      - client/android/app/src/main/cpp/**
      - scripts/android-release-apk.sh
      - scripts/build-libghostty.sh
      - scripts/lib/zig.sh
      - scripts/lib/ghostty_release.py
      - scripts/lib/minisign_verify.py
      - scripts/verify-libghostty.sh
      - scripts/verify-android-native-symbols.py
      - .github/actions/android-native/**
      - scripts/build-libghostty-ios.sh
      - scripts/verify-libghostty-ios.sh
      - scripts/zig-xcode-compat/**
      - scripts/lib/zig-xcode-compat.sh
      - scripts/check-zig-xcode-compat.sh
      - .github/actions/ios-native/**
      - .github/workflows/native-cache.yml
  # Unused caches are evicted after 7 days.
  schedule:
    - cron: "17 4 */5 * *"
  workflow_dispatch:

concurrency:
  group: native-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android release build (debug-signed)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
        with:
          save-caches: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      # The NSH client's GitHub APK, as release-artifacts.yml builds it (no keystore).
      - name: Build the release APK with the release task graph
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: ./scripts/android-release-apk.sh
      - name: ccache statistics
        if: always()
        run: ccache --show-stats

  zig-xcode-workaround:
    name: Zig/Xcode workaround is still needed
    if: github.ref == 'refs/heads/main'
    # Its own job on the iOS image, so a retired workaround turns this red
    # without stopping the iOS caches from being refreshed.
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the SDK
        # Fails, naming what to delete, once the Xcode on this runner no
        # longer needs the libSystem SDK clone (see the script).
        run: ./scripts/check-zig-xcode-compat.sh

  ios:
    name: iOS Ghostty XCFramework (unsigned)
    if: github.ref == 'refs/heads/main'
    # Same image as ios-release.yml and client.yml: the cache keys hash the
    # Xcode and SDK versions.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: iOS Ghostty cache
        uses: ./.github/actions/ios-native
        with:
          save-caches: "true"
