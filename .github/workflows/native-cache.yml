name: Warm native build caches

# GitHub scopes a cache to the ref that saved it. A release tag can read main's
# caches, but nothing can read a tag's. This workflow is the only writer of the
# Android caches in .github/actions/android-native: it runs the same release
# build (debug-signed, no secrets) on main so the next tag starts warm.
on:
  push:
    branches: [main]
    paths:
      - bun.lock
      - app/package.json
      - app/plugins/**
      - app/modules/terminal-vt/**
      - app/assets/notices/GHOSTTY-MIT.txt
      - scripts/android-release-apk.sh
      - scripts/build-libghostty.sh
      - scripts/lib/zig.sh
      - scripts/verify-libghostty.sh
      - scripts/verify-android-native-symbols.py
      - .github/actions/android-native/**
      - .github/workflows/native-cache.yml
  # Unused caches are evicted after 7 days.
  schedule:
    - cron: "17 4 */5 * *"
  workflow_dispatch:

concurrency:
  group: native-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android release build (debug-signed)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native
        with:
          save-caches: "true"
      - name: Build the release APK with the release task graph
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: ./scripts/android-release-apk.sh
