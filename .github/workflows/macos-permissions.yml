name: Mewla for Mac permissions

# Which process macOS charges for Screen Recording and Accessibility, and Mewla's permission flow walked through
# its states, on a CI Mac where the system TCC.db stands in for System Settings (client/macos/scripts/tcc-probe).
# A push to a mac-perm/ branch, or a dispatch.

on:
  workflow_dispatch:
  push:
    branches: ["mac-perm/**"]

permissions:
  contents: read

jobs:
  probe:
    name: Which identity TCC charges
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: client/macos/scripts/tcc-probe/run.sh "$RUNNER_TEMP/tcc-probe"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcc-probe-${{ github.sha }}
          path: ${{ runner.temp }}/tcc-probe

  walk:
    name: The permission flow, state by state
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Zig, the terminal engine and the web VT from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: darwin_arm64
          web: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/macos/target
          key: macos-app-v1-${{ hashFiles('client/macos/Cargo.toml', 'client/macos/Cargo.lock') }}
          restore-keys: macos-app-v1-
      - name: Build the daemon
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/darwin_arm64"
          ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/daemon" --targets darwin-arm64 --web-ui build
      - name: Package Mewla (the release's layout, signed ad hoc)
        run: client/macos/package.sh --daemon "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --out "$RUNNER_TEMP/app"
      - name: The host's tests (the panel's placement, its line)
        run: cargo test --release --manifest-path client/macos/Cargo.toml -- --nocapture
      - name: Walk the flow
        run: client/macos/scripts/permissions-walk.sh "$RUNNER_TEMP/app/Mewla.app" "$RUNNER_TEMP/walk"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permissions-walk-${{ github.sha }}
          path: ${{ runner.temp }}/walk
