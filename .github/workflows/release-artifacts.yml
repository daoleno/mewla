name: Release artifacts

# Secure release pipeline: Linux amd64/arm64, macOS arm64, Windows amd64, signed
# Android arm64 APK (the NSH client, client/android, GitHub channel).
#
# An annotated vX.Y.Z or vX.Y.Z-beta.N tag push is the normal release action. Manual
# dispatch can rebuild, and can recover publication only with explicit review.
#
# Candidate builds: a manual dispatch whose ref is a branch or commit, not a tag,
# with publish=false and a candidate_version, builds and verifies every artifact
# exactly as a release would, then stops. Nothing is signed with the updater key,
# staged or published; the build outputs are kept for a few days for testing.
#
# Daemon binaries carry the session host's terminal engine (build tag ghosttyvt,
# cgo): Linux and Windows are linked statically with zig cc on Ubuntu, macOS
# with Apple's toolchain on a Mac. Each binary is run on its own platform
# before staging. The engines, the WebAssembly VT, the pinned Zig and each
# target's Go build cache come from main's native-cache.yml when they match
# (.github/actions/desktop-release-cache); build jobs check out without history.
#
# The release track (docs/ci-release.md): build -> sign -> launch smoke of the exact artifact ->
# publish -> released check. It runs no test suite: validate checks in seconds that the tagged
# commit passed CI on main (scripts/release-green.py). Each daemon runs on its own platform from a
# fresh home and state with auto-update off and answers /health with this version (releasesmoke,
# release_smoke_windows.ps1); the signed APK installs, opens and keeps running on an emulator
# (android-launch). Once every one of them and the signing stage passed (release-ready), the
# complete signed set is published in one step, a stable tag as Latest, a beta tag as a prerelease,
# with notes written from the commits (scripts/release-body.py), and `released` checks the
# definition (scripts/released.py). A red or cancelled job publishes nothing; "Re-run failed jobs"
# reruns it and the jobs after it. The published release then dispatches ios-release.yml (Preview
# to TestFlight, submitted for beta review). Upgrades from the previous release are tested on
# main's schedule (upgrade.yml), not here.
# Jobs that hold a signing key never hold a write token, and the reverse.
#
# Secrets (GitHub Actions repository secrets only; never commit values). Each
# step maps them once into the MEWLA_* name that scripts read:
#   ZEN_ANDROID_KEYSTORE_BASE64      -> MEWLA_ANDROID_KEYSTORE_BASE64
#   ZEN_ANDROID_KEYSTORE_PASSWORD    -> MEWLA_ANDROID_KEYSTORE_PASSWORD
#   ZEN_ANDROID_KEY_ALIAS            -> MEWLA_ANDROID_KEY_ALIAS
#   ZEN_ANDROID_KEY_PASSWORD         -> MEWLA_ANDROID_KEY_PASSWORD
#   ZEN_UPDATE_SIGNING_KEY_BASE64    -> MEWLA_UPDATE_SIGNING_KEY_BASE64
#
# Docs: docs/ci-release.md

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact annotated vX.Y.Z or vX.Y.Z-beta.N tag to rebuild/recover"
        required: true
        type: string
      publish:
        description: "Reviewed recovery: publish/reconcile the matching release"
        required: true
        type: boolean
        default: false
      candidate_version:
        description: "Build-only candidate: X.Y.Z for a branch or commit ref (publish must be false)"
        required: false
        type: string
        default: ""

concurrency:
  group: release-artifacts-${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Stable non-secret product constants used in logs
  MEWLA_JAVA_VERSION: "17"

jobs:
  validate:
    name: Validate immutable reviewed tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # release-green.py reads main's CI runs.
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      # The release tag, or candidate-<sha> for a build-only candidate; it names artifacts.
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
      # release or candidate
      mode: ${{ steps.meta.outputs.mode }}
      # What every later job checks out: the tag, or the candidate's exact commit.
      checkout: ${{ steps.meta.outputs.checkout }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
          fetch-depth: 0

      - name: Require registered public GitHub and Slack publishers
        run: python3 scripts/plugin-publisher-flags.py --require github --require slack

      - name: Fetch and validate reviewed release identity
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
          CANDIDATE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$EVENT" == workflow_dispatch ]] && ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # Build-only candidate: never publishable, never signed.
            [[ "$PUBLISH" == false ]] || {
              echo "error: $RELEASE_TAG is not a tag; only a tag can be published" >&2
              exit 1
            }
            [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "error: a build-only candidate needs candidate_version X.Y.Z; got '$CANDIDATE_VERSION'" >&2
              exit 1
            }
            ./scripts/verify-release-identity.sh
            python3 - "$CANDIDATE_VERSION" "$(python3 scripts/lib/release_identity.py version)" <<'PY'
          import re, sys
          tracked = sys.argv[2]
          key = lambda v: tuple(int(x) for x in re.match(r"(\d+)\.(\d+)\.(\d+)", v).groups())
          if key(sys.argv[1]) <= key(tracked):
              sys.exit(f"error: candidate_version {sys.argv[1]} must be newer than the tracked {tracked}")
          PY
            SHA="$(git rev-parse HEAD)"
            {
              echo "version=$CANDIDATE_VERSION"
              echo "tag=candidate-${SHA:0:12}"
              echo "sha=$SHA"
              echo "publish=false"
              echo "mode=candidate"
              echo "checkout=$SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./scripts/verify-release-identity.sh --tag "$RELEASE_TAG"
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "checkout=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # The suites ran on main: the tag's commit is one CI passed, or the version change on top of
      # one (scripts/release-green.py). Seconds when that run is green; it waits only for a run on
      # main still going, and never runs a suite itself.
      - name: The tagged commit passed CI on main
        if: steps.meta.outputs.mode == 'release'
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-green.py --sha "$(git rev-parse HEAD)" --wait-minutes 15

  # The web UI every daemon embeds, built once per release. What the daemons and the web UI are made
  # from that changes only with the lock (the pinned Zig, libghostty-vt per target, the WebAssembly
  # VT) comes from the caches main's native-cache.yml saves, as the Android Ghostty library does:
  # each carries a manifest of the signed sources and lock it was built from, the build scripts use
  # it only when that matches and its sha256 holds, and a miss builds it here from the signed release.
  web-ui:
    name: Build the web UI the daemons embed
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}
      # The pinned Zig and the WebAssembly VT main's native-cache.yml built; build-web-ui.sh uses the
      # VT only if its manifest matches the lock and the packer sources, and builds it otherwise.
      - name: Zig and the browser terminal's VT from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          web: "true"
      - name: Install NSH for the web UI
        run: client/scripts/fetch-nsh.sh
      # The NSH web package and the browser terminal's VT (libghostty-vt for WebAssembly, built
      # fresh from the signed release with the pinned Zig), staged gzip-only in daemon/webui/dist.
      - name: Build the web UI
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: ./scripts/build-web-ui.sh
      - name: Upload the web UI for the daemon builds
        uses: actions/upload-artifact@v4
        with:
          name: daemon-part-web-ui-${{ needs.validate.outputs.tag }}
          path: daemon/webui/dist
          if-no-files-found: error
          # go:embed all:dist takes every file, dot files too.
          include-hidden-files: true
          retention-days: 1

  daemon-build:
    name: Build the ${{ matrix.target }} daemon
    needs: [validate, web-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: linux-amd64, lib: linux_amd64_musl, file: mewla-linux-amd64 }
          - { target: linux-arm64, lib: linux_arm64_musl, file: mewla-linux-arm64 }
          - { target: windows-amd64, lib: windows_amd64, file: mewla-windows-amd64.exe }
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # The pinned Zig, this target's libghostty-vt and its Go build cache, as main's native-cache.yml
      # left them. build-libghostty-desktop.sh keeps a restored engine only when its manifest matches
      # the lock and its sha256, and builds it from the signed release otherwise.
      - name: Zig, the terminal engine and the Go cache from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: ${{ matrix.lib }}
          go-target: ${{ matrix.target }}
      - name: Download this run's web UI
        uses: actions/download-artifact@v4
        with:
          name: daemon-part-web-ui-${{ needs.validate.outputs.tag }}
          path: daemon/webui/dist
      # Linux static with zig cc and musl, Windows static with zig cc and MinGW. The engine's
      # manifest must match native.lock.json and the library its sha256, or this builds it again.
      - name: Build daemon binaries once
        env:
          MEWLA_VERSION: ${{ needs.validate.outputs.version }}
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/${{ matrix.lib }}"
          ./scripts/build-daemon-linux.sh --out-dir "$GITHUB_WORKSPACE/dist-download/staging/bin" --targets "${{ matrix.target }}" --web-ui prebuilt
      - name: Verify daemon formats and architectures
        env:
          BIN: dist-download/staging/bin/${{ matrix.file }}
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux-amd64) file "$BIN" | grep -Eq 'ELF 64-bit.*(x86-64|x86_64).*statically linked' ;;
            linux-arm64) file "$BIN" | grep -Eq 'ELF 64-bit.*(ARM aarch64|ARM64).*statically linked' ;;
            windows-amd64) file "$BIN" | grep -Eq 'PE32\+ executable.*x86-64' ;;
            *) exit 1 ;;
          esac
          go version -m "$BIN" | grep -E '^[[:space:]]+build[[:space:]]+(-tags=|CGO_ENABLED=)'
          sha256sum "$BIN"
      - name: Run the amd64 binary (version, session host, shell, vi, attach, /health)
        if: matrix.target == 'linux-amd64'
        working-directory: daemon
        env:
          MEWLA_RELEASE_SMOKE_BINARY: ${{ github.workspace }}/dist-download/staging/bin/mewla-linux-amd64
          MEWLA_RELEASE_SMOKE_VERSION: ${{ needs.validate.outputs.version }}
        run: go test -count=1 -v ./releasesmoke/
      - name: Upload the verified binary
        uses: actions/upload-artifact@v4
        with:
          name: daemon-part-bin-${{ matrix.target }}-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 1

  # The artifact every later job, and anyone testing a candidate, downloads: the three binaries
  # under one name, as before the build was split.
  daemon:
    name: Build Linux and Windows daemons
    needs: [validate, daemon-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload verified daemon inputs
        uses: actions/upload-artifact/merge@v4
        with:
          name: mewla-daemon-binaries-linux-${{ needs.validate.outputs.tag }}
          pattern: daemon-part-bin-*-${{ needs.validate.outputs.tag }}
          retention-days: ${{ needs.validate.outputs.mode == 'candidate' && 5 || '' }}
      - name: Download the merged artifact
        uses: actions/download-artifact@v4
        with:
          name: mewla-daemon-binaries-linux-${{ needs.validate.outputs.tag }}
          path: bin
      - name: It holds exactly the three binaries
        run: |
          set -euo pipefail
          sha256sum bin/*
          [[ "$(cd bin && find . -type f | LC_ALL=C sort | tr '\n' ' ')" == "./mewla-linux-amd64 ./mewla-linux-arm64 ./mewla-windows-amd64.exe " ]]

  daemon-linux-arm64:
    name: Run the Linux arm64 daemon
    needs: [validate, daemon-build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          # No cache: main has none for this runner, and a tag's would be unreadable.
          cache: false
      - name: Download Linux daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: daemon-part-bin-linux-arm64-${{ needs.validate.outputs.tag }}
          path: bin
      - name: Run the arm64 binary (version, session host, shell, vi, attach, /health)
        working-directory: daemon
        env:
          MEWLA_RELEASE_SMOKE_BINARY: ${{ github.workspace }}/bin/mewla-linux-arm64
          MEWLA_RELEASE_SMOKE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          chmod +x "$MEWLA_RELEASE_SMOKE_BINARY"
          go test -count=1 -v ./releasesmoke/

  daemon-windows:
    name: Run the Windows daemon
    needs: [validate, daemon-build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}
      - name: Download daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: daemon-part-bin-windows-amd64-${{ needs.validate.outputs.tag }}
          path: bin
      # version, the session host with the engine, the daemon's /health, and
      # install.ps1 installing it from a release-shaped zip.
      - name: Run the Windows binary
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/tests/release_smoke_windows.ps1 -Binary bin/mewla-windows-amd64.exe -Version $env:VERSION

  daemon-darwin:
    name: Build and run the macOS daemon
    needs: [validate, web-ui]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # Apple's toolchain: the darwin engine is built on a Mac, by main's native-cache.yml.
      - name: Zig and the terminal engine from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: darwin_arm64
      # The same web UI as the Linux and Windows daemons: one build per release.
      - name: Download this run's web UI
        uses: actions/download-artifact@v4
        with:
          name: daemon-part-web-ui-${{ needs.validate.outputs.tag }}
          path: daemon/webui/dist
      - name: Build the macOS daemon
        env:
          MEWLA_VERSION: ${{ needs.validate.outputs.version }}
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/darwin_arm64"
          ./scripts/build-daemon-linux.sh --out-dir "$GITHUB_WORKSPACE/dist-download/staging/bin" --targets darwin-arm64 --web-ui prebuilt
      - name: Verify format, architecture and minimum macOS
        run: |
          set -euo pipefail
          BIN=dist-download/staging/bin/mewla-darwin-arm64
          file "$BIN" | grep -Eq 'Mach-O 64-bit.*arm64'
          go version -m "$BIN" | grep -E '^[[:space:]]+build[[:space:]]+(-tags=|CGO_ENABLED=)'
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION
          # Same floor as the earlier CGO_ENABLED=0 releases.
          [[ "$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="minos"{print $2; exit}')" == "12.0" ]]
          otool -L "$BIN"
      - name: Run the macOS binary (version, session host, shell, vi, attach, /health)
        working-directory: daemon
        env:
          MEWLA_RELEASE_SMOKE_BINARY: ${{ github.workspace }}/dist-download/staging/bin/mewla-darwin-arm64
          MEWLA_RELEASE_SMOKE_VERSION: ${{ needs.validate.outputs.version }}
        run: go test -count=1 -v ./releasesmoke/
      - name: Upload verified daemon inputs
        uses: actions/upload-artifact@v4
        with:
          name: mewla-daemon-binaries-darwin-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin/mewla-darwin-arm64
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.mode == 'candidate' && 5 || '' }}

  android:
    needs: validate
    name: Build and verify signed Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}

      # Restores only: release tags read the caches native-cache.yml saves on main.
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native

      # The pinned NSH release (checksums in the script): the CLI that bundles
      # client/ui and the nsh.aar runtime the APK links. Fetched, not cached.
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh

      - name: Materialize signing keystore (temp, mode 0600)
        id: keystore
        env:
          MEWLA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${MEWLA_ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "error: repository secret ZEN_ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          KS_PATH="${{ runner.temp }}/mewla-release.p12"
          export MEWLA_ANDROID_KEYSTORE="$KS_PATH"
          # Script prints only the path; never logs secret material
          OUT="$(./scripts/materialize-android-keystore.sh)"
          # Do not echo path if it could be sensitive; it is a runner temp path (ok).
          echo "keystore_path=${OUT}" >> "$GITHUB_OUTPUT"
          # sanity: file exists and is non-empty without printing contents
          test -s "$OUT"
          stat -c '%a %n' "$OUT"

      # The NSH client (client/android): production identity com.daoleno.mewla,
      # GitHub channel (Phone use, in-app update), arm64-v8a, versionCode from
      # client/ui/nsh.json by scripts/lib/release_identity.py.
      - name: Build signed Android arm64 release APK
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          MEWLA_ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore_path }}
          MEWLA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZEN_ANDROID_KEYSTORE_PASSWORD }}
          MEWLA_ANDROID_KEY_ALIAS: ${{ secrets.ZEN_ANDROID_KEY_ALIAS }}
          MEWLA_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          for v in MEWLA_ANDROID_KEYSTORE_PASSWORD MEWLA_ANDROID_KEY_ALIAS MEWLA_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "error: repository secret $v is not set" >&2
              exit 1
            fi
          done
          test -f "${MEWLA_ANDROID_KEYSTORE}"
          ./scripts/android-release-apk.sh
          # Locate APK produced under dist-download/android-native
          APK="$(ls -t dist-download/android-native/mewla-android-arm64-*.apk | head -1)"
          test -f "$APK"
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify signed APK (package, ABI, notice, certificate)
        run: |
          set -euo pipefail
          ./scripts/verify-apk-release.sh "${APK_PATH}"

      - name: Shred temporary keystore
        if: always()
        run: |
          set -euo pipefail
          KS="${{ steps.keystore.outputs.keystore_path }}"
          if [[ -n "${KS}" && -f "${KS}" ]]; then
            shred -u "${KS}" 2>/dev/null || rm -f "${KS}"
          fi
          # Ensure env materialization helpers leave no base64 on disk from this step
          rm -f "${{ runner.temp }}/mewla-release.p12" || true

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mewla-android-apk-${{ needs.validate.outputs.tag }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.mode == 'candidate' && 5 || '' }}

      # What turns a captured trace back into names: R8's mapping (`retrace`) and the JS source map
      # (`nsh symbolicate`), kept beside the APK they belong to.
      - name: Upload symbols (R8 mapping, JS source map)
        uses: actions/upload-artifact@v4
        with:
          name: mewla-android-symbols-${{ needs.validate.outputs.tag }}
          path: |
            client/android/app/build/outputs/mapping/productionRelease/mapping.txt
            client/android/app/build/generated/assets/bundleUi.js.map
          if-no-files-found: error
          retention-days: ${{ needs.validate.outputs.mode == 'candidate' && 5 || 90 }}

  # The launch smoke of the exact signed APK: on a fresh emulator it installs, reports the release's
  # version, opens and keeps running with nothing in the crash log (client/scripts/release-launch.sh).
  # The emulator boots while the APK builds. The upgrade from the previous release runs on main's
  # schedule (upgrade.yml), where a failure is a bug to fix, not a held release.
  android-launch:
    name: Launch the signed APK on Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.checkout }}
      - name: The version the APK reports
        env:
          MODE: ${{ needs.validate.outputs.mode }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # A candidate's APK carries main's tracked version; its daemons carry candidate_version.
          [[ "$MODE" == release ]] || VERSION="$(python3 scripts/lib/release_identity.py version)"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The exact signed APK: installed, opened, its scanner run (release-launch.sh); then paired to the release's own
      # Linux daemon and the phone lane's flows replayed on it (release-flows.sh).
      - name: Boot, wait for the APK, install, launch it and replay the flows
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: mewla-android-apk-${{ needs.validate.outputs.tag }}
          BUILD_JOB: Build and verify signed Android
          DAEMON_ARTIFACT: mewla-daemon-binaries-linux-${{ needs.validate.outputs.tag }}
          DAEMON_JOB: Build Linux and Windows daemons
          VERSION: ${{ env.APK_VERSION }}
          OUT: ${{ runner.temp }}/launch
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            client/scripts/release-launch.sh
            client/scripts/release-flows.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-android-launch-${{ needs.validate.outputs.tag }}
          path: ${{ runner.temp }}/launch
          retention-days: 30

  stage:
    name: Stage, sign, and verify the release
    needs: [validate, daemon, daemon-linux-arm64, daemon-windows, daemon-darwin, android]
    if: needs.validate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate tag before signing
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download daemon binaries
        uses: actions/download-artifact@v4
        with:
          pattern: mewla-daemon-binaries-*-${{ needs.validate.outputs.tag }}
          merge-multiple: true
          path: dist-download/staging/bin
      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: mewla-android-apk-${{ needs.validate.outputs.tag }}
          path: inputs/android
      - name: Deterministically stage, sign, and verify
        env:
          MEWLA_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.ZEN_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          APK="$(find inputs/android -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ./scripts/verify-apk-release.sh "$APK"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-release.sh --skip-build --apk "$APK"
          STAGE="dist-download/${{ needs.validate.outputs.tag }}"
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}" --stage "$STAGE"
          (cd "$STAGE" && sha256sum -c SHA256SUMS)
          daemon_sums() { grep -E '  mewla-(linux|darwin|windows)-[a-z0-9]+\.(tar\.gz|zip)$' "$1" | LC_ALL=C sort; }
          test "$(daemon_sums "$STAGE/SHA256SUMS" | wc -l)" -eq 4
      - name: Upload complete verified stage
        uses: actions/upload-artifact@v4
        with:
          name: mewla-release-stage-${{ needs.validate.outputs.tag }}
          path: dist-download/${{ needs.validate.outputs.tag }}
          if-no-files-found: error

  # The one gate in front of publication: every build, run, upgrade and signing job of this run
  # succeeded. Cancelled or skipped counts as not passed; the only skip allowed is the stage of a
  # candidate, which is never signed. Publication needs this job and nothing overrides it.
  release-ready:
    name: Every check passed
    needs: [validate, daemon, daemon-linux-arm64, daemon-windows, daemon-darwin, android, android-launch, stage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          MODE: ${{ needs.validate.outputs.mode }}
          PUBLISH: ${{ needs.validate.outputs.publish }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs, mode = json.loads(os.environ["NEEDS"]), os.environ["MODE"]
          bad = []
          for job, need in sorted(needs.items()):
              result = need["result"]
              ok = result == "success" or (job == "stage" and result == "skipped" and mode == "candidate")
              print(f"{'ok  ' if ok else 'FAIL'} {job}: {result}")
              if not ok:
                  bad.append(job)
          if bad:
              sys.exit(f"not ready: {', '.join(bad)}; nothing is published")
          print("ready: " + ("publishing" if os.environ["PUBLISH"] == "true" else "a build-only run publishes nothing"))
          PY

  publish:
    name: Publish the release
    needs: [validate, release-ready]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate immutable tag before external publication
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download complete stage
        uses: actions/download-artifact@v4
        with:
          name: mewla-release-stage-${{ needs.validate.outputs.tag }}
          path: stage
      # One publication of the complete signed set: a draft with every asset, checked, then public.
      # Stable tags become Latest; beta tags stay prereleases.
      - name: Create the draft, upload every asset, verify, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_REPO:-}"
          if [[ "$TAG" == *-beta.* ]]; then
            RELEASE_IS_PRERELEASE=true
            RELEASE_IS_STABLE=false
          else
            RELEASE_IS_PRERELEASE=false
            RELEASE_IS_STABLE=true
          fi
          # The notes are written now, from the commits since the previous release; a failure
          # falls back to a link to the changes and is reported, never holding the release.
          notes="$RUNNER_TEMP/notes.md"
          if ! python3 scripts/release-body.py --tag "$TAG" > "$notes" || [[ ! -s "$notes" ]]; then
            echo "::warning::release-body.py failed; the release carries a link to its commits"
            printf '# Mewla %s\n\n[Changes](https://github.com/%s/commits/%s)\n' "$VERSION" "$GH_REPO" "$TAG" > "$notes"
          fi
          assets=(
            mewla-linux-amd64.tar.gz
            mewla-linux-arm64.tar.gz
            mewla-darwin-arm64.tar.gz
            mewla-windows-amd64.zip
            "mewla-android-arm64-v${VERSION}.apk"
            SHA256SUMS
            release-manifest.json
            release-manifest.json.sig
          )
          for f in "${assets[@]}"; do
            test -s "stage/$f" || { echo "error: missing/empty staged asset $f" >&2; exit 1; }
          done
          expected="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
          if meta="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            if [[ "$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isDraft"])')" == "False" ]]; then
              # Already public (a rerun): the same signed set passes, anything else is refused.
              mkdir -p "$RUNNER_TEMP/published"
              gh release download "$TAG" --dir "$RUNNER_TEMP/published" --pattern SHA256SUMS
              cmp -s "$RUNNER_TEMP/published/SHA256SUMS" stage/SHA256SUMS || {
                echo "error: $TAG is already public with other bytes; refusing to replace them" >&2
                exit 1
              }
              echo "$TAG is already public with this signed set"
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE" \
              --title "Mewla $TAG" --notes-file "$notes"
          fi
          (cd stage && gh release upload "$TAG" "${assets[@]}" --clobber)
          actual="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "error: uploaded non-empty asset set does not exactly match expected set" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }
          gh release edit "$TAG" --draft=false \
            --prerelease="$RELEASE_IS_PRERELEASE" \
            --latest="$RELEASE_IS_STABLE" \
            --notes-file "$notes"
          gh release view "$TAG" --json isDraft,isPrerelease,url,assets

  # Released means one written thing (docs/ci-release.md#released): the tag on main, its commit
  # green on main's CI, the public release with every asset, Latest on the highest stable version.
  released:
    name: Released
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: The release meets the definition
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: python3 scripts/released.py --tag "$TAG"

  # The iPhone build follows the published release: the Preview to TestFlight, submitted for beta
  # review (ios-release.yml), with the build number the release identity derives.
  ios-testflight:
    name: Send the iPhone build to TestFlight
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Dispatch the Preview TestFlight workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          IOS_BUILD_NUMBER="$(python3 scripts/lib/release_identity.py ios_build_number)"
          gh workflow run ios-release.yml \
            --ref "$TAG" \
            -f "ref=$TAG" \
            -f "build_number=$IOS_BUILD_NUMBER" \
            -f "app_identity=preview" \
            -f "destination=testflight"
          echo "ios-release.yml dispatched for $TAG, build $IOS_BUILD_NUMBER"
