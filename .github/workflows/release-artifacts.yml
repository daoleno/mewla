name: Release artifacts

# Secure release pipeline: Linux amd64/arm64, macOS arm64, signed Android arm64 APK.
#
# An annotated vX.Y.Z or vX.Y.Z-beta.N tag push is the normal release action. Manual
# dispatch can rebuild, and can recover publication only with explicit review.
#
# Desktop first: the daemon archives are staged, signed and published as soon as
# they are built. The signed APK, and the SHA256SUMS and signed manifest that
# cover it, are attached to the same release when the Android build finishes.
# Jobs that hold a signing key never hold a write token, and the reverse.
#
# Secrets (GitHub Actions repository secrets only; never commit values). Each
# step maps them once into the MEWLA_* name that scripts read:
#   ZEN_ANDROID_KEYSTORE_BASE64      -> MEWLA_ANDROID_KEYSTORE_BASE64
#   ZEN_ANDROID_KEYSTORE_PASSWORD    -> MEWLA_ANDROID_KEYSTORE_PASSWORD
#   ZEN_ANDROID_KEY_ALIAS            -> MEWLA_ANDROID_KEY_ALIAS
#   ZEN_ANDROID_KEY_PASSWORD         -> MEWLA_ANDROID_KEY_PASSWORD
#   ZEN_UPDATE_SIGNING_KEY_BASE64    -> MEWLA_UPDATE_SIGNING_KEY_BASE64
#
# Docs: docs/ci-release.md

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact annotated vX.Y.Z or vX.Y.Z-beta.N tag to rebuild/recover"
        required: true
        type: string
      publish:
        description: "Reviewed recovery: publish/reconcile the matching release"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-artifacts-${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Stable non-secret product constants used in logs
  MEWLA_JAVA_VERSION: "17"

jobs:
  validate:
    name: Validate immutable reviewed tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
          fetch-depth: 0

      - name: Require registered public GitHub publisher
        run: python3 scripts/plugin-publisher-flags.py --require github

      - name: Fetch and validate reviewed release identity
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "$RELEASE_TAG"
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  daemon:
    name: Build daemon archives
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate tag at build boundary
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install web UI build dependencies
        run: bun install --frozen-lockfile
      - name: Build daemon binaries once
        env:
          MEWLA_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/build-daemon-linux.sh --out-dir "$GITHUB_WORKSPACE/dist-download/staging/bin"
      - name: Verify daemon formats and architectures
        run: |
          set -euo pipefail
          file dist-download/staging/bin/mewla-linux-amd64 | grep -Eq 'ELF 64-bit.*(x86-64|x86_64)'
          file dist-download/staging/bin/mewla-linux-arm64 | grep -Eq 'ELF 64-bit.*(ARM aarch64|ARM64)'
          file dist-download/staging/bin/mewla-darwin-arm64 | grep -Eq 'Mach-O 64-bit.*arm64'
      - name: Upload verified daemon inputs
        uses: actions/upload-artifact@v4
        with:
          name: mewla-daemon-binaries-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin/mewla-*
          if-no-files-found: error

  android:
    needs: validate
    name: Build and verify signed Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Revalidate tag at build boundary
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Reject Android asset resource-name collisions
        working-directory: app
        run: bun test androidAssetNames.test.js

      # Restores only: release tags read the caches native-cache.yml saves on main.
      - name: Android SDK, arm64 Ghostty and Gradle home
        uses: ./.github/actions/android-native

      - name: Materialize signing keystore (temp, mode 0600)
        id: keystore
        env:
          MEWLA_ANDROID_KEYSTORE_BASE64: ${{ secrets.ZEN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${MEWLA_ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "error: repository secret ZEN_ANDROID_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          KS_PATH="${{ runner.temp }}/mewla-release.p12"
          export MEWLA_ANDROID_KEYSTORE="$KS_PATH"
          # Script prints only the path; never logs secret material
          OUT="$(./scripts/materialize-android-keystore.sh)"
          # Do not echo path if it could be sensitive; it is a runner temp path (ok).
          echo "keystore_path=${OUT}" >> "$GITHUB_OUTPUT"
          # sanity: file exists and is non-empty without printing contents
          test -s "$OUT"
          stat -c '%a %n' "$OUT"

      - name: Build signed Android arm64 release APK
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          MEWLA_ANDROID_KEYSTORE: ${{ steps.keystore.outputs.keystore_path }}
          MEWLA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ZEN_ANDROID_KEYSTORE_PASSWORD }}
          MEWLA_ANDROID_KEY_ALIAS: ${{ secrets.ZEN_ANDROID_KEY_ALIAS }}
          MEWLA_ANDROID_KEY_PASSWORD: ${{ secrets.ZEN_ANDROID_KEY_PASSWORD }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          for v in MEWLA_ANDROID_KEYSTORE_PASSWORD MEWLA_ANDROID_KEY_ALIAS MEWLA_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!v:-}" ]]; then
              echo "error: repository secret $v is not set" >&2
              exit 1
            fi
          done
          test -f "${MEWLA_ANDROID_KEYSTORE}"
          ./scripts/android-release-apk.sh
          # Locate APK produced under dist-download/android-native
          APK="$(ls -t dist-download/android-native/mewla-android-arm64-*.apk | head -1)"
          test -f "$APK"
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Verify signed APK (package, ABI, notice, certificate)
        run: |
          set -euo pipefail
          ./scripts/verify-apk-release.sh "${APK_PATH}"

      - name: Shred temporary keystore
        if: always()
        run: |
          set -euo pipefail
          KS="${{ steps.keystore.outputs.keystore_path }}"
          if [[ -n "${KS}" && -f "${KS}" ]]; then
            shred -u "${KS}" 2>/dev/null || rm -f "${KS}"
          fi
          # Ensure env materialization helpers leave no base64 on disk from this step
          rm -f "${{ runner.temp }}/mewla-release.p12" || true

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: mewla-android-apk-${{ needs.validate.outputs.tag }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

  desktop-stage:
    name: Stage, sign, and verify desktop archives
    needs: [validate, daemon]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate tag before signing
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: mewla-daemon-binaries-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin
      - name: Deterministically stage, sign, and verify
        env:
          MEWLA_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.ZEN_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-release.sh --skip-build
          STAGE="dist-download/${{ needs.validate.outputs.tag }}"
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}" --stage "$STAGE"
          (cd "$STAGE" && sha256sum -c SHA256SUMS)
      - name: Upload verified desktop stage
        uses: actions/upload-artifact@v4
        with:
          name: mewla-release-desktop-${{ needs.validate.outputs.tag }}
          path: dist-download/${{ needs.validate.outputs.tag }}
          if-no-files-found: error

  desktop-publish:
    name: Publish the release with desktop archives
    needs: [validate, desktop-stage]
    if: ${{ needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag and tracked notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate immutable tag before external publication
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download desktop stage
        uses: actions/download-artifact@v4
        with:
          name: mewla-release-desktop-${{ needs.validate.outputs.tag }}
          path: stage

      - name: Create/reuse safe draft, upload desktop assets, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_REPO:-}"
          if [[ "$TAG" == *-beta.* ]]; then
            RELEASE_IS_PRERELEASE=true
            RELEASE_IS_STABLE=false
          else
            RELEASE_IS_PRERELEASE=false
            RELEASE_IS_STABLE=true
          fi
          notes="docs/releases/${TAG}.md"
          test -s "$notes"
          if ! meta="$(gh release view "$TAG" --json isPrerelease,isDraft,url 2>/dev/null)"; then
            gh release create "$TAG" --verify-tag --draft \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE" \
              --title "Mewla $TAG" --notes-file "$notes"
            meta="$(gh release view "$TAG" --json isPrerelease,isDraft,url)"
          fi
          is_pre="$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isPrerelease"])')"
          is_draft="$(echo "$meta" | python3 -c 'import json,sys; print(json.load(sys.stdin)["isDraft"])')"
          actual_pre="$(printf '%s' "$is_pre" | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_pre" != "$RELEASE_IS_PRERELEASE" ]]; then
            echo "error: existing $TAG release prerelease state is $actual_pre; expected $RELEASE_IS_PRERELEASE" >&2
            exit 1
          fi
          cd stage
          assets=(
            mewla-linux-amd64.tar.gz
            mewla-linux-arm64.tar.gz
            mewla-darwin-arm64.tar.gz
            SHA256SUMS
            release-manifest.json
            release-manifest.json.sig
          )
          for f in "${assets[@]}"; do
            test -s "$f" || { echo "error: missing/empty staged asset $f" >&2; exit 1; }
          done
          test ! -e "mewla-android-arm64-v${VERSION}.apk"
          gh release upload "$TAG" "${assets[@]}" --clobber
          # A rerun may find the APK from an earlier attach; nothing else is allowed.
          desktop="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
          complete="$(printf '%s\n' "${assets[@]}" "mewla-android-arm64-v${VERSION}.apk" | LC_ALL=C sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' | LC_ALL=C sort)"
          [[ "$actual" == "$desktop" || "$actual" == "$complete" ]] || {
            echo "error: uploaded non-empty asset set is neither the desktop nor the complete set" >&2
            diff -u <(printf '%s\n' "$complete") <(printf '%s\n' "$actual") || true
            exit 1
          }
          if [[ "$is_draft" == "True" || "$is_draft" == "true" ]]; then
            gh release edit "$TAG" --draft=false \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE" \
              --notes-file "../$notes"
          else
            # Already public: keep its notes, which may carry the later iPhone line.
            gh release edit "$TAG" \
              --prerelease="$RELEASE_IS_PRERELEASE" \
              --latest="$RELEASE_IS_STABLE"
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,url

  complete-stage:
    name: Add the signed APK to the signed asset set
    needs: [validate, daemon, android, desktop-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate tag before signing
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: mewla-daemon-binaries-${{ needs.validate.outputs.tag }}
          path: dist-download/staging/bin
      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: mewla-android-apk-${{ needs.validate.outputs.tag }}
          path: inputs/android
      - name: Download desktop stage
        uses: actions/download-artifact@v4
        with:
          name: mewla-release-desktop-${{ needs.validate.outputs.tag }}
          path: inputs/desktop
      - name: Deterministically stage, sign, and verify
        env:
          MEWLA_UPDATE_SIGNING_KEY_BASE64: ${{ secrets.ZEN_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          APK="$(find inputs/android -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ./scripts/verify-apk-release.sh "$APK"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/stage-release.sh --skip-build --apk "$APK"
          STAGE="dist-download/${{ needs.validate.outputs.tag }}"
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}" --stage "$STAGE"
          (cd "$STAGE" && sha256sum -c SHA256SUMS)
          # The desktop archives are already public: the complete set must carry
          # the same bytes, or its checksums and manifest would not match them.
          daemon_sums() { grep -E '  mewla-(linux|darwin)-[a-z0-9]+\.tar\.gz$' "$1" | LC_ALL=C sort; }
          diff -u <(daemon_sums inputs/desktop/SHA256SUMS) <(daemon_sums "$STAGE/SHA256SUMS")
          test "$(daemon_sums "$STAGE/SHA256SUMS" | wc -l)" -eq 3
      - name: Upload complete verified stage
        uses: actions/upload-artifact@v4
        with:
          name: mewla-release-stage-${{ needs.validate.outputs.tag }}
          path: dist-download/${{ needs.validate.outputs.tag }}
          if-no-files-found: error

  android-attach:
    name: Attach the APK and the complete manifest
    needs: [validate, desktop-publish, complete-stage]
    if: ${{ needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
      - name: Revalidate immutable tag before external publication
        run: |
          git fetch --no-tags origin main
          ./scripts/verify-release-identity.sh --tag "${{ needs.validate.outputs.tag }}"
      - name: Download complete stage
        uses: actions/download-artifact@v4
        with:
          name: mewla-release-stage-${{ needs.validate.outputs.tag }}
          path: stage

      - name: Check published archives, upload Android assets, and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_REPO:-}"
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [[ "$is_draft" == "false" ]] || {
            echo "error: $TAG must already be public with its desktop archives" >&2
            exit 1
          }
          published="$RUNNER_TEMP/published"
          mkdir -p "$published"
          gh release download "$TAG" --dir "$published" \
            --pattern mewla-linux-amd64.tar.gz \
            --pattern mewla-linux-arm64.tar.gz \
            --pattern mewla-darwin-arm64.tar.gz
          cp stage/SHA256SUMS "$published/SHA256SUMS"
          (cd "$published" && sha256sum -c --ignore-missing SHA256SUMS)
          test "$(find "$published" -name '*.tar.gz' | wc -l)" -eq 3
          cd stage
          android=(
            "mewla-android-arm64-v${VERSION}.apk"
            SHA256SUMS
            release-manifest.json
            release-manifest.json.sig
          )
          for f in "${android[@]}"; do
            test -s "$f" || { echo "error: missing/empty staged asset $f" >&2; exit 1; }
          done
          gh release upload "$TAG" "${android[@]}" --clobber
          assets=(
            mewla-linux-amd64.tar.gz
            mewla-linux-arm64.tar.gz
            mewla-darwin-arm64.tar.gz
            "mewla-android-arm64-v${VERSION}.apk"
            SHA256SUMS
            release-manifest.json
            release-manifest.json.sig
          )
          expected="$(printf '%s\n' "${assets[@]}" | LC_ALL=C sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "error: uploaded non-empty asset set does not exactly match expected set" >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }
          gh release view "$TAG" --json isDraft,isPrerelease,url,assets
