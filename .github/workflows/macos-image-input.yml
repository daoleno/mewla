name: Mewla for Mac image input

# Files and images into Mewla Dev's composers on a Mac as a person puts them there (owner issues 3 and 4, 2026-11-23):
# pastes with a real ⌘V, real AppKit drags from another app, an image dragged out of Safari and Chrome, the screenshot
# thumbnail, files in Desktop, Documents and Downloads (macOS's privacy prompts as a person meets them), large files,
# a Session's chat and a Work's reply box (client/macos/scripts/image-input-run.sh). Mewla for Mac is built on the
# NSH release it ships with (client/macos/Cargo.toml): since NSH 0.7 (longbridge/nsh#2964) the image out of a browser
# drops with its contents. A local file larger than the 64 MB `fs/promises` reads is a failed chip that says so until
# NSH hands a drop's local files over with their contents (#3015, #3016). A push to a mac-image/ branch, or a dispatch.

on:
  workflow_dispatch:
  push:
    branches: ["mac-image/**"]

permissions:
  contents: read

jobs:
  image:
    name: Paste and drop images into Mewla Dev
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Zig, the terminal engine and the web VT from main's cache
        uses: ./.github/actions/desktop-release-cache
        with:
          lib: darwin_arm64
          web: "true"
      - name: Install NSH
        run: client/scripts/fetch-nsh.sh
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/macos/target
          key: macos-app-v1-${{ hashFiles('client/macos/Cargo.toml', 'client/macos/Cargo.lock') }}
          restore-keys: macos-app-v1-
      - name: Build the daemon and Mewla Dev
        env:
          MEWLA_BUILD_TMPDIR: ${{ runner.temp }}/mewla-build
        run: |
          export MEWLA_GHOSTTY_DESKTOP_CACHE="$HOME/.cache/mewla/ghostty-release/darwin_arm64"
          ./scripts/build-daemon-linux.sh --out-dir "$RUNNER_TEMP/daemon" --targets darwin-arm64 --web-ui build
          client/macos/package.sh --daemon "$RUNNER_TEMP/daemon/mewla-darwin-arm64" --out "$RUNNER_TEMP/app" --dev
      - name: A stub agent, so Brain's chat opens
        run: sudo clang -Wall -Werror client/macos/scripts/stub-claude.c -o /usr/local/bin/claude
      - name: Files and images into Mewla Dev's composers
        timeout-minutes: 45
        run: client/macos/scripts/image-input-run.sh "$(ls "$RUNNER_TEMP"/app/Mewla-Dev-*-macos-aarch64.zip)" "$RUNNER_TEMP/daemon/mewla-darwin-arm64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mewla-macos-image-input-${{ github.sha }}
          path: ${{ runner.temp }}/image-run/captures
          if-no-files-found: ignore
          retention-days: 7
