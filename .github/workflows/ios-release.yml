name: iOS signed release

# Annotated Mewla release tag pushes automatically ship the closed Preview identity
# to TestFlight. Manual dispatch remains available for Preview and Production;
# Production is never selected by an automatic event.
#
# The app is the NSH client's iOS host (client/ios): xcodegen generates the
# project, xcodebuild archives it. It always embeds the Live Activity / widget
# extension (MewlaLiveWidgets, <bundle>.live) and both targets are signed into
# the App Group group.<bundle>, so every run needs both App Store profiles.
on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or full SHA)"
        required: true
        type: string
      build_number:
        description: "CFBundleVersion; empty derives it from the version (scripts/lib/release_identity.py)"
        required: false
        type: string
        default: ""
      app_identity:
        description: "Closed iOS identity: canonical production or temporary Preview"
        required: true
        type: choice
        default: production
        options:
          - production
          - preview
      destination:
        description: "Export only, or explicitly upload the verified IPA to TestFlight"
        required: true
        type: choice
        default: artifact-only
        options:
          - artifact-only
          - testflight

concurrency:
  group: ios-release-${{ github.event_name == 'push' && 'preview' || inputs.app_identity }}-${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    name: Signed archive and IPA
    runs-on: xcode-27
    timeout-minutes: 180
    environment: ${{ (github.event_name == 'push' || inputs.app_identity == 'preview') && 'app-store-connect-preview' || 'app-store-connect' }}
    env:
      MEWLA_IOS_APP_VARIANT: ${{ github.event_name == 'push' && 'preview' || inputs.app_identity }}
      MEWLA_IOS_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '' }}
      MEWLA_IOS_DESTINATION: ${{ github.event_name == 'push' && 'testflight' || inputs.destination }}
      MEWLA_IOS_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
      # A Preview build that goes to TestFlight learns of newer TestFlight builds
      # (ios-testflight-available.yml) and opens TestFlight; every other build stays silent.
      # Passed to xcodebuild as a build setting (Info.plist MewlaDistribution): an
      # environment variable does not override the project's value.
      MEWLA_IOS_DISTRIBUTION: ${{ ((github.event_name == 'push' || inputs.app_identity == 'preview') && (github.event_name == 'push' || inputs.destination == 'testflight')) && 'testflight' || 'none' }}
      # The client always ships the extension: scripts/verify-ios-artifact.sh checks it.
      MEWLA_IOS_LIVE: "1"
      # The notice the client bundles (Settings > Open-source licenses).
      MEWLA_IOS_NOTICE_SRC: client/ui/more/settings/licenses/texts/Ghostty-MIT.txt
    steps:
      - name: Checkout explicit ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MEWLA_IOS_REF }}
          fetch-depth: 0

      - name: Checkout reviewed release automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-automation
          sparse-checkout: scripts/app-store-connect-upload.py
          sparse-checkout-cone-mode: false

      - name: Resolve and validate release invocation
        id: invocation
        env:
          MEWLA_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ -f scripts/lib/release_identity.py && -f client/ios/project.yml ]] || {
            echo "error: $MEWLA_IOS_REF predates the NSH client's iOS release (client/ios, scripts/lib/release_identity.py)" >&2
            exit 1
          }
          TRACKED_VERSION="$(python3 scripts/lib/release_identity.py version)"
          DERIVED_BUILD_NUMBER="$(python3 scripts/lib/release_identity.py ios_build_number)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git fetch --no-tags origin main
            ./scripts/verify-release-identity.sh --tag "$MEWLA_RELEASE_TAG"
            [[ "${MEWLA_RELEASE_TAG#v}" == "$TRACKED_VERSION" ]] || {
              echo "error: release tag version ${MEWLA_RELEASE_TAG#v} does not match tracked version $TRACKED_VERSION" >&2
              exit 1
            }
            MEWLA_IOS_BUILD_NUMBER="$DERIVED_BUILD_NUMBER"
            echo "Automatic Preview TestFlight publication for $MEWLA_RELEASE_TAG build $MEWLA_IOS_BUILD_NUMBER"
          elif [[ -z "$MEWLA_IOS_BUILD_NUMBER" ]]; then
            MEWLA_IOS_BUILD_NUMBER="$DERIVED_BUILD_NUMBER"
          fi
          [[ "$MEWLA_IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "error: build_number must be a positive integer" >&2
            exit 1
          }
          echo "MEWLA_IOS_BUILD_NUMBER=$MEWLA_IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$MEWLA_IOS_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate explicit inputs and required signing secrets
        env:
          PREVIEW_ASC_APP_ID: ${{ vars.MEWLA_ASC_PREVIEW_APP_ID }}
          PRODUCTION_ASC_APP_ID: ${{ vars.ZEN_ASC_APP_ID }}
          MEWLA_APPLE_CERTIFICATE_BASE64: ${{ secrets.ZEN_APPLE_CERTIFICATE_BASE64 }}
          MEWLA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.ZEN_APPLE_CERTIFICATE_PASSWORD }}
          MEWLA_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZEN_APPLE_PROVISIONING_PROFILE_BASE64 }}
          MEWLA_APPLE_TEAM_ID: ${{ secrets.ZEN_APPLE_TEAM_ID }}
          MEWLA_ASC_KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          MEWLA_ASC_API_KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
          MEWLA_APPLE_LIVE_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZEN_APPLE_LIVE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            MEWLA_APPLE_CERTIFICATE_BASE64 \
            MEWLA_APPLE_CERTIFICATE_PASSWORD \
            MEWLA_APPLE_PROVISIONING_PROFILE_BASE64 \
            MEWLA_APPLE_LIVE_PROVISIONING_PROFILE_BASE64 \
            MEWLA_APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "error: required app-store-connect environment secret ${name/#MEWLA_/ZEN_} is not configured" >&2
              exit 1
            fi
          done
          if [[ "$MEWLA_IOS_DESTINATION" == "testflight" ]]; then
            if [[ "$MEWLA_IOS_APP_VARIANT" == "preview" ]]; then
              MEWLA_ASC_APP_ID="$PREVIEW_ASC_APP_ID"
              APP_ID_VARIABLE=MEWLA_ASC_PREVIEW_APP_ID
            else
              MEWLA_ASC_APP_ID="$PRODUCTION_ASC_APP_ID"
              APP_ID_VARIABLE=ZEN_ASC_APP_ID
            fi
            if [[ ! "$MEWLA_ASC_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "error: destination=testflight requires a numeric $APP_ID_VARIABLE variable for $MEWLA_IOS_APP_VARIANT" >&2
              exit 1
            fi
            echo "MEWLA_ASC_APP_ID=$MEWLA_ASC_APP_ID" >> "$GITHUB_ENV"
            for name in MEWLA_ASC_KEY_ID MEWLA_ASC_API_KEY_BASE64; do
              if [[ -z "${!name:-}" ]]; then
                echo "error: destination=testflight requires environment configuration ${name/#MEWLA_/ZEN_}" >&2
                exit 1
              fi
            done
          fi
          if [[ "$MEWLA_IOS_APP_VARIANT" == "preview" && "$MEWLA_APPLE_TEAM_ID" != "HD84J3DJ2B" ]]; then
            echo "error: Preview signing material must belong to Apple team HD84J3DJ2B" >&2
            exit 1
          fi

      - name: Require Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # The closed identities the Expo app shipped (scripts/lib/release_identity.py): the App Store
      # and TestFlight builds replace those installs in place.
      - name: Resolve closed iOS identity contract
        run: |
          set -euo pipefail
          case "$MEWLA_IOS_APP_VARIANT" in
            production)
              BUNDLE_ID="$(python3 scripts/lib/release_identity.py ios_bundle_id)"
              ARTIFACT_NAME=mewla-ios
              ;;
            preview)
              BUNDLE_ID="$(python3 scripts/lib/release_identity.py ios_preview_bundle_id)"
              ARTIFACT_NAME=mewla-preview-ios
              ;;
            *)
              echo "error: MEWLA_IOS_APP_VARIANT must be production or preview" >&2
              exit 1
              ;;
          esac
          # Only the Preview identity has an availability feed (ios-testflight-available.yml).
          if [[ "$MEWLA_IOS_DISTRIBUTION" == "testflight" && "$MEWLA_IOS_APP_VARIANT" != "preview" ]]; then
            echo "error: MEWLA_IOS_DISTRIBUTION=testflight requires the Preview iOS identity" >&2
            exit 1
          fi
          {
            echo "MEWLA_IOS_DISPLAY_NAME=Mewla"
            echo "MEWLA_IOS_BUNDLE_ID=$BUNDLE_ID"
            echo "MEWLA_IOS_NATIVE_PROJECT_NAME=Mewla"
            echo "MEWLA_IOS_ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "MEWLA_IOS_VERSION=$(python3 scripts/lib/release_identity.py marketing_version)"
          } >> "$GITHUB_ENV"

      - name: Verify tracked release identity
        run: ./scripts/verify-release-identity.sh

      # Restore-only: native-cache.yml on main is the only writer, because a
      # tag run can read main's caches but nothing can read a tag's.
      - name: iOS Ghostty XCFramework cache
        uses: ./.github/actions/ios-native

      # The pinned NSH release (checksums in the script): the CLI that bundles client/ui
      # and NativeShell.xcframework. Fetched, not cached.
      - name: Install NSH and the iOS framework
        run: client/scripts/fetch-nsh.sh --ios

      - name: Generate the release project
        run: |
          set -euo pipefail
          brew install xcodegen > /dev/null
          client/scripts/ios-project.sh

      - name: Import distribution certificate and provisioning profiles
        id: signing
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/mewla-distribution.p12
          PROFILE_PATH: ${{ runner.temp }}/mewla-app-store.mobileprovision
          PROFILE_PLIST: ${{ runner.temp }}/mewla-app-store.plist
          LIVE_PROFILE_PATH: ${{ runner.temp }}/mewla-live-app-store.mobileprovision
          LIVE_PROFILE_PLIST: ${{ runner.temp }}/mewla-live-app-store.plist
          MEWLA_APPLE_LIVE_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZEN_APPLE_LIVE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PATH: ${{ runner.temp }}/mewla-signing.keychain-db
          MEWLA_APPLE_CERTIFICATE_BASE64: ${{ secrets.ZEN_APPLE_CERTIFICATE_BASE64 }}
          MEWLA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.ZEN_APPLE_CERTIFICATE_PASSWORD }}
          MEWLA_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.ZEN_APPLE_PROVISIONING_PROFILE_BASE64 }}
          MEWLA_APPLE_TEAM_ID: ${{ secrets.ZEN_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, pathlib
          for env_name, path_name in (
              ("MEWLA_APPLE_CERTIFICATE_BASE64", "CERTIFICATE_PATH"),
              ("MEWLA_APPLE_PROVISIONING_PROFILE_BASE64", "PROFILE_PATH"),
              ("MEWLA_APPLE_LIVE_PROVISIONING_PROFILE_BASE64", "LIVE_PROFILE_PATH"),
          ):
              try:
                  data = base64.b64decode(os.environ[env_name], validate=True)
              except Exception as exc:
                  raise SystemExit(f"error: {env_name} is not valid base64: {exc}")
              if not data:
                  raise SystemExit(f"error: {env_name} decoded to an empty file")
              path = pathlib.Path(os.environ[path_name])
              path.write_bytes(data)
              path.chmod(0o600)
          PY

          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MEWLA_APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution' || {
            echo "error: imported PKCS#12 has no Apple Distribution signing identity" >&2
            exit 1
          }

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          security cms -D -i "$LIVE_PROFILE_PATH" > "$LIVE_PROFILE_PLIST"
          # The app and its extension are two App IDs with their own App Store profiles;
          # both profiles must carry the shared App Group, or the widget cannot read what
          # the app wrote (and the client's entitlements could not be signed).
          python3 - "$PROFILE_PLIST" "$LIVE_PROFILE_PLIST" "$GITHUB_OUTPUT" <<'PY'
          import datetime, os, plistlib, sys
          expected_team = os.environ["MEWLA_APPLE_TEAM_ID"]
          expected_bundle = os.environ["MEWLA_IOS_BUNDLE_ID"]
          bundle = expected_bundle
          group = "group." + bundle
          now = datetime.datetime.now(datetime.timezone.utc)
          outputs = {}
          for label, path, app_id, prefix in (
              ("app", sys.argv[1], expected_bundle, ""),
              ("extension", sys.argv[2], f"{bundle}.live", "live_"),
          ):
              profile = plistlib.load(open(path, "rb"))
              if (profile.get("TeamIdentifier") or []) != [expected_team]:
                  raise SystemExit(f"error: {label} provisioning profile team does not match MEWLA_APPLE_TEAM_ID")
              entitlements = profile.get("Entitlements") or {}
              if entitlements.get("application-identifier", "") != f"{expected_team}.{app_id}":
                  raise SystemExit(f"error: {label} provisioning profile is not for {app_id}")
              if entitlements.get("get-task-allow") is not False:
                  raise SystemExit(f"error: {label} provisioning profile is a development profile, not App Store distribution")
              if entitlements.get("beta-reports-active") is not True:
                  raise SystemExit(f"error: {label} provisioning profile is not eligible for App Store Connect/TestFlight")
              groups = entitlements.get("com.apple.security.application-groups") or []
              if group not in groups:
                  raise SystemExit(f"error: {label} provisioning profile does not include App Group {group}; regenerate it after enabling App Groups")
              expiration = profile.get("ExpirationDate")
              if not expiration or expiration.replace(tzinfo=datetime.timezone.utc) <= now:
                  raise SystemExit(f"error: {label} provisioning profile is expired")
              for key in ("Name", "UUID"):
                  value = profile.get(key)
                  if not value:
                      raise SystemExit(f"error: {label} provisioning profile has no {key}")
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"error: unsafe newline in {label} provisioning profile {key}")
                  outputs[f"{prefix}profile_{key.lower()}"] = value
          with open(sys.argv[3], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          LIVE_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$LIVE_PROFILE_PLIST")"
          cp "$LIVE_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${LIVE_PROFILE_UUID}.mobileprovision"

      - name: Archive and export signed IPA
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/Mewla.xcarchive
          EXPORT_PATH: ${{ runner.temp }}/ios-export
          EXPORT_OPTIONS: ${{ runner.temp }}/ExportOptions.plist
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          LIVE_PROFILE_NAME: ${{ steps.signing.outputs.live_profile_name }}
          MEWLA_APPLE_TEAM_ID: ${{ secrets.ZEN_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          set -o pipefail
          python3 - "$EXPORT_OPTIONS" "$MEWLA_APPLE_TEAM_ID" "$PROFILE_NAME" "$LIVE_PROFILE_NAME" <<'PY'
          import os, plistlib, sys
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": sys.argv[2],
              "provisioningProfiles": {
                  os.environ["MEWLA_IOS_BUNDLE_ID"]: sys.argv[3],
                  os.environ["MEWLA_IOS_BUNDLE_ID"] + ".live": sys.argv[4],
              },
              "manageAppVersionAndBuildNumber": False,
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          with open(sys.argv[1], "wb") as output:
              plistlib.dump(options, output)
          PY
          # Build settings on the command line apply to every target: the app and its
          # extension share the identity, version and build. Each target takes its own
          # profile (client/ios/project.yml: MEWLA_APP_PROFILE, MEWLA_LIVE_PROFILE).
          xcodebuild \
            -project client/ios/Mewla.xcodeproj \
            -scheme Mewla \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$MEWLA_APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            MEWLA_APP_ID="$MEWLA_IOS_BUNDLE_ID" \
            MEWLA_APP_PROFILE="$PROFILE_NAME" \
            MEWLA_LIVE_PROFILE="$LIVE_PROFILE_NAME" \
            MARKETING_VERSION="$MEWLA_IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$MEWLA_IOS_BUILD_NUMBER" \
            MEWLA_IOS_DISTRIBUTION="$MEWLA_IOS_DISTRIBUTION" \
            archive
          test -d "$ARCHIVE_PATH"
          ARCHIVED_APP="$ARCHIVE_PATH/Products/Applications/Mewla.app"
          DISTRIBUTION="$(/usr/libexec/PlistBuddy -c 'Print :MewlaDistribution' "$ARCHIVED_APP/Info.plist")"
          [[ "$DISTRIBUTION" == "$MEWLA_IOS_DISTRIBUTION" ]] || {
            echo "error: archived MewlaDistribution is $DISTRIBUTION; expected $MEWLA_IOS_DISTRIBUTION" >&2
            exit 1
          }
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          mapfile_supported=false
          if builtin help mapfile >/dev/null 2>&1; then mapfile_supported=true; fi
          if [[ "$mapfile_supported" == true ]]; then
            mapfile -t IPAS < <(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa')
          else
            IPAS=()
            while IFS= read -r ipa; do IPAS+=("$ipa"); done < <(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa')
          fi
          [[ ${#IPAS[@]} -eq 1 ]] || {
            echo "error: expected exactly one exported IPA, found ${#IPAS[@]}" >&2
            exit 1
          }
          ./scripts/verify-ios-artifact.sh ipa "${IPAS[0]}"
          ARTIFACT_DIR="${{ runner.temp }}/ios-release-artifact"
          mkdir -p "$ARTIFACT_DIR"
          IPA="$ARTIFACT_DIR/${MEWLA_IOS_ARTIFACT_NAME}-v${MEWLA_IOS_VERSION}-build${MEWLA_IOS_BUILD_NUMBER}.ipa"
          cp "${IPAS[0]}" "$IPA"
          python3 - "$IPA" "$ARTIFACT_DIR/release-manifest.json" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          ipa = pathlib.Path(sys.argv[1])
          ipa_digest = hashlib.sha256()
          with ipa.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  ipa_digest.update(chunk)
          manifest = {
              "schema_version": 1,
              "platform": "ios",
              "distribution": "app-store-connect",
              "app_identity": os.environ["MEWLA_IOS_APP_VARIANT"],
              "display_name": os.environ["MEWLA_IOS_DISPLAY_NAME"],
              "bundle_identifier": os.environ["MEWLA_IOS_BUNDLE_ID"],
              "marketing_version": os.environ["MEWLA_IOS_VERSION"],
              "build_number": os.environ["MEWLA_IOS_BUILD_NUMBER"],
              "git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "ipa": ipa.name,
              "ipa_sha256": ipa_digest.hexdigest(),
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          (cd "$ARTIFACT_DIR" && shasum -a 256 "$(basename "$IPA")" > SHA256SUMS)
          (cd "$ARTIFACT_DIR" && shasum -a 256 -c SHA256SUMS)
          echo "IOS_IPA=$IPA" >> "$GITHUB_ENV"
          echo "IOS_ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Upload verified signed IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MEWLA_IOS_ARTIFACT_NAME }}-signed-${{ steps.invocation.outputs.build_number }}
          path: ${{ env.IOS_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14

      # What turns a captured JS stack back into names (`nsh symbolicate`): this build's client/ui
      # source map, kept out of the app (client/ios/project.yml) and here, beside the build it belongs to.
      - name: Upload the JS source map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MEWLA_IOS_ARTIFACT_NAME }}-symbols-${{ steps.invocation.outputs.build_number }}
          path: client/ios/build/bundleUi.js.map
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified IPA to TestFlight
        if: ${{ env.MEWLA_IOS_DESTINATION == 'testflight' }}
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/mewla-asc-individual-key.p8
          MEWLA_ASC_KEY_ID: ${{ secrets.ZEN_ASC_KEY_ID }}
          MEWLA_ASC_API_KEY_BASE64: ${{ secrets.ZEN_ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 - "$ASC_KEY_PATH" <<'PY'
          import base64, os, pathlib, sys
          try:
              data = base64.b64decode(os.environ["MEWLA_ASC_API_KEY_BASE64"], validate=True)
          except Exception as exc:
              raise SystemExit(f"error: MEWLA_ASC_API_KEY_BASE64 is not valid base64: {exc}")
          if not data:
              raise SystemExit("error: MEWLA_ASC_API_KEY_BASE64 decoded to an empty file")
          path = pathlib.Path(sys.argv[1])
          path.write_bytes(data)
          path.chmod(0o600)
          PY
          EXTRA_ARGS=()
          if [[ "$MEWLA_IOS_APP_VARIANT" == "preview" ]]; then
            EXTRA_ARGS=(--reuse-existing-build --beta-group-name "Mewla Preview" --submit-beta-review)
          fi
          ./.release-automation/scripts/app-store-connect-upload.py \
            --ipa "$IOS_IPA" \
            --app-id "$MEWLA_ASC_APP_ID" \
            --version "$MEWLA_IOS_VERSION" \
            --build-number "$MEWLA_IOS_BUILD_NUMBER" \
            --key-id "$MEWLA_ASC_KEY_ID" \
            --key-path "$ASC_KEY_PATH" \
            "${EXTRA_ARGS[@]}"

      - name: Remove temporary signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/mewla-signing.keychain-db
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          LIVE_PROFILE_UUID: ${{ steps.signing.outputs.live_profile_uuid }}
        run: |
          set +e
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          if [[ -n "${LIVE_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${LIVE_PROFILE_UUID}.mobileprovision"
          fi
          rm -f \
            "${{ runner.temp }}/mewla-distribution.p12" \
