# Mewla account service (config/deploy.yml, role account). Sourced by deploy; installed by install.sh.
KAMAL_SERVICES=("deploy.yml:mewla-link")
IMAGES=(localhost:5555/daoleno/mewla-link)
VERSION_RE='^[0-9a-f]{40}$'      # full commit SHA, as Kamal tags it
MAX_BYTES=$((300 * 1024 * 1024)) # the image is about 25 MB
RECEIVE_SECONDS=600

# One account container, at this version and healthy, and the public path through the relay
# (SNI route to the alias mewla-account) answers: /device redirects to GitHub's device page.
post_check() {
  local version=$1 running health code i
  running=$(running_version mewla-link)
  [ "$running" = "$version" ] || { log "check: the running account version is $running, want $version"; return 1; }
  health=$(docker inspect -f '{{.State.Health.Status}}' "mewla-link-account-$version" 2>/dev/null || echo missing)
  [ "$health" = healthy ] || { log "check: mewla-link-account-$version is $health"; return 1; }
  for i in 1 2 3 4 5; do
    code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --resolve connect.mewla.ai:443:127.0.0.1 https://connect.mewla.ai/device || true)
    [ "$code" = 302 ] || { log "check: https://connect.mewla.ai/device answered $code through the relay (want 302)"; return 1; }
    sleep 1
  done
  log "check: one account container at $version, healthy; /device 302 through the relay 5 times"
}
