# Onlora (onlora/onlora): the API first (it migrates), then the web. Sourced by deploy.
KAMAL_SERVICES=("deploy.api.yml:onlora-api" "deploy.yml:onlora-web")
IMAGES=(localhost:5555/onlora/onlora-api localhost:5555/onlora/onlora-web)
VERSION_RE='^v[0-9]+\.[0-9]+\.[0-9]+$' # the release tag
MAX_BYTES=$((8 * 1024 * 1024 * 1024))  # both images are about 3.9 GB before compression
RECEIVE_SECONDS=2400

# Both public URLs report this version (through Cloudflare, as people reach them) and /up answers.
post_check() {
  local version=$1 url got deadline
  for url in https://api.onlora.ai https://onlora.ai; do
    deadline=$(( $(date +%s) + 120 )) got=
    while [ "$(date +%s)" -lt "$deadline" ]; do
      got=$(curl -fsS --max-time 5 "$url/version" 2>/dev/null | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
      [ "$got" = "$version" ] && break
      sleep 2
    done
    [ "$got" = "$version" ] || { log "check: $url/version answered '$got', want $version"; return 1; }
    curl -fsS --max-time 5 -o /dev/null "$url/up" || { log "check: $url/up failed"; return 1; }
  done
  log "check: api.onlora.ai and onlora.ai report $version; /up answers"
}
