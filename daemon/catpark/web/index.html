<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a211a">
<title>Cat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="app">

  <section class="screen" id="house">
    <div class="stage" id="stage">
      <img class="plate on" id="p-day" src="a/room_day.jpg" alt="">
      <img class="plate" id="p-night" src="a/room_night.jpg" alt="">
      <div class="frames" id="frames"></div>
      <div class="shelfitems" id="shelfitems"></div>
      <img class="bagtreat" id="bagtreat" alt="">
      <img class="sign" id="sign" src="a/sign_bubble.webp" alt="">
      <button class="hot" id="hot-mail" style="left:15%;top:49%;width:24%;height:5%"></button>
      <button class="hot" id="hot-shelf" style="left:32%;top:12%;width:50%;height:9%"></button>
      <button class="hot" id="hot-window" style="left:61.5%;top:31%;width:25%;height:15%"></button>
      <button class="hot" id="hot-bag" style="left:43%;top:28.5%;width:10%;height:10%"></button>
      <button class="hot" id="hot-sign" style="left:15.5%;top:31%;width:13%;height:8%"></button>
      <button class="hot" id="hot-bed" style="left:12%;top:72%;width:22%;height:14%"></button>
      <button class="hot" id="hot-cal" style="left:70.75%;top:15.5%;width:11%;height:10%"></button>
      <i class="calmark" id="calmark"></i>
      <button class="hot" id="hot-cat" style="left:51%;top:51%;width:36%;height:21%"></button>
      <button class="awaynote" id="awaynote"><img alt=""><span><b id="awaywhere"></b><i id="awaywhen"></i></span></button>
    </div>
  </section>

  <section class="screen" id="album">
    <div class="scroll" id="albumscroll"><div class="grid" id="grid"></div></div>
  </section>

  <section class="screen" id="yard">
    <div class="stage" id="yardstage">
      <img class="plate on" id="y-day" src="a/yard_day.jpg" alt="">
      <img class="plate" id="y-night" src="a/yard_night.jpg" alt="">
      <div id="yardlife"></div>
      <div id="treats"></div>
      <button class="hot" id="hot-pond" style="left:18%;top:83.5%;width:32%;height:9%"></button>
      <button class="hot" id="hot-dog" style="left:88%;top:55%;width:22%;height:12%"></button>
    </div>
    <div class="tray yardtray" id="yardtray"></div>
  </section>

  <button class="back" id="back"></button>

  <div class="ov" id="diary"><div class="dim"></div><button class="tapper" id="diarytap"></button><div class="diarypage" id="diarypage"></div></div>
  <div class="ov" id="arrive"><div class="dim"></div><div class="holder" id="arriveholder"></div><button class="tapper" id="arrivetap"></button></div>
  <div class="ov" id="zoom"><div class="dim"></div><div class="holder" id="zoomholder"></div><button class="tapper" id="zoomtap"></button></div>
  <div class="ov" id="sheet"><div class="dim"></div><button class="tapper" id="sheettap"></button><div class="panel"><div class="grab"></div><div class="grid3" id="sheetrow"></div></div></div>
  <div class="ov" id="foodsheet"><button class="tapper" id="foodtap"></button><div class="panel low"><div class="grab"></div><div class="tray" id="foodtray"></div></div></div>
  <div class="ov" id="bagsheet"><div class="dim"></div><button class="tapper" id="bagtap"></button><div class="panel"><div class="grab"></div><div class="tray" id="bagtray"></div></div></div>
  <div class="ov" id="namesheet"><div class="dim"></div><button class="tapper" id="nametap"></button><form class="namecard" id="nameform" autocomplete="off"><img src="a/cat_greet_a.webp" alt=""><b id="nameask"></b><input id="namein" maxlength="16" enterkeyhint="done" autocapitalize="words" spellcheck="false"><button type="submit" id="nameok"></button></form></div>
</div>
<script src="catalog.js"></script>
<script src="kit.js"></script>
<script src="lines.js"></script>
<script src="sound.js"></script>
<script src="card.js"></script>
<script src="game.js"></script>
<script src="life.js"></script>
<script src="guide.js"></script>
</body>
</html>
