<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a211a">
<title>Cat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="app">

  <section class="screen" id="house">
    <div class="stage" id="stage">
      <img class="plate on" id="p-home" src="a/home_nocat.jpg" alt="">
      <img class="plate" id="p-away" src="a/away.jpg" alt="">
      <img class="plate" id="p-night" src="a/night.jpg" alt="">
      <div class="cat" id="cat-home" style="position:absolute;left:32.06%;top:39.13%;width:38.43%"><img src="a/cat_home.webp" alt=""></div>
      <div class="cat" id="cat-night" style="position:absolute;left:35.53%;top:54.56%;width:22.1%"><img src="a/cat_night.webp" alt=""></div>
      <div class="shelfitems" id="shelfitems"></div>
      <img class="bagtreat" id="bagtreat" alt="">
      <img class="sign" id="sign" src="a/sign_bubble.webp" alt="">
      <svg class="badge" id="badge" viewBox="0 0 34 26" aria-hidden="true"><rect x="1.5" y="1.5" width="31" height="23" rx="3" fill="#fffaf0" stroke="#4a3b2e" stroke-width="2"/><path d="M3 4l14 11L31 4" fill="none" stroke="#4a3b2e" stroke-width="2" stroke-linejoin="round"/><circle cx="28" cy="5" r="5" fill="#c8442f" stroke="#fffaf0" stroke-width="1.5"/></svg>
      <button class="hot" id="hot-mail" aria-label="Mailbox" style="left:69%;top:14%;width:17%;height:9%"></button>
      <button class="hot" id="hot-shelf" aria-label="Shelf" style="left:27%;top:12.4%;width:44%;height:8%"></button>
      <button class="hot" id="hot-window" aria-label="Window" style="left:72%;top:33%;width:30%;height:17%"></button>
      <button class="hot" id="hot-bag" aria-label="Bag" style="left:11%;top:21%;width:15%;height:10%"></button>
      <button class="hot" id="hot-sign" aria-label="Sign" style="left:62%;top:33%;width:20%;height:10%"></button>
      <button class="hot" id="hot-cat" aria-label="Cat" style="left:51%;top:51%;width:36%;height:21%"></button>
    </div>
  </section>

  <section class="screen" id="album">
    <div class="scroll" id="albumscroll"><div class="grid" id="grid"></div></div>
  </section>

  <section class="screen" id="yard">
    <div class="stage" id="yardstage">
      <img class="plate on" id="y-day" src="a/yard_day.jpg" alt="">
      <img class="plate" id="y-night" src="a/yard_night.jpg" alt="">
      <div id="treats"></div>
    </div>
    <div class="tray yardtray" id="yardtray"></div>
  </section>

  <button class="back" id="back" aria-label="Back"></button>

  <div class="ov" id="arrive"><div class="dim"></div><div class="holder" id="arriveholder"></div><button class="tapper" id="arrivetap" aria-label="Keep"></button></div>
  <div class="ov" id="zoom"><div class="dim"></div><div class="holder" id="zoomholder"></div><button class="tapper" id="zoomtap" aria-label="Close"></button></div>
  <div class="ov" id="sheet"><div class="dim"></div><button class="tapper" id="sheettap" aria-label="Close"></button><div class="panel"><div class="grab"></div><div class="grid3" id="sheetrow"></div></div></div>
  <div class="ov" id="bagsheet"><div class="dim"></div><button class="tapper" id="bagtap" aria-label="Close"></button><div class="panel"><div class="grab"></div><div class="tray" id="bagtray"></div></div></div>
</div>
<script src="lines.js"></script>
<script src="game.js"></script>
</body>
</html>
