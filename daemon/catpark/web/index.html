<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a211a">
<title>Cat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div id="app">

  <section class="screen" id="house">
    <div class="stage" id="stage">
      <img class="plate on" id="p-day" src="a/room_day.jpg" alt="">
      <img class="plate" id="p-night" src="a/room_night.jpg" alt="">
      <div class="frames" id="frames"></div>
      <div class="shelfitems" id="shelfitems"></div>
      <img class="bagtreat" id="bagtreat" alt="">
      <img class="sign" id="sign" src="a/sign_bubble.webp" alt="">
      <svg class="badge" id="badge" viewBox="0 0 34 26" aria-hidden="true"><rect x="1.5" y="1.5" width="31" height="23" rx="3" fill="#fffaf0" stroke="#4a3b2e" stroke-width="2"/><path d="M3 4l14 11L31 4" fill="none" stroke="#4a3b2e" stroke-width="2" stroke-linejoin="round"/><circle cx="28" cy="5" r="5" fill="#c8442f" stroke="#fffaf0" stroke-width="1.5"/></svg>
      <button class="hot" id="hot-mail" style="left:66.5%;top:13.5%;width:17%;height:9%"></button>
      <button class="hot" id="hot-shelf" style="left:27%;top:12.4%;width:40%;height:8%"></button>
      <button class="hot" id="hot-window" style="left:70%;top:37%;width:34%;height:20%"></button>
      <button class="hot" id="hot-bag" style="left:11%;top:22%;width:15%;height:10%"></button>
      <button class="hot" id="hot-sign" style="left:62%;top:33%;width:20%;height:10%"></button>
      <button class="hot" id="hot-bed" style="left:14%;top:58%;width:26%;height:12%"></button>
      <button class="hot" id="hot-cat" style="left:51%;top:51%;width:36%;height:21%"></button>
    </div>
  </section>

  <section class="screen" id="album">
    <div class="scroll" id="albumscroll"><div class="grid" id="grid"></div></div>
  </section>

  <section class="screen" id="yard">
    <div class="stage" id="yardstage">
      <img class="plate on" id="y-day" src="a/yard_day.jpg" alt="">
      <img class="plate" id="y-night" src="a/yard_night.jpg" alt="">
      <div id="yardlife"></div>
      <div id="treats"></div>
      <button class="hot" id="hot-pond" style="left:18%;top:83.5%;width:32%;height:9%"></button>
      <button class="hot" id="hot-dog" style="left:88%;top:55%;width:22%;height:12%"></button>
    </div>
    <div class="tray yardtray" id="yardtray"></div>
  </section>

  <button class="back" id="back"></button>

  <div class="ov" id="arrive"><div class="dim"></div><div class="holder" id="arriveholder"></div><button class="tapper" id="arrivetap"></button></div>
  <div class="ov" id="zoom"><div class="dim"></div><div class="holder" id="zoomholder"></div><button class="tapper" id="zoomtap"></button></div>
  <div class="ov" id="sheet"><div class="dim"></div><button class="tapper" id="sheettap"></button><div class="panel"><div class="grab"></div><div class="grid3" id="sheetrow"></div></div></div>
  <div class="ov" id="foodsheet"><button class="tapper" id="foodtap"></button><div class="panel low"><div class="grab"></div><div class="tray" id="foodtray"></div></div></div>
  <div class="ov" id="bagsheet"><div class="dim"></div><button class="tapper" id="bagtap"></button><div class="panel"><div class="grab"></div><div class="tray" id="bagtray"></div></div></div>
  <div class="ov" id="jarsheet"><div class="dim"></div><button class="tapper" id="jartap"></button><div class="holder" id="jarholder"></div></div>
</div>
<script src="catalog.js"></script>
<script src="kit.js"></script>
<script src="lines.js"></script>
<script src="sound.js"></script>
<script src="card.js"></script>
<script src="game.js"></script>
<script src="life.js"></script>
<script src="guide.js"></script>
</body>
</html>
