<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mewla</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --ok: #1a7f37; --warn: #9a6700; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --ok: #3fb950; --warn: #d29922; } }
  body { margin: 0; padding: 16px; width: 300px; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  h1 img { width: 20px; height: 20px; border-radius: 5px; }
  .state { font-weight: 600; }
  .ok { color: var(--ok); } .warn { color: var(--warn); }
  p { margin: 6px 0; color: var(--muted); }
</style>
<h1><img src="icons/icon-48.png" alt="">Mewla</h1>
<div id="state" class="state">Checking…</div>
<p id="detail"></p>
<p>Agents that Mewla starts on this computer work in a window of their own in this Chrome. Your tabs and windows are never read or touched.</p>
<script src="status.js" type="module"></script>
