apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.mewlaphone'
version = '0.1.0'

android {
  namespace "expo.modules.mewlaphone"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 26)
    targetSdk safeExtGet("targetSdkVersion", 35)
    // The helper is only ever reached by its class name, so a minified build must not rename it.
    consumerProguardFiles 'consumer-rules.pro'
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core:1.17.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
