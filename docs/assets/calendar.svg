<svg xmlns="http://www.w3.org/2000/svg" class="ca" viewBox="0 0 480 530" width="480" height="530" role="img" aria-labelledby="ca-t ca-d" fill="none"><title id="ca-t">Calendar with a scheduled action</title><desc id="ca-d">Today: a reminder and a scheduled action that is running as Work. Tomorrow: an event. Friday: a deadline that needs you. Monday: a scheduled action, Check 1.4 crash reports.</desc><style>.ca text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;white-space:pre}.ca .m{font-family:"Maple Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}.ca .d{font-family:"Bricolage Grotesque",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.02em}.ca .spin{transform-box:fill-box;transform-origin:center;animation:ca-spin 1.1s linear infinite}@keyframes ca-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.ca .spin{animation:none}}</style><rect width="480" height="530" rx="20" fill="#F1EEE7"/><rect x="12" y="12" width="456" height="506" rx="22" fill="#FBFAF7" stroke="#DDD6C9" stroke-width="1"/><text x="240" y="50" font-size="18" fill="#161412" font-weight="600" text-anchor="middle">Calendar</text><path d="M438 38v14M431 45h14" fill="none" stroke="#161412" stroke-width="1.6" stroke-linecap="round"/><text x="30" y="98" font-size="20" fill="#161412" font-weight="800" class="d">Today</text><text x="30" y="120" font-size="12.5" fill="#57514A">Thursday, October 8</text><text x="34" y="162" font-size="13" fill="#57514A">10:30</text><path d="M92 138L92 190" stroke="#DDD6C9" stroke-width="1.5"/><text x="108" y="156" font-size="15" fill="#161412" font-weight="500">Review the 1.4 launch checklist</text><text x="108" y="178" font-size="12.5" fill="#57514A">Reminder · Scheduled</text><path d="M442 157l5 5l-5 5" fill="none" stroke="#57514A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="226" font-size="13" fill="#57514A">14:00</text><path d="M92 202L92 254" stroke="#DDD6C9" stroke-width="1.5"/><text x="108" y="220" font-size="15" fill="#161412" font-weight="500">Publish the 1.4 release notes</text><text x="108" y="242" font-size="12.5" fill="#57514A">Mewla action ·</text><circle cx="210.625" cy="237.5" r="5.5" fill="none" stroke="#2C55C0" stroke-width="1.8" class="spin" stroke-dasharray="24.19 34.56" stroke-linecap="round"/><text x="223.125" y="242" font-size="12.5" fill="#2C55C0" font-weight="500">Running</text><path d="M442 221l5 5l-5 5" fill="none" stroke="#57514A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="298" font-size="20" fill="#161412" font-weight="800" class="d">Friday</text><text x="34" y="342" font-size="13" fill="#57514A">17:00</text><path d="M92 318L92 370" stroke="#DDD6C9" stroke-width="1.5"/><text x="108" y="336" font-size="15" fill="#161412" font-weight="500">atlas-notes 1.4 ships</text><text x="108" y="358" font-size="12.5" fill="#57514A">Deadline ·</text><rect x="177.625" y="346.5" width="38.01" height="19.5" rx="9.75" fill="#C8372B"/><text x="196.63" y="359" font-size="11.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Due</text><path d="M442 337l5 5l-5 5" fill="none" stroke="#57514A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="414" font-size="20" fill="#161412" font-weight="800" class="d">Monday</text><text x="34" y="458" font-size="13" fill="#57514A">09:00</text><path d="M92 434L92 486" stroke="#DDD6C9" stroke-width="1.5"/><text x="108" y="452" font-size="15" fill="#161412" font-weight="500">Check 1.4 crash reports</text><text x="108" y="474" font-size="12.5" fill="#57514A">Mewla action · Scheduled</text><path d="M442 453l5 5l-5 5" fill="none" stroke="#57514A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
