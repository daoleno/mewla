services:
  relay:
    build:
      context: ../..
      dockerfile: daemon/Dockerfile.relay
    restart: unless-stopped
    environment:
      MEWLA_LINK_CONNECTOR_TOKEN: ${MEWLA_LINK_CONNECTOR_TOKEN:?set a random connector token}
    command:
      - -client-addr=:9443
      - -control-addr=:8443
      - -operator-addr=:8080
      - -tls-cert=/run/mewla-link/tls.crt
      - -tls-key=/run/mewla-link/tls.key
      - -max-clients=4096
      - -max-clients-per-route=32
      - -max-client-handshakes=8192
      - -max-connector-handshakes=1024
    ports:
      - "443:9443"
      - "8443:8443"
    volumes:
      - ./secrets:/run/mewla-link:ro
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/mewla-relay",
          "-check=http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
