# Hosted remote access on one VPS: the relay owns :443 and passes the
# service hostname through to Caddy by SNI; every other hostname is a
# computer's route. See docs/internal/mewla-link-relay.md, "Hosted remote access".
services:
  relay:
    build:
      context: ../..
      dockerfile: daemon/Dockerfile.relay
    restart: unless-stopped
    command:
      - -client-addr=:9443
      - -control-addr=:8443
      - -operator-addr=:8080
      - -tls-cert=/run/mewla-link/relay.crt
      - -tls-key=/run/mewla-link/relay.key
      - -grant-public-key-file=/run/mewla-link/grant.pub
      - -sni-route=${MEWLA_SERVICE_HOST:?set the service hostname}=caddy:443
      - -max-clients=4096
      - -max-clients-per-route=32
      - -max-client-handshakes=8192
      - -max-connector-handshakes=1024
    ports:
      - "443:9443"
      - "8443:8443"
    volumes:
      - ./secrets:/run/mewla-link:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/mewla-relay", "-check=http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  account:
    build:
      context: ../..
      dockerfile: daemon/Dockerfile.account
    restart: unless-stopped
    environment:
      MEWLA_ACCOUNT_GITHUB_CLIENT_ID: ${MEWLA_GITHUB_CLIENT_ID:?create a GitHub OAuth App with device flow}
      MEWLA_ACCOUNT_CLOUDFLARE_TOKEN: ${MEWLA_CLOUDFLARE_TOKEN:?a DNS-edit token for the client zone}
    command:
      - -addr=:8080
      - -db=/var/lib/mewla-account/account.db
      - -grant-key-file=/var/lib/mewla-account/grant-key.pem
      - -public-url=https://${MEWLA_SERVICE_HOST}
      - -client-domain=${MEWLA_CLIENT_DOMAIN:?set the domain machine hostnames live under}
      - -relay=name=main,control=${MEWLA_RELAY_HOST:?set the relay hostname}:8443,server-name=${MEWLA_RELAY_HOST},ca-file=/run/mewla-link/relay.crt
      - -dns-provider=cloudflare
      - -cloudflare-zone-id=${MEWLA_CLOUDFLARE_ZONE_ID:?set the Cloudflare zone id}
    volumes:
      - account-data:/var/lib/mewla-account
      - ./secrets/relay.crt:/run/mewla-link/relay.crt:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/mewla-account", "-check=http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    environment:
      MEWLA_SERVICE_HOST: ${MEWLA_SERVICE_HOST}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  account-data:
  caddy-data:
